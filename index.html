          <div class="flex flex-wrap gap-2">
            ${canalBreakdown.map(cb => {
              const pct = totalUnits > 0 ? ((cb.units / totalUnits) * 100).toFixed(1) : '0.0';
              return `
                <div class="flex-1 min-w-[130px] p-2.5 rounded-lg bg-rose-50/60 border border-rose-200/80">
                  <div class="flex items-center justify-between text-xs">
                    <span class="font-extrabold text-rose-950">${esc(cb.canal)}</span>
                    <span class="font-mono text-[11px] font-bold text-rose-700">${pct}%</span>
                  </div>
                  <div class="text-base font-extrabold text-slate-900 mt-0.5 num !text-left">${fn(cb.units)} <span class="text-[11px] font-normal text-slate-500">unid.</span></div>
                  <div class="text-[11px] font-mono text-slate-600">${fmoney(cb.fob)} · ${fn(cb.skus.size)} SKUs</div>
                </div>
              `;
            }).join('')}
          </div>
        ` : `<div class="text-xs text-slate-400 italic py-2">Sin unidades en DROP en esta temporada.</div>`}
      </div>
    </div>

    <!-- Barra de Controles Dinámicos y Exportación -->
    <div class="bg-white border rounded-xl p-3 mb-3 flex flex-wrap items-center justify-between gap-2.5">
      <div class="flex flex-wrap items-center gap-2">
        <div class="inline-flex rounded-lg border bg-slate-100 p-0.5 text-xs font-semibold">
          <button type="button" id="btnDropViewPivot" class="px-3 py-1.5 rounded-md transition ${dt.viewMode === 'pivot' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}">Tabla Dinámica (SKU × Canal)</button>
          <button type="button" id="btnDropViewMatrix" class="px-3 py-1.5 rounded-md transition ${dt.viewMode === 'matrix' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}">Matriz por Talla</button>
          <button type="button" id="btnDropViewDetail" class="px-3 py-1.5 rounded-md transition ${dt.viewMode === 'detail' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}">Detalle Filas</button>
        </div>

        <div class="relative">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2"></i>
          <input type="text" id="inpDropSearch" class="border rounded-lg pl-8 pr-3 py-1.5 text-xs w-52 bg-white" placeholder="Buscar SKU, descripción, talla..." value="${esc(dt.q)}">
        </div>

        <select id="selDropCanal" class="border rounded-lg px-2.5 py-1.5 text-xs bg-white font-medium">
          <option value="">Todos los canales (${canalesList.length})</option>
          ${canalesList.map(c => `<option value="${esc(c)}" ${dt.canal === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
        </select>

        ${facturasList.length ? `
        <select id="selDropFact" class="border rounded-lg px-2.5 py-1.5 text-xs bg-white">
          <option value="">Todas las facturas (${facturasList.length})</option>
          ${facturasList.map(f => `<option value="${esc(f)}" ${dt.factura === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}
        </select>` : ''}
      </div>

      <button type="button" id="btnExportDynamicDrops" class="btn !bg-emerald-700 !text-white !border-emerald-700 hover:!bg-emerald-800 !text-xs">
        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Exportar Tabla Dinámica Excel
      </button>
    </div>

    ${tableContentHtml}
  `;

  icons();
  $('btnDropViewPivot').onclick = () => { S.dropTab.viewMode = 'pivot'; vDrop(); };
  $('btnDropViewMatrix').onclick = () => { S.dropTab.viewMode = 'matrix'; vDrop(); };
  $('btnDropViewDetail').onclick = () => { S.dropTab.viewMode = 'detail'; vDrop(); };
  let dTimer;
  $('inpDropSearch').oninput = e => {
    S.dropTab.q = e.target.value;
    clearTimeout(dTimer);
    dTimer = setTimeout(vDrop, 160);
  };
  $('selDropCanal').onchange = e => { S.dropTab.canal = e.target.value; vDrop(); };
  if ($('selDropFact')) {
    $('selDropFact').onchange = e => { S.dropTab.factura = e.target.value; vDrop(); };
  }
  $('btnExportDynamicDrops').onclick = () => exportDropsPivotExcel(pivotData, filteredRows);
}

/* ============ INICIALIZACIÓN ============ */
$('fBuyInit').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadBuyInitial(f); };
$('fBuyExtra').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadBuyExtra(f); };
$('fOcPrelim').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadOcPreliminar(f); };
$('fOcFinal').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadOcFinalProducto(f); };
$('fOcDirect').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadOcDirectComplete(f); };
$('fBillingBrand').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  pendingBillingFile = f;
  if ($('lblBillFileName')) {
    $('lblBillFileName').innerHTML = `<span class="font-semibold text-sky-900">✓ ${esc(f.name)}</span>`;
    if ($('btnRunBillCross')) $('btnRunBillCross').disabled = false;
  } else {
    processBrandBilling(f, null);
  }
};
$('fPtsAssign').onchange = e => {
  const f = e.target.files[0];
  const mode = e.target.dataset.mode || '';
  e.target.value = '';
  if (!f) return;
  if (mode === 'pair') {
    pendingPtsFile = f;
    if ($('lblPtsFileName')) {
      $('lblPtsFileName').innerHTML = `<span class="font-semibold text-teal-900">✓ ${esc(f.name)}</span>`;
    }
  } else {
    assignPtsToForwarder(f);
  }
};
$('fSizeMap').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadSizeMapExcel(f); };
$('fSapCatalog').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadSapCatalogExcel(f); };
$('fDepcoBill').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  pendingDepcoBillFile = f;
  if ($('lblDepcoBillName')) {
    $('lblDepcoBillName').innerHTML = `<span class="font-semibold text-indigo-900">✓ ${esc(f.name)}</span>`;
    if ($('btnRunDepco1')) $('btnRunDepco1').disabled = false;
  }
};
$('fDepcoPts').onchange = e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  pendingDepcoPtsFile = f;
  if ($('lblDepcoPtsName')) {
    $('lblDepcoPtsName').innerHTML = `<span class="font-semibold text-teal-900">✓ ${esc(f.name)}</span>`;
  }
};
$('fDepcoConsol').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) processDepcoConsolidatedOc(f); };
$('fTiendasDistFinal').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadTiendasFinalDistribution(f); };
$('fCloudBundleImport').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importOneDriveBundleFile(f); };
$('fJsonImport').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importJsonBackup(f); };
$('fBrandLogo').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) handleLogoUpload(f); };
$('fPresTemplate').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) loadPresentationTemplate(f); };
(async () => {
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
    db = await openDB();
    const m = await rq(db.transaction('meta').objectStore('meta').get('seasons'));
    if (m) S.seasons = m;
    const savedLogos = await rq(db.transaction('meta').objectStore('meta').get('logos'));
    if (savedLogos) S.logos = savedLogos;
    const savedTemplates = await rq(db.transaction('meta').objectStore('meta').get('templates'));
    if (savedTemplates) S.templates = savedTemplates;
    const savedSizePairs = await rq(db.transaction('meta').objectStore('meta').get('sizePairs'));
    if (Array.isArray(savedSizePairs)) S.sizePairs = savedSizePairs;
    const savedSapCat = await rq(db.transaction('meta').objectStore('meta').get('sapCatalog'));
    if (savedSapCat && typeof savedSapCat === 'object') S.sapCatalog = savedSapCat;
    const savedBillingHist = await rq(db.transaction('meta').objectStore('meta').get('billingHistory'));
    if (savedBillingHist && typeof savedBillingHist === 'object') {
      S.billingHistory = { Adidas: [], Reebok: [], ...savedBillingHist };
    }
    const savedRbkDrops = await rq(db.transaction('meta').objectStore('meta').get('reebokDropAlerts'));
    if (Array.isArray(savedRbkDrops)) S.reebokDropAlerts = savedRbkDrops;
    const savedDepcoHist = await rq(db.transaction('meta').objectStore('meta').get('depcoLpnHistory'));
    if (Array.isArray(savedDepcoHist)) S.depcoLpnHistory = savedDepcoHist;
    const savedTiendasHist = await rq(db.transaction('meta').objectStore('meta').get('tiendasConsolHistory'));
    if (Array.isArray(savedTiendasHist)) S.tiendasConsolHistory = savedTiendasHist;
    const act = await rq(db.transaction('meta').objectStore('meta').get('active'));
    if (act && act.brand && act.season) {
      S.brand = act.brand;
      S.season = act.season;
    }
    await loadSavedCloudHandle();
    if (S.cloud.dirHandle && S.cloud.connected && S.cloud.autoSync) {
      await pullFromCloudFolder(false, true);
    } else {
      await reload();
    }
    updateCloudBadge();
  } catch(e) {
    document.body.innerHTML = '<p class="p-8">Error iniciando IndexedDB: ' + esc(e.message) + '</p>';
  }
})();
</script>
