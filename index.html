}

async function buildDepcoLpnOrder(billFile, ptsFile = null, embOverride = '') {
  try {
    busy('Generando OC (LPN) Embarque - Consolidado desde Facturación Adidas…');
    await tick();
    const ptsMap = ptsFile ? await parsePtsExcelMap(ptsFile) : new Map();
    const ptsEmbs = [...new Set(ptsMap.values())];
    const defaultEmb = embOverride || ptsEmbs[0] || 'CONSOLIDADO DEPCO';

    const wb = XLSX.read(await billFile.arrayBuffer(), { type: 'array', cellDates: true });
    const targetSheet = wb.Sheets['Sheet1'] ? 'Sheet1' : (wb.Sheets['Hoja1'] ? 'Hoja1' : wb.SheetNames[0]);
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[targetSheet], { defval: '', raw: true });
    if (!raw.length) throw new Error('El archivo de facturación Adidas está vacío.');

    const sizeLookup = buildTallaSapLookup();
    const { tplBySeason, globalTplItems } = getBrandTplCatalogMap('Adidas');
    const allAdidasRows = await getAllBrandRows('Adidas');

    // Construir pool virtual mutable de saldos 10A para asignar CANAL FACTURA de forma fiel a las unidades disponibles
    const virtualPoolBySeasonCod = new Map();
    const virtualPoolByCod = new Map();
    const allRowsByCod = new Map();
    for (const r of allAdidasRows) {
      const cod = norm(r['Código']);
      if (!cod) continue;
      if (!allRowsByCod.has(cod)) allRowsByCod.set(cod, []);
      allRowsByCod.get(cod).push(r);
      if (st(r) === 'o' && Number(r['Cantidad'] || 0) > 0) {
        const temp = norm(r.season || r['Temporada']);
        const vItem = {
          temp,
          cod,
          tal: normTalla(r['Talla']),
          talM: normTalla(r['Talla marca']),
          canalFact: normalizeStoreChannelForLpn(r['Canal Inicial'] || r['Referencia compra'], 'Adidas'),
          rem: Number(r['Cantidad'] || 0)
        };
        const scKey = `${temp}|${cod}`;
        if (!virtualPoolBySeasonCod.has(scKey)) virtualPoolBySeasonCod.set(scKey, []);
        virtualPoolBySeasonCod.get(scKey).push(vItem);
        if (!virtualPoolByCod.has(cod)) virtualPoolByCod.set(cod, []);
        virtualPoolByCod.get(cod).push(vItem);
      }
    }

    const parseNum = v => Number(String(v ?? '').replace(/[^0-9.,-]/g, '').replace(',', '.')) || 0;
    const outputRows = [];
    const canalSummary = {};
    let totalUnits = 0;

    for (const o of raw) {
      const matRaw = String(getRowVal(o, ['Material', 'Item Description', 'Código', 'Codigo']) ?? '').trim();
      const codNorm = norm(matRaw);
      const qty = parseNum(getRowVal(o, ['Delivery quantity', 'Delivery Quantity', 'LPN Detail Size Value', 'Cantidad', 'QTY']));
      if (!codNorm || qty <= 0) continue;

      // Filtrar por PTs si el usuario cargó archivo de PTs COMEX
      const ptRaw = normalizePtId(getRowVal(o, ['Delivery', 'Order ID', 'PT', 'Entrega']));
      if (ptsMap.size > 0 && ptRaw && !ptsMap.has(ptRaw)) {
        continue; // Solo incluir en este LPN los PTs que entran en el embarque consolidado
      }

      const lpnId = normalizePtId(getRowVal(o, ['Carton Nr.', 'Carton Nr', 'Carton Number', 'LPN ID', 'LPN', 'Carton'])) || '';
      const invNum = String(getRowVal(o, ['Invoice Number', 'Invoices', 'Factura', 'No FACTURA']) ?? '').trim();
      const invDate = fdate(getRowVal(o, ['Invoice Date', 'FECHA DE FACTURA', 'Fecha de factura', 'Additional Date']));
      const poRaw = String(getRowVal(o, ['Purchase order no. (35 char)', 'Purchase order no.', 'Purchase Order', 'PO']) ?? '').trim();
      const gridVal = String(getRowVal(o, ['Grid Value', 'Item Size', 'Talla marca']) ?? '').trim();
      const explicitSap = String(getRowVal(o, ['TALLA SAP', 'Talla SAP']) ?? '').trim();
      const fobMarca = parseNum(getRowVal(o, ['Net price', 'Net Price', 'FOB MARCA', 'FOB']));
      const eanFromBill = String(getRowVal(o, ['EAN', 'Item Bar Code', 'EAN/UPC', 'UPC']) ?? '').trim();

      const seasonDet = extractSeasonFromPO(poRaw, S.season);
      const seasonTpl = tplBySeason[norm(seasonDet)] || globalTplItems;
      const tplItem = seasonTpl ? seasonTpl[codNorm] : null;

      const linea = (tplItem && tplItem.linea) ? tplItem.linea : String(getRowVal(o, ['LINEA', 'Línea', 'Product line']) ?? '').trim();
      const grupo = (tplItem && tplItem.grupo) ? tplItem.grupo : String(getRowVal(o, ['GRUPO', 'Product Type Description']) ?? '').trim();
      const categoria = getTplFieldFromEntry(tplItem, 'categoria', ['tipoventa', 'categoria']) || String(getRowVal(o, ['CATEGORIA', 'TIPO_VENTA', 'Division']) ?? '').trim();
      const actividad = (tplItem && tplItem.actividad) ? tplItem.actividad : String(getRowVal(o, ['ACTIVIDAD', 'Sport Description']) ?? '').trim();
      const descripcion = (tplItem && tplItem.descripcion) ? tplItem.descripcion : String(getRowVal(o, ['Material Description', 'DESCRIPCION', 'Name']) ?? '').trim();
      const genero = (tplItem && tplItem.genero) ? tplItem.genero : String(getRowVal(o, ['GENERO', 'Gender']) ?? '').trim();
      const pvp = (tplItem && tplItem.pvp > 0) ? tplItem.pvp : parseNum(getRowVal(o, ['PVP']));
      const p4 = (tplItem && tplItem.p4 > 0) ? tplItem.p4 : parseNum(getRowVal(o, ['P4']));
      const pmy = (tplItem && tplItem.pmy > 0) ? tplItem.pmy : parseNum(getRowVal(o, ['PMY']));

      const poolForSku = allRowsByCod.get(codNorm) || [];
      const tallaSap = resolveTallaSapFromGrid(gridVal, explicitSap, sizeLookup, poolForSku, {
        brand: 'Adidas',
        material: matRaw,
        grupo
      });

      const idNoSpace = `${matRaw}${tallaSap}`.replace(/\s+/g, '');
      const idfNoSpace = `${matRaw}${tallaSap}${invNum}`.replace(/\s+/g, '');
      const sapHit = lookupSapEanFromCatalog('Adidas', matRaw, tallaSap);
      const sapCode = sapHit ? sapHit.marSap : '';
      const eanCode = (sapHit && sapHit.eanSap) ? sapHit.eanSap : eanFromBill;

      // Deducir CANAL FACTURA desde disponibilidad en 10A (normalizando tiendas a TIENDAS)
      const tempNorm = norm(seasonDet);
      const talNorm = normTalla(tallaSap);
      const gridNorm = normTalla(gridVal);
      const candidates10A = [
        ...(virtualPoolBySeasonCod.get(`${tempNorm}|${codNorm}`) || []),
        ...(virtualPoolByCod.get(codNorm) || [])
      ].filter((v, idx, arr) => arr.indexOf(v) === idx && v.rem > 0 && (v.tal === talNorm || (gridNorm && v.talM === gridNorm)));

      let canalFactura = '';
      if (candidates10A.length > 0) {
        // Priorizar coincidencia exacta de temporada y tomar el canal con saldo disponible
        candidates10A.sort((a, b) => ((b.temp === tempNorm ? 10 : 0) + (b.rem >= qty ? 5 : 0)) - ((a.temp === tempNorm ? 10 : 0) + (a.rem >= qty ? 5 : 0)));
        const best = candidates10A[0];
        canalFactura = best.canalFact;
        best.rem = Math.max(0, best.rem - qty);
      }
      if (!canalFactura) {
        canalFactura = normalizeStoreChannelForLpn(resolveCanalInicialFromPO(poRaw), 'Adidas') || 'TIENDAS';
      }

      const rowEmb = embOverride || (ptRaw && ptsMap.has(ptRaw) ? ptsMap.get(ptRaw) : defaultEmb);
      totalUnits += qty;
      canalSummary[canalFactura] = (canalSummary[canalFactura] || 0) + qty;

      outputRows.push([
        lpnId, matRaw, 'ADIDAS', linea, grupo, categoria, actividad, descripcion, genero,
        fobMarca, pvp, p4, pmy, gridVal, qty, tallaSap, idNoSpace, sapCode, eanCode,
        ptRaw, invDate, invNum, eanCode, idfNoSpace, canalFactura, rowEmb
      ]);
    }

    if (!outputRows.length) {
      busy();
      return modal('Sin filas generadas', 'No se encontraron líneas válidas (o ningún PT coincidió con el archivo de PTs de COMEX seleccionado).');
    }

    const embLabel = embOverride || defaultEmb || 'EMBARQUE';
    const wbOut = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wbOut, XLSX.utils.aoa_to_sheet([LPN_OC_HEADERS, ...outputRows]), 'Hoja1');
    const outFileName = `OC (LPN) ${embLabel}.xlsx`;
    XLSX.writeFile(wbOut, outFileName);

    busy();
    const canalBadges = Object.entries(canalSummary)
      .sort((a, b) => b[1] - a[1])
      .map(([c, u]) => `<span class="inline-block bg-indigo-50 border border-indigo-200 text-indigo-950 px-2 py-0.5 rounded text-xs font-semibold mr-1.5 mb-1">${esc(c)}: ${fn(u)} unid.</span>`)
      .join('');

    modal(
      'OC (LPN) Generada y Descargada',
      `<div class="space-y-2.5 text-slate-700">
         <p>Se generó el archivo <b>${esc(outFileName)}</b> listo para enviar a Producto con <b>${fn(outputRows.length)} líneas de cartón (LPN)</b> y <b>${fn(totalUnits)} unidades</b>.</p>
         <div class="p-3 rounded-lg bg-slate-50 border text-xs">
           <div class="font-bold text-slate-800 mb-1.5">Distribución por CANAL FACTURA (cruzado vs. 10A):</div>
           <div>${canalBadges}</div>
         </div>
         <p class="text-xs text-slate-500">Todos los códigos de tienda fueron normalizados a <code>TIENDAS</code>. Cuando Producto te devuelva este archivo con las columnas <code>INSTRUCCIÓN</code> y <code>CANAL FINAL</code>, súbelo en el <b>Paso 2</b>.</p>
       </div>`
    );
  } catch (e) {
    busy();
    modal('Error al generar OC (LPN)', esc(e.message || e));
  }
}

/* ============ PASO 2 DEPCO: PROCESAR OC (LPN) - CONSOLIDADO DE PRODUCTO + INGRESOS TIENDAS CONSOLIDADO ============ */
function buildIngresosTiendasConsolidatedRows(tiendasLpnItems, allAdidasRows, embName, sizeLookup, tplBySeason, globalTplItems) {
  // Pool de líneas 10A de Adidas (priorizando TIENDAS primero, pero permitiendo cruce desde otros canales con OBS = IMPORTADO POR CRUCE)
  const poolTiendas = [];
  const poolOtrosCanales = [];
  for (const r of allAdidasRows) {
    if (st(r) !== 'o' || Number(r['Cantidad'] || 0) <= 0) continue;
    const cIni = normalizeStoreChannelForLpn(r['Canal Inicial'] || r['Referencia compra'], 'Adidas');
    const clone = {
      src: r,
      rem: Number(r['Cantidad'] || 0),
      codNorm: norm(r['Código']),
      talNorm: normTalla(r['Talla']),
      talMNorm: normTalla(r['Talla marca']),
      isTiendaOrig: cIni === 'TIENDAS'
    };
    if (clone.isTiendaOrig) poolTiendas.push(clone);
    else poolOtrosCanales.push(clone);
  }

  const outRows = [];
  let cruceUnits = 0;

  for (const item of tiendasLpnItems) {
    const codNorm = norm(item.codigo);
    const talNorm = normTalla(item.tallaSap);
    const gridNorm = normTalla(item.itemSize);
    let rem = item.qty;

    const matchPred = p => p.rem > 0 && p.codNorm === codNorm && (p.talNorm === talNorm || (gridNorm && p.talMNorm === gridNorm) || p.talNorm === gridNorm);
    const candidates = [
      ...poolTiendas.filter(matchPred),
      ...poolOtrosCanales.filter(matchPred)
    ];

    const pushFormattedRow = (baseSrc, takeQty, isCruce) => {
      const refCompra = baseSrc ? (baseSrc['Referencia compra'] || 'PR02') : 'PR02';
      const tempRow = baseSrc ? (baseSrc['Temporada'] || baseSrc.season || S.season) : S.season;
      const segRow = baseSrc ? (baseSrc['Seguimiento'] || '') : '';
      const seasonTpl = tplBySeason[norm(tempRow)] || globalTplItems;
      const tplItem = seasonTpl ? seasonTpl[codNorm] : null;

      const grupo = item.grupo || (baseSrc && baseSrc['Grupo']) || (tplItem && tplItem.grupo) || '';
      const cat = item.categoria || (baseSrc && baseSrc['Categoría']) || (tplItem && tplItem.categoria) || '';
      const act = item.actividad || (baseSrc && baseSrc['Actividad']) || (tplItem && tplItem.actividad) || '';
      const color = (baseSrc && baseSrc['Color']) || (tplItem && tplItem.color) || '';
      const desc = item.descripcion || (baseSrc && baseSrc['Descripción']) || (tplItem && tplItem.descripcion) || '';
      const gen = item.genero || (baseSrc && baseSrc['Género']) || (tplItem && tplItem.genero) || '';
      const fEntrega = (baseSrc && baseSrc['Fecha de entrega']) || (tplItem && tplItem.fEntrega) || '';
      const fEstIni = (baseSrc && baseSrc['Fecha estimada inicio']) || '';
      const fRealIni = (baseSrc && baseSrc['Fecha real inicio']) || '';
      const fEstFin = (baseSrc && baseSrc['Fecha estimada fin']) || '';
      const fobIni = (baseSrc && Number(baseSrc['FOB']) > 0) ? Number(baseSrc['FOB']) : item.fobMarca;
      const pvpIni = item.pvp > 0 ? item.pvp : ((baseSrc && Number(baseSrc['PVP'])) || 0);
      const p4Ini = item.p4 > 0 ? item.p4 : ((baseSrc && Number(baseSrc['P4'])) || 0);
      const pmyIni = item.pmy > 0 ? item.pmy : ((baseSrc && Number(baseSrc['PMY'])) || 0);
      const pvpFin = item.pvpFinal > 0 ? item.pvpFinal : pvpIni;
      const p4Fin = item.p4Final > 0 ? item.p4Final : p4Ini;
      const pmyFin = item.pmyFinal > 0 ? item.pmyFinal : pmyIni;

      const idCanalTemp = `${item.codigo}TIENDAS${tempRow}`.replace(/\s+/g, '');
      const idCodTalla = `${item.codigo}${item.tallaSap}`.replace(/\s+/g, '');
      const sapHit = lookupSapEanFromCatalog('Adidas', item.codigo, item.tallaSap);
      const sapCode = item.sap || (sapHit ? sapHit.marSap : '');
      const eanCode = item.ean || (sapHit ? sapHit.eanSap : '');
      const obsVal = isCruce ? 'IMPORTADO POR CRUCE' : (item.obs || '');
      if (isCruce) cruceUnits += takeQty;

      outRows.push([
        segRow, tempRow, 2, grupo, cat, act, refCompra, 'TIENDAS',
        idCanalTemp, idCanalTemp, item.codigo, item.tallaSap, idCodTalla, sapCode, eanCode,
        color, item.tallaSap, item.itemSize, '', desc, gen, '',
        fEntrega, '', takeQty, fobIni, pvpIni, p4Ini, pmyIni, pvpFin, p4Fin, pmyFin,
        E10, '-', '', '', '', fEstIni, fRealIni, fEstFin, '',
        item.invoices, item.invoiceDate, item.fobMarca, embName, obsVal
      ]);
    };

    for (let i = 0; i < candidates.length && rem > 0; i++) {
      const cand = candidates[i];
      const take = Math.min(cand.rem, rem);
      cand.rem -= take;
      rem -= take;
      pushFormattedRow(cand.src, take, !cand.isTiendaOrig);
    }
    if (rem > 0) {
      pushFormattedRow(null, rem, true);
    }
  }

  return { rows: outRows, cruceUnits };
}

function exportIngresosTiendasExcel(rows, seqNum, monthName) {
  if (!rows || !rows.length) return modal('Sin datos', 'No hay registros de TIENDAS para exportar.');
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([INGRESOS_TIENDAS_HEADERS, ...rows]), 'Hoja1');
  const fname = `INGRESOS TIENDAS CONSOLIDADO ${seqNum} ${monthName.toUpperCase()}.xlsx`;
  XLSX.writeFile(wb, fname);
}

async function processDepcoConsolidatedOc(file) {
  try {
    busy('Analizando OC (LPN) - CONSOLIDADO de Producto…');
    await tick();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    // Buscar la hoja principal que contiene LPN ID e INSTRUCCIÓN
    let targetSheet = wb.Sheets['Hoja1'] ? 'Hoja1' : wb.SheetNames[0];
    for (const sName of wb.SheetNames) {
      const testAoa = XLSX.utils.sheet_to_json(wb.Sheets[sName], { header: 1, nrows: 3 });
      if (testAoa.length && testAoa[0].some(c => norm(c) === 'lpnid' || norm(c) === 'instruccion')) {
        targetSheet = sName;
        break;
      }
    }
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[targetSheet], { defval: '', raw: true });
    if (!raw.length) throw new Error('No se encontraron filas en la OC Consolidada.');

    const parsePrice = v => Number(String(v ?? '').replace(/[^0-9.,-]/g, '').replace(',', '.')) || 0;
    const sizeLookup = buildTallaSapLookup();
    const { tplBySeason, globalTplItems } = getBrandTplCatalogMap('Adidas');
    const allAdidasRows = await getAllBrandRows('Adidas');

    const parsedItems = [];
    let importUnits = 0;
    let depcoUnits = 0;
    let tiendasUnits = 0;
    const canalFinalSummary = {};
    let detectedEmb = '';
    let latestInvDate = '';

    for (const o of raw) {
      const codigo = String(getRowVal(o, ['Item Description', 'Código', 'Codigo', 'Material']) ?? '').trim();
      const qty = parsePrice(getRowVal(o, ['LPN Detail Size Value', 'Cantidad', 'QTY', 'Delivery quantity']));
      if (!codigo || qty <= 0) continue;

      const lpnId = normalizePtId(getRowVal(o, ['LPN ID', 'Carton Nr.', 'LPN']));
      const itemSize = String(getRowVal(o, ['Item Size', 'Grid Value', 'Talla marca']) ?? '').trim();
      const explicitSap = String(getRowVal(o, ['TALLA SAP', 'Talla SAP', 'Talla']) ?? '').trim();
      const grupo = String(getRowVal(o, ['GRUPO', 'Grupo']) ?? '').trim();
      const tallaSap = resolveTallaSapFromGrid(itemSize, explicitSap, sizeLookup, [], { brand: 'Adidas', material: codigo, grupo });

      const instrRaw = String(getRowVal(o, ['INSTRUCCIÓN', 'INSTRUCCION', 'Instrucción']) ?? '').trim().toUpperCase();
      const canalFinalRaw = normalizarCanal(getRowVal(o, ['CANAL FINAL', 'Canal Final', 'CANAL']));
      const refTiendaExplicit = String(getRowVal(o, ['Referencia compra', 'REFERENCIA COMPRA', 'TIENDA', 'CENTRO']) ?? '').trim().toUpperCase();
      const isNoImportar = instrRaw.includes('NO IMPORTAR') || canalFinalRaw === 'DEPCO';
      const instruccion = isNoImportar ? 'NO IMPORTAR' : 'IMPORTAR';
      const isSpecificStoreInCanal = !isNoImportar && canalFinalRaw && canalFinalRaw !== 'TIENDAS' && resolverCanalInicial(canalFinalRaw, 'Adidas') === 'TIENDAS';
      const refTiendaFinal = !isNoImportar
        ? ((refTiendaExplicit && refTiendaExplicit !== 'TIENDAS') ? refTiendaExplicit : (isSpecificStoreInCanal ? canalFinalRaw : ''))
        : '';
      const canalFinal = isNoImportar
        ? 'DEPCO'
        : ((isSpecificStoreInCanal || (refTiendaFinal && resolverCanalInicial(refTiendaFinal, 'Adidas') === 'TIENDAS'))
            ? 'TIENDAS'
            : (canalFinalRaw || normalizarCanal(getRowVal(o, ['CANAL FACTURA']))));

      const emb = String(getRowVal(o, ['EMBARQUE', 'Embarque']) ?? '').trim() || 'CONSOLIDADO DEPCO';
      if (!detectedEmb && emb) detectedEmb = emb;
      const invDate = fdate(getRowVal(o, ['Invoice Date', 'Fecha de factura']));
      if (invDate && invDate > latestInvDate) latestInvDate = invDate;

      const item = {
        lpnId,
        codigo,
        codNorm: norm(codigo),
        marca: String(getRowVal(o, ['MARCA', 'Marca']) ?? 'ADIDAS').trim(),
        linea: String(getRowVal(o, ['LINEA', 'Línea']) ?? '').trim(),
        grupo,
        categoria: String(getRowVal(o, ['CATEGORIA', 'Categoría']) ?? '').trim(),
        actividad: String(getRowVal(o, ['ACTIVIDAD', 'Actividad']) ?? '').trim(),
        descripcion: String(getRowVal(o, ['DESCRIPCION', 'Descripción']) ?? '').trim(),
        genero: String(getRowVal(o, ['GENERO', 'Género']) ?? '').trim(),
        fobMarca: parsePrice(getRowVal(o, ['FOB MARCA', 'FOB', 'Net price'])),
        pvp: parsePrice(getRowVal(o, ['PVP'])),
        p4: parsePrice(getRowVal(o, ['P4'])),
        pmy: parsePrice(getRowVal(o, ['PMY'])),
        pvpFinal: parsePrice(getRowVal(o, ['PVP FINAL', 'PVP Final'])),
        p4Final: parsePrice(getRowVal(o, ['P4.1', 'P4 FINAL', 'P4 Final'])),
        pmyFinal: parsePrice(getRowVal(o, ['PMY.1', 'PMY FINAL', 'PMY Final'])),
        itemSize,
        qty,
        tallaSap,
        sap: String(getRowVal(o, ['SAP']) ?? '').trim(),
        ean: String(getRowVal(o, ['EAN', 'Item Bar Code']) ?? '').trim(),
        orderId: normalizePtId(getRowVal(o, ['Order ID', 'Delivery'])),
        invoiceDate: invDate,
        invoices: String(getRowVal(o, ['Invoices', 'Factura']) ?? '').trim(),
        canalFactura: normalizarCanal(getRowVal(o, ['CANAL FACTURA'])),
        instruccion,
        canalFinal,
        refTiendaFinal,
        obs: String(getRowVal(o, ['OBS']) ?? '').trim(),
        embarque: emb,
        cm: String(getRowVal(o, ['CM']) ?? '').trim(),
        microsite: String(getRowVal(o, ['MICROSITE']) ?? '').trim()
      };

      parsedItems.push(item);
      if (isNoImportar) {
        depcoUnits += qty;
      } else {
        importUnits += qty;
        canalFinalSummary[canalFinal] = (canalFinalSummary[canalFinal] || 0) + qty;
        if (canalFinal === 'TIENDAS') tiendasUnits += qty;
      }
    }

    if (!parsedItems.length) throw new Error('No se encontraron líneas válidas en la OC Consolidada.');

    // Construir previsualización de INGRESOS TIENDAS CONSOLIDADO
    const tiendasItems = parsedItems.filter(x => x.instruccion === 'IMPORTAR' && x.canalFinal === 'TIENDAS');
    const tiendasBuild = buildIngresosTiendasConsolidatedRows(tiendasItems, allAdidasRows, detectedEmb, sizeLookup, tplBySeason, globalTplItems);

    // Calcular siguiente correlativo mensual automático para INGRESOS TIENDAS CONSOLIDADO
    const refMonthIdx = latestInvDate ? parseInt(latestInvDate.split('-')[1], 10) : (new Date().getMonth() + 1);
    const defaultMonthName = MESES_ES[(refMonthIdx >= 1 && refMonthIdx <= 12 ? refMonthIdx : 1) - 1].toUpperCase();
    const existingSameMonth = (S.tiendasConsolHistory || []).filter(h => String(h.month || '').toUpperCase() === defaultMonthName);
    const nextSeq = existingSameMonth.length + 1;

    busy();
    const canalBadges = Object.entries(canalFinalSummary)
      .sort((a, b) => b[1] - a[1])
      .map(([c, u]) => `<span class="inline-block bg-emerald-50 border border-emerald-200 text-emerald-950 px-2 py-0.5 rounded text-xs font-semibold mr-1.5 mb-1">${esc(c)}: ${fn(u)} unid.</span>`)
      .join('');

    const ch = await modal(
      `Confirmar OC (LPN) - CONSOLIDADO · ${esc(detectedEmb)}`,
      `<div class="space-y-3 text-slate-700">
         <p>Se procesaron <b>${fn(parsedItems.length)} líneas de cartón (LPN)</b> del embarque <b>${esc(detectedEmb)}</b>:</p>
         <div class="grid grid-cols-2 gap-2.5 text-xs">
           <div class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-950">
             <div class="font-bold uppercase text-[11px] text-emerald-800">IMPORTAR → P24 (Nacionaliza)</div>
             <div class="text-lg font-bold mt-0.5">${fn(importUnits)} unid.</div>
             <div class="mt-1">${canalBadges || 'Sin unidades'}</div>
           </div>
           <div class="p-3 rounded-lg bg-indigo-50 border border-indigo-200 text-indigo-950">
             <div class="font-bold uppercase text-[11px] text-indigo-800">NO IMPORTAR → Saldo DEPCO</div>
             <div class="text-lg font-bold mt-0.5">${fn(depcoUnits)} unid.</div>
             <div class="text-[11px] text-indigo-700 mt-1">Quedan en inventario <b>DEPCO</b> para nacionalizaciones futuras.</div>
           </div>
         </div>
         ${tiendasItems.length > 0 ? `
         <div class="p-3 rounded-lg bg-sky-50 border border-sky-200 text-sky-950 text-xs space-y-2">
           <div class="font-bold flex items-center gap-1.5"><i data-lucide="store" class="w-4 h-4 text-sky-700"></i> Archivo automático: INGRESOS TIENDAS CONSOLIDADO</div>
           <div>Se generarán <b>${fn(tiendasBuild.rows.length)} líneas</b> (<b>${fn(tiendasUnits)} unidades</b> de TIENDAS, incluyendo <b>${fn(tiendasBuild.cruceUnits)} unid.</b> marcadas como <code>IMPORTADO POR CRUCE</code>).</div>
           <div class="grid grid-cols-2 gap-2 pt-1">
             <div>
               <label class="block text-[11px] font-semibold mb-0.5">Número Consolidado Mensual</label>
               <input type="number" id="inpTiendasSeq" min="1" class="border rounded px-2 py-1 text-xs w-full bg-white font-bold" value="${nextSeq}">
             </div>
             <div>
               <label class="block text-[11px] font-semibold mb-0.5">Mes del Consolidado</label>
               <input type="text" id="inpTiendasMonth" class="border rounded px-2 py-1 text-xs w-full bg-white font-bold uppercase" value="${esc(defaultMonthName)}">
             </div>
           </div>
         </div>` : ''}
         <div>
           <label class="block text-xs font-semibold text-slate-700 mb-1">Fecha de ingreso embarque (Para líneas IMPORTAR → P24)</label>
           <input type="date" id="inpDepcoFechaIng" class="border rounded px-2.5 py-1.5 text-sm w-full bg-white">
         </div>
       </div>`,
      [['Cancelar', 'c'], ['Aplicar a Tracking y Generar Ingresos Tiendas', 'ok', 1]]
    );
    icons();
    if (ch !== 'ok') return;

    const seqNum = Number($('inpTiendasSeq') ? $('inpTiendasSeq').value : nextSeq) || nextSeq;
    const monthLabel = ($('inpTiendasMonth') ? $('inpTiendasMonth').value.trim().toUpperCase() : defaultMonthName) || defaultMonthName;
    const fechaIngreso = $('inpDepcoFechaIng') ? $('inpDepcoFechaIng').value.trim() : '';

    busy('Actualizando Tracking (P24 + DEPCO) y preparando Ingresos Tiendas…');
    await tick();

    // Indexar filas 10A de Adidas por Código + Talla
    const pool10AByCod = new Map();
    for (const r of allAdidasRows) {
      if (st(r) === 'o' && Number(r['Cantidad'] || 0) > 0) {
        const c = norm(r['Código']);
        if (!pool10AByCod.has(c)) pool10AByCod.set(c, []);
        pool10AByCod.get(c).push(r);
      }
    }

    const changed = new Set();
    const added = [];
    const affectedSeasons = new Set();

    // Agrupar items por Código + Talla + Instrucción + Canal Final + Factura + Embarque para impacto limpio en base maestra
    const groupedImpact = new Map();
    for (const it of parsedItems) {
      const gKey = `${it.codNorm}|${normTalla(it.tallaSap)}|${it.instruccion}|${it.canalFinal}|${it.invoices}|${it.embarque}`;
      if (!groupedImpact.has(gKey)) {
        groupedImpact.set(gKey, { ...it, lpnIds: new Set(it.lpnId ? [it.lpnId] : []) });
      } else {
        const g = groupedImpact.get(gKey);
        g.qty += it.qty;
        if (it.lpnId) g.lpnIds.add(it.lpnId);
      }
    }

    for (const grp of groupedImpact.values()) {
      const talNorm = normTalla(grp.tallaSap);
      const gridNorm = normTalla(grp.itemSize);
      const targetStage = grp.instruccion === 'NO IMPORTAR' ? EDEPCO : EP;
      const targetRegimen = grp.instruccion === 'NO IMPORTAR' ? 'DEPCO' : 'CONSOLIDADO / DEPCO';
      const lpnJoined = [...grp.lpnIds].slice(0, 5).join(', ') + (grp.lpnIds.size > 5 ? ` (+${grp.lpnIds.size - 5})` : '');

      const candidates = (pool10AByCod.get(grp.codNorm) || []).filter(r => {
        if (st(r) !== 'o' || Number(r['Cantidad'] || 0) <= 0) return false;
        const rTal = normTalla(r['Talla']);
        const rTalM = normTalla(r['Talla marca']);
        return rTal === talNorm || (gridNorm && rTalM === gridNorm) || rTal === gridNorm;
      });

      // Priorizar filas cuyo Canal Inicial coincida con CANAL FACTURA o CANAL FINAL
      candidates.sort((a, b) => {
        const ca = normalizeStoreChannelForLpn(a['Canal Inicial'] || a['Referencia compra'], 'Adidas');
        const cb = normalizeStoreChannelForLpn(b['Canal Inicial'] || b['Referencia compra'], 'Adidas');
        const sa = (ca === grp.canalFactura ? 20 : 0) + (ca === grp.canalFinal ? 10 : 0);
        const sb = (cb === grp.canalFactura ? 20 : 0) + (cb === grp.canalFinal ? 10 : 0);
        return sb - sa;
      });

      const applyDecisionToRow = targetRow => {
        targetRow['Etapa'] = targetStage;
        targetRow['Régimen'] = targetRegimen;
        if (lpnJoined) targetRow['LPN ID'] = lpnJoined;
        if (grp.invoices) targetRow['Factura'] = grp.invoices;
        if (grp.orderId) targetRow['Delivery'] = grp.orderId;
        if (grp.invoiceDate) targetRow['Fecha de factura'] = grp.invoiceDate;
        targetRow['EMBARQUE'] = grp.embarque;
        if (grp.instruccion === 'IMPORTAR' && fechaIngreso) {
          targetRow['Fecha de ingreso embarque'] = fechaIngreso;
        }
        targetRow['Canal Final'] = grp.canalFinal;
        if (grp.refTiendaFinal) targetRow['Referencia compra'] = grp.refTiendaFinal;
        else if (grp.canalFinal && grp.canalFinal !== 'TIENDAS' && grp.canalFinal !== 'DEPCO') targetRow['Referencia compra'] = grp.canalFinal;
        if (grp.fobMarca > 0) targetRow['FOB'] = grp.fobMarca;
        if (grp.pvpFinal > 0) targetRow['PVP Final'] = grp.pvpFinal;
        if (grp.p4Final > 0) targetRow['P4 Final'] = grp.p4Final;
        if (grp.pmyFinal > 0) targetRow['PMY Final'] = grp.pmyFinal;
        if (grp.obs) targetRow['OBS'] = grp.obs;
        targetRow['Valor Neto'] = calcValorNeto(targetRow);
      };

      let rem = grp.qty;
      for (let i = 0; i < candidates.length && rem > 0; i++) {
        const baseRow = candidates[i];
        const avail = Number(baseRow['Cantidad'] || 0);
        if (avail <= 0 || st(baseRow) !== 'o') continue;
        affectedSeasons.add(baseRow.season || S.season);

        if (avail <= rem) {
          rem -= avail;
          applyDecisionToRow(baseRow);
          changed.add(baseRow);
        } else {
          const splitRow = { ...baseRow };
          delete splitRow.id;
          splitRow['Cantidad'] = rem;
          applyDecisionToRow(splitRow);
          baseRow['Cantidad'] = avail - rem;
          baseRow['Valor Neto'] = calcValorNeto(baseRow);
          rem = 0;
          changed.add(baseRow);
          added.push(splitRow);
        }
      }

      // Si hubo excedente sin saldo 10A previo, registrarlo directamente en DEPCO o P24 para no perder trazabilidad del embarque
      if (rem > 0) {
        const seasonTpl = tplBySeason[norm(S.season)] || globalTplItems;
        const tplItem = seasonTpl ? seasonTpl[grp.codNorm] : null;
        const newRow = {
          'Seguimiento': '',
          'Detalle compra': 'COMPRA CANAL',
          'Temporada': S.season,
          'Marca': 'ADIDAS',
          'Grupo': grp.grupo || (tplItem && tplItem.grupo) || '',
          'Categoría': grp.categoria || (tplItem && tplItem.categoria) || '',
          'Actividad': grp.actividad || (tplItem && tplItem.actividad) || '',
          'Línea': grp.linea || (tplItem && tplItem.linea) || '',
          'Referencia compra': grp.canalFactura || 'TIENDAS',
          'Canal Inicial': grp.canalFactura || 'TIENDAS',
          'Canal Final': grp.canalFinal,
          'Código': grp.codigo,
          'Color': (tplItem && tplItem.color) || '',
          'Talla': grp.tallaSap,
          'Talla marca': grp.itemSize,
          'Descripción': grp.descripcion || (tplItem && tplItem.descripcion) || '',
          'Género': grp.genero || (tplItem && tplItem.genero) || '',
          'Fecha de entrega': (tplItem && tplItem.fEntrega) || '',
          'Fecha de venta': (tplItem && tplItem.fVenta) || '',
          'Cantidad': rem,
          'FOB': grp.fobMarca,
          'Valor Neto': Math.round(grp.fobMarca * rem * 10000) / 10000,
          'PVP': grp.pvp,
          'PVP Final': grp.pvpFinal,
          'PVP retail': (tplItem && tplItem.pvpRetail) || 0,
          'P4': grp.p4,
          'P4 Final': grp.p4Final,
          'PMY': grp.pmy,
          'PMY Final': grp.pmyFinal,
          'Etapa': targetStage,
          'Régimen': targetRegimen,
          'LPN ID': lpnJoined,
          'Documento': '',
          'EMBARQUE': grp.embarque,
          'Fecha estimada inicio': '',
          'Fecha real inicio': '',
          'Fecha estimada fin': '',
          'Fecha real fin': '',
          'Factura': grp.invoices,
          'Delivery': grp.orderId,
          'Fecha de factura': grp.invoiceDate,
          'Fecha de ingreso embarque': grp.instruccion === 'IMPORTAR' ? fechaIngreso : '',
          'OBS': grp.obs || 'SIN SALDO 10A PREVIO',
          sb: 'Adidas|' + S.season,
          brand: 'Adidas',
          season: S.season
        };
        added.push(newRow);
        affectedSeasons.add(S.season);
      }
    }

    // Guardar historial de LPN DEPCO (para la pestaña Inventario DEPCO)
    const depcoOnlyItems = parsedItems.filter(x => x.instruccion === 'NO IMPORTAR');
    if (depcoOnlyItems.length > 0) {
      S.depcoLpnHistory = (S.depcoLpnHistory || []).filter(h => h.embarque !== detectedEmb);
      S.depcoLpnHistory.unshift({
        id: 'DEPCO_' + Date.now(),
        embarque: detectedEmb,
        uploadedAt: new Date().toLocaleString('es-EC', { dateStyle: 'short', timeStyle: 'short' }),
        fileName: file ? file.name : '',
        items: depcoOnlyItems.map(it => ({
          ...it,
          statusDepco: 'EN DEPCO',
          nacionalizadoQty: 0
        }))
      });
    }

    // Guardar historial de INGRESOS TIENDAS CONSOLIDADO
    if (tiendasBuild.rows.length > 0) {
      S.tiendasConsolHistory = S.tiendasConsolHistory || [];
      S.tiendasConsolHistory.unshift({
        id: 'TCON_' + Date.now(),
        seq: seqNum,
        month: monthLabel,
        embarque: detectedEmb,
        createdAt: new Date().toLocaleString('es-EC', { dateStyle: 'short', timeStyle: 'short' }),
        totalUnits: tiendasUnits,
        cruceUnits: tiendasBuild.cruceUnits,
        rows: tiendasBuild.rows
      });
    }

    if (changed.size) await dbPut([...changed]);
    if (added.length) await dbAdd(added);
    await saveMeta();
    await reload();
    busy();

    if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      await pushCloudConfig();
      for (const sName of affectedSeasons) {
        await pushCloudBuySeason('Adidas', sName, true);
      }
    }

    // Descargar automáticamente INGRESOS TIENDAS CONSOLIDADO si existen unidades de TIENDAS
    if (tiendasBuild.rows.length > 0) {
      exportIngresosTiendasExcel(tiendasBuild.rows, seqNum, monthLabel);
    }

    modal(
      'OC Consolidada DEPCO Procesada',
      `<div class="space-y-2.5 text-slate-700">
         <div class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-950 text-xs space-y-1">
           <div>✓ <b>Importado a P24:</b> ${fn(importUnits)} unidades nacionalizadas con sus canales y precios finales.</div>
           <div>✓ <b>Inventario DEPCO:</b> ${fn(depcoUnits)} unidades registradas en régimen <b>DEPCO</b> (disponibles en la pestaña <b>Inventario DEPCO</b>).</div>
         </div>
         ${tiendasBuild.rows.length > 0 ? `
         <div class="p-3 rounded-lg bg-sky-50 border border-sky-200 text-sky-950 text-xs">
           📥 Se descargó automáticamente <b>INGRESOS TIENDAS CONSOLIDADO ${seqNum} ${esc(monthLabel)}.xlsx</b> con <b>${fn(tiendasUnits)} unidades</b> (${fn(tiendasBuild.rows.length)} filas) listo para distribución de Tiendas.
         </div>` : ''}
       </div>`
    );
  } catch (e) {
    busy();
    modal('Error al procesar OC Consolidada DEPCO', esc(e.message || e));
  }
}

/* ============ NACIONALIZACIÓN PARCIAL DESDE INVENTARIO DEPCO (DEPCO → P24 + INGRESOS TIENDAS) ============ */
async function nacionalizarDesdeDepco(selectedIds, embarqueFilter = '') {
  const hist = S.depcoLpnHistory || [];
  const targets = [];
  for (const batch of hist) {
    for (let idx = 0; idx < batch.items.length; idx++) {
      const it = batch.items[idx];
      const uid = `${batch.id}::${idx}`;
      if (selectedIds.has(uid) && it.statusDepco !== 'NACIONALIZADO') {
        targets.push({ batch, it, uid });
      }
    }
  }
  if (!targets.length) return modal('Sin selección', 'Selecciona al menos una línea o cartón (LPN) pendiente en DEPCO para nacionalizar.');

  const totalUnits = targets.reduce((a, x) => a + Number(x.it.qty || 0), 0);
  const channels = ['TIENDAS', 'MARATHON', 'OUTLET', 'TAF', 'WEB', 'EXPLORER', 'TELESHOP', 'MAYORISTA', 'TRANS'];
  const ch = await modal(
    'Nacionalizar Parcial desde DEPCO → P24',
    `<div class="space-y-3 text-slate-700">
       <p>Vas a nacionalizar <b>${fn(targets.length)} líneas de cartón (LPN)</b> (<b>${fn(totalUnits)} unidades</b>) que estaban almacenadas en <b>DEPCO</b>.</p>
       <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
         <div>
           <label class="block text-xs font-semibold text-slate-700 mb-1">Canal Final de Destino</label>
           <select id="selDepcoNacCanal" class="border rounded px-2.5 py-1.5 text-sm w-full bg-white font-semibold">
             <option value="__ORIGINAL__">Mantener Canal Factura original</option>
             ${channels.map(c => `<option value="${c}">${c}</option>`).join('')}
           </select>
         </div>
         <div>
           <label class="block text-xs font-semibold text-slate-700 mb-1">Fecha de ingreso a CD</label>
           <input type="date" id="inpDepcoNacFecha" class="border rounded px-2.5 py-1.5 text-sm w-full bg-white" value="${new Date().toISOString().slice(0, 10)}">
         </div>
       </div>
       <label class="flex items-center gap-2 text-xs cursor-pointer pt-1">
         <input type="checkbox" id="chkDepcoGenTiendas" class="w-4 h-4 accent-sky-700" checked>
         <span>Si el destino es <b>TIENDAS</b>, generar y descargar archivo <b>INGRESOS TIENDAS CONSOLIDADO</b> automáticamente</span>
       </label>
     </div>`,
    [['Cancelar', 'c'], ['Nacionalizar a P24', 'ok', 1]]
  );
  if (ch !== 'ok') return;

  const chosenCanal = $('selDepcoNacCanal') ? $('selDepcoNacCanal').value : '__ORIGINAL__';
  const fechaNac = $('inpDepcoNacFecha') ? $('inpDepcoNacFecha').value.trim() : '';
  const genTiendas = $('chkDepcoGenTiendas') ? $('chkDepcoGenTiendas').checked : true;

  busy('Nacionalizando parcial desde DEPCO a P24…');
  await tick();

  const allAdidasRows = await getAllBrandRows('Adidas');
  const depcoRows = allAdidasRows.filter(r => st(r) === 'dep' && Number(r['Cantidad'] || 0) > 0);
  const changed = new Set();
  const added = [];
  const affectedSeasons = new Set();
  const tiendasItemsForExport = [];
  let embNameForExport = embarqueFilter || (targets[0] && targets[0].it.embarque) || 'DEPCO PARCIAL';

  for (const { it } of targets) {
    const finalDest = chosenCanal === '__ORIGINAL__' ? (it.canalFactura || 'TIENDAS') : chosenCanal;
    it.statusDepco = 'NACIONALIZADO';
    it.canalFinal = finalDest;
    it.nacionalizadoFecha = fechaNac;

    if (finalDest === 'TIENDAS') {
      tiendasItemsForExport.push({ ...it, canalFinal: 'TIENDAS' });
    }

    const codNorm = norm(it.codigo);
    const talNorm = normTalla(it.tallaSap);
    const embNorm = norm(it.embarque);
    const matchingDepco = depcoRows.filter(r =>
      st(r) === 'dep' &&
      Number(r['Cantidad'] || 0) > 0 &&
      norm(r['Código']) === codNorm &&
      normTalla(r['Talla']) === talNorm &&
      (!embNorm || norm(r['EMBARQUE']) === embNorm)
    );

    let rem = Number(it.qty || 0);
    for (let i = 0; i < matchingDepco.length && rem > 0; i++) {
      const baseRow = matchingDepco[i];
      const avail = Number(baseRow['Cantidad'] || 0);
      affectedSeasons.add(baseRow.season || S.season);

      if (avail <= rem) {
        rem -= avail;
        baseRow['Etapa'] = EP;
        baseRow['Régimen'] = 'DEPCO PARCIAL';
        baseRow['Canal Final'] = finalDest;
        if (fechaNac) baseRow['Fecha de ingreso embarque'] = fechaNac;
        baseRow['OBS'] = `NACIONALIZADO DE DEPCO (${it.lpnId || ''})`.trim();
        changed.add(baseRow);
      } else {
        const splitRow = { ...baseRow };
        delete splitRow.id;
        splitRow['Cantidad'] = rem;
        splitRow['Etapa'] = EP;
        splitRow['Régimen'] = 'DEPCO PARCIAL';
        splitRow['Canal Final'] = finalDest;
        if (fechaNac) splitRow['Fecha de ingreso embarque'] = fechaNac;
        splitRow['OBS'] = `NACIONALIZADO DE DEPCO (${it.lpnId || ''})`.trim();
        splitRow['Valor Neto'] = calcValorNeto(splitRow);

        baseRow['Cantidad'] = avail - rem;
        baseRow['Valor Neto'] = calcValorNeto(baseRow);
        rem = 0;
        changed.add(baseRow);
        added.push(splitRow);
      }
    }
  }

  let tiendasExportedCount = 0;
  if (genTiendas && tiendasItemsForExport.length > 0) {
    const sizeLookup = buildTallaSapLookup();
    const { tplBySeason, globalTplItems } = getBrandTplCatalogMap('Adidas');
    const refreshedAdidas = await getAllBrandRows('Adidas');
    const buildRes = buildIngresosTiendasConsolidatedRows(tiendasItemsForExport, refreshedAdidas, embNameForExport, sizeLookup, tplBySeason, globalTplItems);
    const monthIdx = fechaNac ? parseInt(fechaNac.split('-')[1], 10) : (new Date().getMonth() + 1);
    const mName = MESES_ES[(monthIdx >= 1 && monthIdx <= 12 ? monthIdx : 1) - 1].toUpperCase();
    const nextSeq = (S.tiendasConsolHistory || []).filter(h => String(h.month || '').toUpperCase() === mName).length + 1;
    const tUnits = tiendasItemsForExport.reduce((a, x) => a + Number(x.qty || 0), 0);
    S.tiendasConsolHistory = S.tiendasConsolHistory || [];
    S.tiendasConsolHistory.unshift({
      id: 'TCON_' + Date.now(),
      seq: nextSeq,
      month: mName,
      embarque: embNameForExport,
      createdAt: new Date().toLocaleString('es-EC', { dateStyle: 'short', timeStyle: 'short' }),
      totalUnits: tUnits,
      cruceUnits: buildRes.cruceUnits,
      rows: buildRes.rows
    });
    tiendasExportedCount = tUnits;
    exportIngresosTiendasExcel(buildRes.rows, nextSeq, mName);
  }

  if (changed.size) await dbPut([...changed]);
  if (added.length) await dbAdd(added);
  await saveMeta();
  await reload();
  busy();

  if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
    await pushCloudConfig();
    for (const sName of affectedSeasons) {
      await pushCloudBuySeason('Adidas', sName, true);
    }
  }

  modal(
    'Nacionalización DEPCO Completada',
    `Se pasaron <b>${fn(totalUnits)} unidades</b> desde <b>DEPCO</b> a <b>P24</b>.${tiendasExportedCount > 0 ? `<br><br>📥 Se descargó automáticamente el archivo <b>INGRESOS TIENDAS CONSOLIDADO</b> por <b>${fn(tiendasExportedCount)} unidades</b>.` : ''}`
  );
}


/* ============ CARGA DE DISTRIBUCIÓN FINAL DE TIENDAS (ACTUALIZA REFERENCIA COMPRA POR CENTRO/TIENDA EN P24) ============ */
async function loadTiendasFinalDistribution(file) {
  try {
    busy(`Leyendo distribución final de Tiendas para ${S.brand}…`);
    await tick();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const targetSheet = wb.Sheets['Hoja1'] ? 'Hoja1' : (wb.Sheets['TIENDAS'] ? 'TIENDAS' : wb.SheetNames[0]);
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[targetSheet], { defval: '', raw: true });
    if (!raw.length) throw new Error('El archivo de distribución de Tiendas está vacío.');

    const allBrandRows = await getAllBrandRows(S.brand);
    const p24TiendasRows = allBrandRows.filter(r =>
      st(r) === 'p' &&
      Number(r['Cantidad'] || 0) > 0 &&
      (normalizarCanal(r['Canal Final']) === 'TIENDAS' || normalizarCanal(r['Canal Inicial']) === 'TIENDAS')
    );

    if (!p24TiendasRows.length) {
      busy();
      return modal('Sin registros de TIENDAS en P24', `No se encontraron líneas de <b>TIENDAS</b> en etapa <b>P24</b> para ${S.brand}.`);
    }

    // Reiniciar marcas previas de distribución de tiendas para los embarques/facturas presentes en el archivo
    const fileEmbs = new Set();
    const fileFacts = new Set();
    for (const o of raw) {
      const e = norm(getRowVal(o, ['EMBARQUE', 'Embarque']));
      const f = norm(getRowVal(o, ['Factura', 'Invoices', 'No FACTURA']));
      if (e) fileEmbs.add(e);
      if (f) fileFacts.add(f);
    }

    const changed = new Set();
    p24TiendasRows.forEach(r => {
      const rE = norm(r['EMBARQUE']);
      const rF = norm(r['Factura']);
      if ((fileEmbs.size && rE && fileEmbs.has(rE)) || (fileFacts.size && rF && fileFacts.has(rF))) {
        if (r._tiendaDistApplied) {
          delete r._tiendaDistApplied;
          changed.add(r);
        }
      }
    });

    const parseNum = v => Number(String(v ?? '').replace(/[^0-9.,-]/g, '').replace(',', '.')) || 0;
    const added = [];
    let assignedUnits = 0;
    const storeSummary = {};
    const affectedSeasons = new Set();
    const unmatched = [];

    for (const o of raw) {
      const cod = norm(getRowVal(o, ['Código', 'Codigo', 'Item Description', 'Material', 'SAP']));
      const tal = normTalla(getRowVal(o, ['Talla', 'TALLA SAP', 'Talla SAP']));
      const talM = normTalla(getRowVal(o, ['Talla marca', 'Item Size', 'Grid Value'])) || tal;
      const qty = parseNum(getRowVal(o, ['Cantidad', 'QTY', 'LPN Detail Size Value', 'Delivery Quantity']));
      const refTienda = String(getRowVal(o, ['Referencia compra', 'REFERENCIA COMPRA', 'Referencia compra final', 'CENTRO', 'TIENDA', 'Sucursal', 'Destino']) ?? '').trim().toUpperCase();
      const emb = norm(getRowVal(o, ['EMBARQUE', 'Embarque']));
      const fact = norm(getRowVal(o, ['Factura', 'Invoices', 'No FACTURA']));
      const temp = norm(getRowVal(o, ['Temporada', 'Season']));

      if (!cod || qty <= 0 || !refTienda) continue;

      const candidates = p24TiendasRows.filter(r => {
        if (st(r) !== 'p' || Number(r['Cantidad'] || 0) <= 0 || r._tiendaDistApplied) return false;
        if (norm(r['Código']) !== cod) return false;
        const rTal = normTalla(r['Talla']);
        const rTalM = normTalla(r['Talla marca']);
        if (tal && rTal !== tal && rTalM !== tal && rTal !== talM) return false;
        if (emb && norm(r['EMBARQUE']) && norm(r['EMBARQUE']) !== emb) return false;
        if (fact && norm(r['Factura']) && norm(r['Factura']) !== fact) return false;
        if (temp && norm(r.season || r['Temporada']) !== temp) return false;
        return true;
      });

      // Priorizar si ya tenía esa misma Referencia compra inicial
      candidates.sort((a, b) => (norm(b['Referencia compra']) === norm(refTienda) ? 1 : 0) - (norm(a['Referencia compra']) === norm(refTienda) ? 1 : 0));

      if (!candidates.length) {
        unmatched.push({ cod: getRowVal(o, ['Código', 'Codigo', 'Material']), tal: tal || talM, tienda: refTienda, qty });
        continue;
      }

      let rem = qty;
      for (let i = 0; i < candidates.length && rem > 0; i++) {
        const baseRow = candidates[i];
        const avail = Number(baseRow['Cantidad'] || 0);
        if (avail <= 0 || baseRow._tiendaDistApplied) continue;
        affectedSeasons.add(baseRow.season || S.season);

        if (avail <= rem) {
          rem -= avail;
          baseRow['Referencia compra'] = refTienda;
          baseRow['Canal Final'] = 'TIENDAS';
          baseRow._tiendaDistApplied = true;
          assignedUnits += avail;
          storeSummary[refTienda] = (storeSummary[refTienda] || 0) + avail;
          changed.add(baseRow);
        } else {
          const splitRow = { ...baseRow };
          delete splitRow.id;
          splitRow['Cantidad'] = rem;
          splitRow['Referencia compra'] = refTienda;
          splitRow['Canal Final'] = 'TIENDAS';
          splitRow._tiendaDistApplied = true;
          splitRow['Valor Neto'] = calcValorNeto(splitRow);

          baseRow['Cantidad'] = avail - rem;
          baseRow['Valor Neto'] = calcValorNeto(baseRow);
          assignedUnits += rem;
          storeSummary[refTienda] = (storeSummary[refTienda] || 0) + rem;
          rem = 0;
          changed.add(baseRow);
          added.push(splitRow);
        }
      }
    }

    busy();
    if (!assignedUnits) {
      return modal('Sin coincidencias en P24', 'No se encontraron líneas pendientes de TIENDAS en P24 que coincidan con los códigos, tallas y embarques del archivo.');
    }

    const storeBadges = Object.entries(storeSummary)
      .sort((a, b) => b[1] - a[1])
      .map(([stName, u]) => `<span class="inline-block bg-emerald-50 border border-emerald-200 text-emerald-950 px-2 py-0.5 rounded text-xs font-semibold mr-1.5 mb-1">${esc(stName)}: ${fn(u)} unid.</span>`)
      .join('');

    const ch = await modal(
      'Confirmar Distribución Final de Tiendas',
      `<div class="space-y-3 text-slate-700">
         <p>Se actualizará la columna <b>Referencia compra</b> en <b>P24</b> para <b>${fn(assignedUnits)} unidades</b> con su tienda/centro destino final:</p>
         <div class="p-3 rounded-lg bg-slate-50 border text-xs max-h-44 overflow-y-auto">${storeBadges}</div>
         ${unmatched.length ? `<p class="text-xs text-amber-700"><b>${fn(unmatched.length)} filas</b> no encontraron saldo de TIENDAS en P24 para ese SKU/talla/embarque.</p>` : ''}
       </div>`,
      [['Cancelar', 'c'], ['Aplicar Centros a Base Maestra', 'ok', 1]]
    );
    if (ch !== 'ok') return;

    busy('Guardando centros de Tiendas en base local…');
    await tick();
    if (changed.size) await dbPut([...changed]);
    if (added.length) await dbAdd(added);
    await reload();
    busy();

    if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      for (const sName of affectedSeasons) {
        await pushCloudBuySeason(S.brand, sName, true);
      }
    }

    modal('Distribución de Tiendas Aplicada', `Se actualizó <b>Referencia compra</b> con la tienda destino final para <b>${fn(assignedUnits)} unidades</b> en <b>P24</b>.`);
  } catch (e) {
    busy();
    modal('Error al cargar distribución de Tiendas', esc(e.message || e));
  }
}

/* ============ MOTOR UNIFICADO DE FACTURACIÓN (ADIDAS Y REEBOK) ============ */
async function processBrandBilling(file, ptsFile = null) {
  const isReebok = String(S.brand).toUpperCase().includes('REEBOK');
  try {
    busy(`Procesando Detalle de Facturación ${S.brand}, PTs COMEX, Tallas SAP y Plantilla…`);
    await tick();

    const ptsMap = ptsFile ? await parsePtsExcelMap(ptsFile) : new Map();
    const ptsEmbarques = [...new Set(ptsMap.values())];
    const defaultPtsEmb = ptsEmbarques[0] || '';

    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    // Para Reebok priorizar hoja que empiece con OC o la segunda hoja si existe TD primero
    let targetSheet = wb.SheetNames[0];
    if (isReebok) {
      targetSheet = wb.SheetNames.find(n => norm(n).startsWith('oc') || norm(n).includes('factura')) || (wb.Sheets['Sheet1'] ? 'Sheet1' : wb.SheetNames[0]);
    } else {
      targetSheet = wb.Sheets['Sheet1'] ? 'Sheet1' : (wb.Sheets['Hoja1'] ? 'Hoja1' : wb.SheetNames[0]);
    }
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[targetSheet], { defval: '', raw: true });
    if (!raw.length) throw new Error('No se encontraron filas en el archivo de facturación.');

    const sizeLookup = buildTallaSapLookup();
    const allBrandRows = await getAllBrandRows(S.brand);

    const existingP24Invoices = new Set();
    allBrandRows.forEach(r => {
      if (st(r) === 'p' && r['Factura']) {
        existingP24Invoices.add(norm(r['Factura']));
      }
    });

    const tplBySeason = {};
    const globalTplItems = {};
    for (const [k, entry] of Object.entries(S.templates || {})) {
      const [bName, sName] = k.split('|');
      if (bName !== S.brand) continue;
      const items = entry && entry.items ? entry.items : (entry || {});
      tplBySeason[norm(sName)] = items;
      Object.assign(globalTplItems, items);
    }

    // Indexar filas 10A disponibles y todas las filas de la marca por Código en O(N)
    const rows10ABySeasonCod = new Map();
    const rows10AByCod = new Map();
    const allBrandRowsByCod = new Map();
    const initial10ASnapshotByCod = new Map();
    allBrandRows.forEach(r => {
      const cod = norm(r['Código']);
      if (cod) {
        let allArr = allBrandRowsByCod.get(cod);
        if (!allArr) { allArr = []; allBrandRowsByCod.set(cod, allArr); }
        allArr.push(r);
      }
      if (st(r) === 'o' && Number(r['Cantidad'] || 0) > 0) {
        const temp = norm(r.season || r['Temporada']);
        const scKey = `${temp}|${cod}`;
        if (!rows10ABySeasonCod.has(scKey)) rows10ABySeasonCod.set(scKey, []);
        rows10ABySeasonCod.get(scKey).push(r);
        if (!rows10AByCod.has(cod)) rows10AByCod.set(cod, []);
        rows10AByCod.get(cod).push(r);

        if (!initial10ASnapshotByCod.has(cod)) initial10ASnapshotByCod.set(cod, []);
        initial10ASnapshotByCod.get(cod).push({
          talla: normTalla(r['Talla']),
          tallaMarca: normTalla(r['Talla marca']),
          refCompra: String(r['Referencia compra'] || '').trim(),
          canal: String(r['Canal Inicial'] || resolverCanalInicial(r['Referencia compra'], S.brand) || 'SIN CANAL').trim(),
          detalle: String(r['Detalle compra'] || 'COMPRA CANAL').trim(),
          qty: Number(r['Cantidad'] || 0),
          temporada: String(r.season || r['Temporada'] || S.season).trim()
        });
      }
    });

    const parseNum = v => Number(String(v ?? '').replace(/[^0-9.,-]/g, '').replace(',', '.')) || 0;

    // Pre-escaneo exclusivo para Reebok:
    // Detectar qué códigos (NEW Material) tienen 0 en Final Delivery QTY TOTAL en TODA su curva de tallas.
    // Esos códigos se dejan intactos en 10A disponible y NO entran al detalle de facturación ni a DROPS.
    const rbkTotalDeliveredByCod = new Map();
    const rbkZeroCurveSkus = new Set();
    if (isReebok) {
      for (const o of raw) {
        const mat = String(getRowVal(o, ['NEW Material', 'New Material', 'Material', 'Código', 'Codigo']) ?? '').trim();
        const cNorm = norm(mat);
        if (!cNorm) continue;
        const deliv = parseNum(getRowVal(o, ['Final Delivery QTY TOTAL', 'Final Delivery QTY', 'Cantidad', 'QTY']));
        rbkTotalDeliveredByCod.set(cNorm, (rbkTotalDeliveredByCod.get(cNorm) || 0) + deliv);
      }
      for (const [cNorm, totDeliv] of rbkTotalDeliveredByCod.entries()) {
        if (totDeliv <= 0) rbkZeroCurveSkus.add(cNorm);
      }
    }

    // 1. Parsear líneas crudas y agrupar bultos idénticos
    const groupedMap = new Map();
    const rbkSizeDropMap = new Map(); // codNorm|tallaSap -> { material, codNorm, tallaSap, gridValue, reqTotal, delivTotal, dropQty, temporada, invNumbers: Set, ptKeys: Set }
    const fileInvoices = new Set();
    const duplicateInvoicesFound = new Set();
    const ptsInEmb = new Set();
    const ptsForwarder = new Set();
    let unitsInEmb = 0;
    let unitsForwarder = 0;

    for (const o of raw) {
      const materialRaw = isReebok
        ? String(getRowVal(o, ['NEW Material', 'New Material', 'Material', 'Código', 'Codigo']) ?? '').trim()
        : String(getRowVal(o, ['Material', 'Código', 'Codigo', 'SAP']) ?? '').trim();
      const codNorm = norm(materialRaw);
      if (!codNorm) continue;

      const reqQtyRaw = parseNum(getRowVal(o, ['Reques quantity', 'Request quantity', 'Requested Quantity']));
      const qty = isReebok
        ? parseNum(getRowVal(o, ['Final Delivery QTY TOTAL', 'Final Delivery QTY', 'Cantidad', 'QTY']))
        : parseNum(getRowVal(o, ['Delivery quantity', 'Delivery Quantity', 'Invoiced Quantity', 'Cantidad', 'QTY']));

      if (isReebok) {
        // Si toda la curva de tallas del código tiene Final Delivery QTY TOTAL === 0, omitir (queda en 10A disponible)
        if (rbkZeroCurveSkus.has(codNorm)) continue;
        // Si esta línea no tiene ni cantidad pedida ni entregada, omitir
        if (qty <= 0 && reqQtyRaw <= 0) continue;
      } else {
        if (qty <= 0) continue;
      }

      const invNum = isReebok
        ? String(getRowVal(o, ['No FACTURA ', 'No FACTURA', 'No Factura', 'Invoice Number', 'Factura']) ?? '').trim()
        : String(getRowVal(o, ['Invoice Number', 'Factura', 'No FACTURA']) ?? '').trim();
      const invCodeRbk = isReebok ? String(getRowVal(o, ['FACTURA ', 'FACTURA']) ?? '').trim() : '';
      const invDate = fdate(getRowVal(o, ['FECHA DE FACTURA', 'Fecha de factura', 'Invoice Date', 'Additional Date', 'Requested deliv.date']));

      // En Adidas el PT es Delivery; en Reebok el PT es Sales Order 1
      const ptRaw = isReebok
        ? normalizePtId(getRowVal(o, ['Sales Order 1', 'Sales Order', 'PT', 'Delivery']))
        : normalizePtId(getRowVal(o, ['Delivery', 'PT', 'Entrega']));

      const poRaw = isReebok
        ? String(getRowVal(o, ['Purchase No', 'Purchase order no.', 'Temporada']) ?? '').trim()
        : String(getRowVal(o, ['Purchase order no. (35 char)', 'Purchase order no.', 'Purchase Order', 'PO']) ?? '').trim();

      const gridVal = String(getRowVal(o, ['Grid Value', 'Talla marca', 'Talla Marca']) ?? '').trim();
      const explicitSap = String(getRowVal(o, ['TALLA SAP', 'Talla SAP']) ?? '').trim();

      const grossPrice = parseNum(getRowVal(o, ['Gross Price']));
      const netWithoutRound = parseNum(getRowVal(o, ['Net Without Round']));
      const netValWithoutRound = parseNum(getRowVal(o, ['Net value (without Round)']));
      const netPrice = isReebok
        ? parseNum(getRowVal(o, ['Net price Round', 'Net Price', 'Net Without Round', 'FOB']))
        : parseNum(getRowVal(o, ['Net price', 'Net Price', 'FOB', 'FOB MARCA']));
      const netValRaw = isReebok
        ? parseNum(getRowVal(o, ['Net value Round (DN)', 'Net value', 'Valor Neto']))
        : parseNum(getRowVal(o, ['Net value (DN)', 'Net value', 'Valor Neto']));

      // Cruce contra PTs COMEX -> Embarque vs FORWARDER
      let resolvedEmbarque = 'FORWARDER';
      let isForwarder = true;
      if (ptRaw && ptsMap.has(ptRaw)) {
        resolvedEmbarque = ptsMap.get(ptRaw);
        isForwarder = false;
      } else {
        const embColInFile = String(getRowVal(o, ['EMBARQUE', 'Embarque']) ?? '').trim();
        if (embColInFile && embColInFile.toUpperCase() !== 'FORWARDER') {
          resolvedEmbarque = embColInFile;
          isForwarder = false;
        }
      }

      if (isForwarder) {
        unitsForwarder += qty;
        if (ptRaw) ptsForwarder.add(ptRaw);
      } else {
        unitsInEmb += qty;
        if (ptRaw) ptsInEmb.add(ptRaw);
      }

      if (invNum) {
        fileInvoices.add(invNum);
        if (existingP24Invoices.has(norm(invNum))) {
          duplicateInvoicesFound.add(invNum);
        }
      }

      const seasonDet = extractSeasonFromPO(poRaw, S.season);

      // Resolver Talla SAP con desambiguación contra el Catálogo SAP, la base del Material y el Grupo
      const candidates = getTallaSapCandidates(gridVal, explicitSap, sizeLookup);
      const preSeasonTpl = tplBySeason[norm(seasonDet)] || globalTplItems;
      const preTplItem = preSeasonTpl ? preSeasonTpl[codNorm] : null;
      const preGrupo = (preTplItem && preTplItem.grupo) ? preTplItem.grupo : String(getRowVal(o, ['GRUPO', 'Product Type Description']) ?? '').trim();
      const poolForSku = allBrandRowsByCod.get(codNorm) || [];
      const chosenTallaSap = resolveTallaSapFromGrid(gridVal, explicitSap, sizeLookup, poolForSku, {
        brand: S.brand,
        material: materialRaw,
        grupo: preGrupo
      });

      // Canal Inicial:
      // - En Adidas: desde Purchase order no.
      // - En Reebok: se deja vacío aquí para traerlo directamente desde la Compra Inicial 10A cruzada (o si ya viene en columna CANAL)
      const explicitCanalCol = String(getRowVal(o, ['CANAL INICIAL', 'Canal Inicial', 'CANAL']) ?? '').trim();
      const canalIniRaw = isReebok
        ? explicitCanalCol
        : (explicitCanalCol || resolveCanalInicialFromPO(poRaw));
      const canalUnif = canalIniRaw ? resolverCanalUnificado(canalIniRaw) : '';
      const compraExtraFlag = String(getRowVal(o, ['COMPRA EXTRA', 'DETALLE DE COMPRA']) ?? '').trim();

      // Enriquecer desde Plantilla de Presentación (Actividad, Grupo, Categoría, Género, Línea)
      const seasonTpl = tplBySeason[norm(seasonDet)] || globalTplItems;
      const tplItem = seasonTpl ? seasonTpl[codNorm] : null;

      const actividad = (tplItem && tplItem.actividad) ? tplItem.actividad : String(getRowVal(o, ['ACTIVIDAD', 'Sport Description']) ?? '').trim();
      const grupo = (tplItem && tplItem.grupo) ? tplItem.grupo : String(getRowVal(o, ['GRUPO', 'Product Type Description']) ?? '').trim();
      const categoria = getTplFieldFromEntry(tplItem, 'categoria', ['tipoventa', 'categoria']) || String(getRowVal(o, ['TIPO_VENTA', 'TIPO VENTA', 'CATEGORÍA', 'CATEGORIA', 'Division']) ?? '').trim();
      const genero = (tplItem && tplItem.genero) ? tplItem.genero : String(getRowVal(o, ['GÉNERO', 'GENERO', 'Gender']) ?? '').trim();
      const linea = (tplItem && tplItem.linea) ? tplItem.linea : String(getRowVal(o, ['LINEA', 'Línea', 'Product line']) ?? '').trim();
      const descripcion = (tplItem && tplItem.descripcion) ? tplItem.descripcion : String(getRowVal(o, ['Material Description', 'Name', 'Descripción']) ?? '').trim();
      const color = (tplItem && tplItem.color) ? tplItem.color : String(getRowVal(o, ['Color']) ?? '').trim();

      const groupKey = `${norm(invNum)}|${invNum}|${ptRaw}|${poRaw}|${codNorm}|${normTalla(chosenTallaSap)}|${resolvedEmbarque}`;
      if (!groupedMap.has(groupKey)) {
        groupedMap.set(groupKey, {
          status: String(getRowVal(o, ['Status']) ?? 'NEW').trim(),
          soldToParty: String(getRowVal(o, ['Sold-to party']) ?? 'C101-000001').trim(),
          soldToName: String(getRowVal(o, ['Sold-to Name', 'Ship To Name']) ?? 'MUNDO DEPORTIVO MEDEPORT S A').trim(),
          salesDocType: String(getRowVal(o, ['Sales Document Type']) ?? '').trim(),
          invoiceDate: invDate,
          invoiceNumber: invNum,
          invCodeRbk,
          ptKey: ptRaw,
          poNumber: poRaw,
          canalInicial: canalIniRaw,
          canalUnificado: canalUnif,
          material: materialRaw,
          codNorm,
          ean: String(getRowVal(o, ['EAN VERIFICADO', 'EAN', 'EAN/UPC']) ?? '').trim(),
          upc: String(getRowVal(o, ['UPC']) ?? '').trim(),
          gridValue: gridVal,
          reqQty: 0,
          qty: 0,
          grossPrice,
          netWithoutRound,
          netValWithoutRound: 0,
          netPrice,
          netValue: 0,
          brandCode: String(getRowVal(o, ['Brand code']) ?? (isReebok ? 'RBK' : 'adidas')).trim(),
          salesDocOrder: String(getRowVal(o, ['Sales Document', 'Sales Document(ORDER NUMBER)', 'Sales Order 1']) ?? '').trim(),
          tallaSap: chosenTallaSap,
          candidates,
          idConcat: `${materialRaw} ${chosenTallaSap}`.trim(),
          actividad,
          grupo,
          embarque: resolvedEmbarque,
          isForwarder,
          categoria,
          genero,
          temporada: seasonDet,
          linea,
          compraExtra: compraExtraFlag,
          descripcion,
          color
        });
      }
      const effectiveReq = reqQtyRaw > 0 ? reqQtyRaw : qty;

      // En Reebok, acumular por (No FACTURA + Sales Order + NEW Material + Talla SAP)
      // para nunca mezclar dos facturas en la misma celda y detectar DROPs exactos por factura y talla
      if (isReebok) {
        const dropKey = `${norm(invNum)}|${invNum}|${ptRaw}|${codNorm}|${normTalla(chosenTallaSap)}`;
        if (!rbkSizeDropMap.has(dropKey)) {
          rbkSizeDropMap.set(dropKey, {
            invoiceNumber: invNum,
            ptKey: ptRaw,
            material: materialRaw,
            codNorm,
            tallaSap: chosenTallaSap,
            gridValue: gridVal,
            descripcion: descripcion || '',
            color: color || '',
            temporada: seasonDet,
            fob: netPrice || 0,
            reqTotal: 0,
            delivTotal: 0
          });
        }
        const dRec = rbkSizeDropMap.get(dropKey);
        dRec.reqTotal += effectiveReq;
        dRec.delivTotal += qty;
        if (!dRec.descripcion && descripcion) dRec.descripcion = descripcion;
        if (!dRec.color && color) dRec.color = color;
        if (netPrice > 0) dRec.fob = netPrice;
      }

      const g = groupedMap.get(groupKey);
      g.reqQty += effectiveReq;
      g.qty += qty;
      if (netPrice > 0) g.netPrice = netPrice;
      g.netValue = Math.round((g.netPrice * g.qty) * 10000) / 10000 || (g.netValue + netValRaw);
      g.netValWithoutRound = Math.round((g.netWithoutRound * g.qty) * 10000) / 10000 || (g.netValWithoutRound + netValWithoutRound);
    }

    // Filtrar para facturación las líneas que tienen entrega efectiva > 0 (las líneas de Reebok con qty === 0 ya quedaron registradas en rbkSizeDropMap)
    for (const [gk, gv] of groupedMap.entries()) {
      if (gv.qty <= 0) groupedMap.delete(gk);
    }

    const consolidatedLines = [...groupedMap.values()];
    if (!consolidatedLines.length && !(isReebok && rbkSizeDropMap.size > 0)) {
      throw new Error('No se encontraron líneas facturadas válidas con Material y Cantidad > 0.');
    }

    // 2. Ejecutar simulación de descuento contra 10A DESAGREGANDO UNA FILA POR CADA CANAL INICIAL
    // Así nunca se juntan canales con "/" en una sola celda: cada canal queda en su propia fila con sus unidades exactas.
    const changed = new Set();
    const added = [];
    const appliedP24Rows = [];
    const disaggregatedLines = [];
    let matchedUnits = 0;
    let totalFileUnits = 0;
    const perSeasonUnits = {};
    const unmatched = [];

    for (const line of consolidatedLines) {
      totalFileUnits += line.qty;
      const tempNorm = norm(line.temporada);
      const codNorm = line.codNorm;
      const candTallasNorm = line.candidates.map(normTalla).filter(Boolean);
      const targetCanalNorm = norm(line.canalInicial);
      const targetUnifNorm = norm(line.canalUnificado);
      const wantExtra = norm(line.compraExtra) === 'si' || norm(line.compraExtra) === 'compraextra' || norm(line.compraExtra) === 'x';

      const allSkuRows = [
        ...(rows10ABySeasonCod.get(`${tempNorm}|${codNorm}`) || []),
        ...(rows10AByCod.get(codNorm) || [])
      ].filter((v, idx, arr) => arr.indexOf(v) === idx && st(v) === 'o' && Number(v['Cantidad'] || 0) > 0);

      const scoreRow = r => {
        let sc = 0;
        if (norm(r.season || r['Temporada']) === tempNorm) sc += 100;
        const rTal = normTalla(r['Talla']);
        const rTalM = normTalla(r['Talla marca']);
        if (candTallasNorm.includes(rTal)) sc += 50;
        else if (candTallasNorm.includes(rTalM)) sc += 40;
        else return -1;

        if (targetCanalNorm) {
          const rCan = norm(r['Canal Inicial'] || resolverCanalInicial(r['Referencia compra'], S.brand));
          const rCanUnif = norm(resolverCanalUnificado(r['Canal Inicial'] || r['Referencia compra']));
          if (rCan && rCan === targetCanalNorm) sc += 25;
          else if (rCanUnif && rCanUnif === targetUnifNorm) sc += 12;
        } else if (isReebok) {
          // Proteger estrictamente Mayorista (10) y Tiendas (20) sobre Marathon (75) y Web (92):
          // Al descontar lo facturado, se consume primero el bloque sacrificable (Web/Marathon/Outlet) dejando el saldo sobrante en Web/Marathon
          // y manteniendo intactas las unidades de Tiendas y Mayorista.
          const cRaw = String(r['Canal Inicial'] || resolverCanalInicial(r['Referencia compra'], 'Reebok') || '').trim();
          const dropPrio = getReebokDropPriorityScore(cRaw);
          sc += dropPrio; // +100 Outlet, +92 Web, +75 Marathon, +55 TAF, +20 Tiendas, +10 Mayorista
          if (Math.abs(Number(r['Cantidad']) - line.qty) < 0.001) sc += 8;
        }

        const isExtraRow = norm(r['Detalle compra']) === 'compraextra';
        if (wantExtra === isExtraRow) sc += 5;
        return sc;
      };

      const pool = allSkuRows
        .map(r => ({ r, sc: scoreRow(r) }))
        .filter(x => x.sc >= 0)
        .sort((a, b) => b.sc - a.sc)
        .map(x => x.r);

      if (!pool.length) {
        unmatched.push({
          inv: line.invoiceNumber,
          pt: line.ptKey,
          temp: line.temporada,
          cod: line.material,
          grid: line.gridValue,
          sap: line.tallaSap,
          qty: line.qty
        });
        // Conservar la línea en la vista previa con su canal original (o vacío si no cruzó)
        disaggregatedLines.push({ ...line });
        continue;
      }

      let rem = line.qty;
      const perLineCanalBuckets = new Map(); // canalInicial -> subLine object

      const pushToCanalBucket = (canalIniStr, subQty, subDetalle) => {
        const cleanIni = String(canalIniStr || line.canalInicial || '').trim();
        const cleanUnif = resolverCanalUnificado(cleanIni);
        const bKey = `${cleanIni}|||${subDetalle}`;
        if (!perLineCanalBuckets.has(bKey)) {
          perLineCanalBuckets.set(bKey, {
            ...line,
            canalInicial: cleanIni,
            canalUnificado: cleanUnif,
            compraExtra: line.compraExtra || (subDetalle === 'COMPRA EXTRA' ? 'COMPRA EXTRA' : ''),
            reqQty: 0,
            qty: 0,
            netValue: 0,
            netValWithoutRound: 0
          });
        }
        const b = perLineCanalBuckets.get(bKey);
        const propReq = line.qty > 0 ? Math.round((line.reqQty * (subQty / line.qty)) * 100) / 100 : subQty;
        b.reqQty = Math.round((b.reqQty + propReq) * 100) / 100;
        b.qty += subQty;
        b.netValue = Math.round((b.netPrice * b.qty) * 10000) / 10000;
        b.netValWithoutRound = Math.round((b.netWithoutRound * b.qty) * 10000) / 10000;
      };

      for (let i = 0; i < pool.length && rem > 0; i++) {
        const baseRow = pool[i];
        if (Number(baseRow['Cantidad'] || 0) <= 0 || st(baseRow) !== 'o') continue;
        const rowSeason = baseRow.season || S.season;
        const take = Math.min(Number(baseRow['Cantidad']), rem);

        const rowCanalIni = String(baseRow['Canal Inicial'] || resolverCanalInicial(baseRow['Referencia compra'], S.brand) || line.canalInicial || '').trim();
        const rowDetalle = String(baseRow['Detalle compra'] || '').trim();

        const applyBillingFields = targetRow => {
          targetRow['Etapa'] = EP;
          if (line.invoiceNumber) targetRow['Factura'] = line.invoiceNumber;
          if (line.ptKey) targetRow['Delivery'] = line.ptKey;
          if (line.invoiceDate) targetRow['Fecha de factura'] = line.invoiceDate;
          targetRow['EMBARQUE'] = line.embarque;
          if (line.tallaSap) targetRow['Talla'] = line.tallaSap;
          if (line.gridValue) targetRow['Talla marca'] = line.gridValue;
          if (!targetRow['Canal Inicial']) {
            targetRow['Canal Inicial'] = rowCanalIni;
          }
          if (line.actividad) targetRow['Actividad'] = line.actividad;
          if (line.grupo) targetRow['Grupo'] = line.grupo;
          if (line.categoria) targetRow['Categoría'] = line.categoria;
          if (line.genero) targetRow['Género'] = line.genero;
          if (line.linea) targetRow['Línea'] = line.linea;
          if (line.descripcion && !targetRow['Descripción']) targetRow['Descripción'] = line.descripcion;
          if (line.netPrice > 0) targetRow['FOB'] = line.netPrice;
          targetRow['Valor Neto'] = calcValorNeto(targetRow);
          appliedP24Rows.push({ row: targetRow, isForwarder: line.isForwarder });
        };

        if (Number(baseRow['Cantidad']) <= rem) {
          rem -= take;
          matchedUnits += take;
          perSeasonUnits[rowSeason] = (perSeasonUnits[rowSeason] || 0) + take;
          applyBillingFields(baseRow);
          changed.add(baseRow);
        } else {
          const facturada = { ...baseRow };
          delete facturada.id;
          facturada['Cantidad'] = take;
          applyBillingFields(facturada);

          baseRow['Cantidad'] = Number(baseRow['Cantidad']) - take;
          baseRow['Valor Neto'] = calcValorNeto(baseRow);

          matchedUnits += take;
          perSeasonUnits[rowSeason] = (perSeasonUnits[rowSeason] || 0) + take;
          rem = 0;
          changed.add(baseRow);
          added.push(facturada);
        }

        pushToCanalBucket(rowCanalIni, take, rowDetalle);
      }

      // Agregar una fila independiente por cada canal inicial encontrado en esa talla
      for (const subLine of perLineCanalBuckets.values()) {
        disaggregatedLines.push(subLine);
      }

      if (rem > 0) {
        unmatched.push({
          inv: line.invoiceNumber,
          pt: line.ptKey,
          temp: line.temporada,
          cod: line.material,
          grid: line.gridValue,
          sap: line.tallaSap,
          qty: rem
        });
        disaggregatedLines.push({
          ...line,
          reqQty: rem,
          qty: rem,
          netValue: Math.round((line.netPrice * rem) * 10000) / 10000,
          netValWithoutRound: Math.round((line.netWithoutRound * rem) * 10000) / 10000
        });
      }
    }

    // Construir lista de alertas de DROP por talla para Reebok (donde Reques quantity > Final Delivery QTY TOTAL)
    const detectedReebokDrops = [];
    if (isReebok) {
      for (const dRec of rbkSizeDropMap.values()) {
        const diffQty = Math.round((dRec.reqTotal - dRec.delivTotal) * 100) / 100;
        if (diffQty <= 0) continue;

        const talNorm = normTalla(dRec.tallaSap);
        const gridNorm = normTalla(dRec.gridValue);
        const rem10ARows = (rows10AByCod.get(dRec.codNorm) || []).filter(r =>
          st(r) === 'o' &&
          Number(r['Cantidad'] || 0) > 0 &&
          (normTalla(r['Talla']) === talNorm || (gridNorm && normTalla(r['Talla marca']) === gridNorm) || normTalla(r['Talla']) === gridNorm)
        );

        // Agrupar saldo restante en 10A por Canal Inicial
        const channelAvailMap = new Map();
        for (const r of rem10ARows) {
          const cIni = String(r['Canal Inicial'] || resolverCanalInicial(r['Referencia compra'], 'Reebok') || 'SIN CANAL').trim();
          channelAvailMap.set(cIni, (channelAvailMap.get(cIni) || 0) + Number(r['Cantidad'] || 0));
          if (!dRec.descripcion && r['Descripción']) dRec.descripcion = r['Descripción'];
          if (!dRec.color && r['Color']) dRec.color = r['Color'];
          if (!dRec.fob && Number(r['FOB']) > 0) dRec.fob = Number(r['FOB']);
        }

        // Desglose inicial antes de facturar para esa talla (para mostrar qué canales estaban originalmente en filas)
        const snapRows = (initial10ASnapshotByCod.get(dRec.codNorm) || []).filter(s =>
          s.talla === talNorm || (gridNorm && s.tallaMarca === gridNorm) || s.talla === gridNorm
        );
        const initCanalMap = new Map();
        for (const s of snapRows) {
          const key = `${s.canal}|||${s.refCompra}|||${s.detalle}`;
          if (!initCanalMap.has(key)) {
            initCanalMap.set(key, { canal: s.canal, refCompra: s.refCompra, detalle: s.detalle, qty: 0 });
          }
          initCanalMap.get(key).qty += s.qty;
        }
        const initialChannelsList = [...initCanalMap.values()]
          .sort((a, b) => getReebokDropPriorityScore(a.canal) - getReebokDropPriorityScore(b.canal));

        const channelsList = [...channelAvailMap.entries()]
          .map(([canal, avail]) => ({ canal, avail }))
          .sort((a, b) => getReebokDropPriorityScore(b.canal) - getReebokDropPriorityScore(a.canal));
        const suggestedCanal = pickPreferredReebokDropChannel(channelsList, diffQty);
        detectedReebokDrops.push({
          id: `RBKDROP_${norm(dRec.invoiceNumber)}_${dRec.codNorm}_${talNorm}_${Date.now()}_${Math.random().toString(36).slice(2, 5)}`,
          material: dRec.material,

          pts: dRec.ptKey || '',
          initialChannels10A: initialChannelsList,
          channels10A: channelsList,
          selectedCanal: suggestedCanal,
          status: 'PENDING',
          createdAt: new Date().toLocaleString('es-EC', { dateStyle: 'short', timeStyle: 'short' })
        });

    }

    // Construir objeto de Vista Previa desagregado por fila y canal inicial
    const buildPreviewSnapshot = () => {

          'Status', 'Sold-to party', 'Sales Order 1', 'No FACTURA ', 'FECHA DE FACTURA', 'FACTURA ', 'Purchase No',

    );
    icons();
    if (ch !== 'ok') return;

    const userEmb = $('inpBillEmb') ? $('inpBillEmb').value.trim() : '';
    const userFechaIng = $('inpBillFechaIng') ? $('inpBillFechaIng').value.trim() : '';

    disaggregatedLines.forEach(l => {
      if (!l.isForwarder && userEmb) l.embarque = userEmb;
    });
    S.lastBillingPreview = buildPreviewSnapshot();
    await saveBillingSnapshotToHistory(S.lastBillingPreview, file ? file.name : '');

    appliedP24Rows.forEach(item => {
      if (!item.isForwarder) {
        if (userEmb) item.row['EMBARQUE'] = userEmb;
        if (userFechaIng) item.row['Fecha de ingreso embarque'] = userFechaIng;
      } else {

        item.row['Fecha de ingreso embarque'] = '';
      }
    });

    busy('Guardando descuento de facturación en la base local…');
    await tick();
    if (changed.size) await dbPut([...changed]);
    if (added.length) await dbAdd(added);
    await reload();
    busy();

    if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      const affectedSeasons = new Set([S.season, ...Object.keys(perSeasonUnits)]);
      for (const sName of affectedSeasons) {
        await pushCloudBuySeason(S.brand, sName, true);
      }
    }

    if (isReebok && detectedReebokDrops.length > 0) {
      const newDropKeys = new Set(detectedReebokDrops.map(d => `${norm(d.invoices)}|${d.codNorm}|${normTalla(d.tallaSap)}`));
      const keptExisting = (S.reebokDropAlerts || []).filter(old => !newDropKeys.has(`${norm(old.invoices)}|${old.codNorm}|${normTalla(old.tallaSap)}`));

      await saveMeta();
      if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
        pushCloudConfig().catch(() => {});
      }
      render();
      await promptReebokDropAssignmentModal(detectedReebokDrops.map(d => d.id));
    } else {
      const postChoice = await modal(
        'Facturación Aplicada con Éxito',
        `Se descontaron <b>${fn(matchedUnits)} unidades</b> de <b>10A</b> y pasaron a <b>P24</b>.<br>
         <span class="text-xs text-slate-600">• Puedes visualizar las ${fn(S.lastBillingPreview.headers.length)} columnas transformadas (incluyendo filtros de <b>FORWARDER</b>) o descargar el Excel maestro.</span>`,

      if (postChoice === 'view') {
        viewBillingPreviewModal(S.lastBillingPreview);
      } else if (postChoice === 'dl') {
        exportBillingPreviewExcel(S.lastBillingPreview);
      }
    }
  } catch (e) {
    busy();
    modal(`Error al procesar Facturación ${S.brand}`, esc(e.message || e));
  }
}
