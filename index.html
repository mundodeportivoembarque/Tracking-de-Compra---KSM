<style>
  :root{
    --bg-canvas:#f4f5f7;
    --ink-primary:#0f172a;
    --ink-secondary:#475569;
    --brand-navy:#0f1e36;
    --brand-accent:#d92d20;
    --border-hairline:#e2e6ec;
  }
  body{font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;background:var(--bg-canvas);color:var(--ink-primary);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em}
  .font-mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  .num{font-variant-numeric:tabular-nums;text-align:right}
  /* Scrollbars refinados */
  ::-webkit-scrollbar{width:7px;height:7px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
  ::-webkit-scrollbar-thumb:hover{background:#94a3b8}
  /* Tablas corporativas limpias */
  thead th{position:sticky;top:0;background:#f8fafc;color:#475569;font-weight:700;text-transform:uppercase;font-size:.69rem;letter-spacing:.04em;z-index:2;box-shadow:0 1px 0 #e2e8f0}
  tfoot td{position:sticky;bottom:0;background:#f8fafc;z-index:2;box-shadow:0 -1px 0 #cbd5e1}
  tbody tr{transition:background-color .12s ease}
  /* Sistema de botones táctiles con micro-elevación */
  .btn{display:inline-flex;align-items:center;gap:.45rem;padding:.48rem .88rem;border-radius:.55rem;font-size:.825rem;font-weight:600;border:1px solid #d5dbe3;background:#fff;color:#1e293b;cursor:pointer;box-shadow:0 1px 2px rgba(15,23,42,.04);transition:all .15s cubic-bezier(.4,0,.2,1)}
  .btn:hover{background:#f8fafc;border-color:#bac4d1;transform:translateY(-0.5px);box-shadow:0 3px 8px rgba(15,23,42,.06)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.45;pointer-events:none;transform:none}
  .btn-p{background:#0f1e36;color:#fff;border-color:#0f1e36;box-shadow:0 2px 6px rgba(15,30,54,.22)}
  .btn-p:hover{background:#192e52;border-color:#192e52;box-shadow:0 4px 12px rgba(15,30,54,.28)}
  .btn-warn{background:#fffbeb;color:#b45309;border-color:#fde68a}
  .btn-warn:hover{background:#fef3c7}
  .btn-danger{background:#fef2f2;color:#b91c1c;border-color:#fecaca}
  .btn-danger:hover{background:#fee2e2}
  /* Navegación por pestañas tipo workspace profesional */
  .nav-strip{display:flex;align-items:center;gap:.25rem;padding-bottom:.15rem}
  .tab{position:relative;display:inline-flex;align-items:center;gap:.45rem;padding:.62rem .92rem;font-size:.835rem;font-weight:600;border-bottom:2.5px solid transparent;color:#64748b;border-radius:.45rem .45rem 0 0;transition:all .15s ease}
  .tab:hover{color:#0f172a;background:#f8fafc}
  .tab.on{border-color:#d92d20;color:#0f172a;background:linear-gradient(to top, rgba(217,45,32,.05), transparent)}
  /* Estados de fila sutiles con indicador lateral de color (sin bloques chillones) */
  .r-p{background:#ffffff}.r-p:hover{background:#f2fbf6}.r-p td:first-child{box-shadow:inset 3.5px 0 0 #16a34a}
  .r-o{background:#fffdf7}.r-o:hover{background:#fef9e7}.r-o td:first-child{box-shadow:inset 3.5px 0 0 #f59e0b}
  .r-d{background:#fff9f9;color:#7f1d1d}.r-d:hover{background:#fef2f2}.r-d td:first-child{box-shadow:inset 3.5px 0 0 #dc2626}
  .r-dep{background:#f8f9ff;color:#1e1b4b}.r-dep:hover{background:#eef2ff}.r-dep td:first-child{box-shadow:inset 3.5px 0 0 #4f46e5}
  /* Tarjetas KPI y paneles */
  .kpi-card{background:#fff;border:1px solid var(--border-hairline);border-radius:.85rem;padding:1.05rem 1.15rem;box-shadow:0 1px 3px rgba(15,23,42,.03),0 1px 2px rgba(15,23,42,.02);transition:transform .16s ease,box-shadow .16s ease}
  .kpi-card:hover{transform:translateY(-1px);box-shadow:0 8px 20px -6px rgba(15,23,42,.08)}
  .panel-card{background:#fff;border:1px solid var(--border-hairline);border-radius:.85rem;box-shadow:0 1px 3px rgba(15,23,42,.03)}
  :focus-visible{outline:2px solid #0f1e36;outline-offset:2px}
  /* Menús desplegables refinados */
  .dd-wrap{position:relative;display:inline-block}
  .dd-menu{position:absolute;right:0;top:calc(100% + 7px);min-width:265px;background:#fff;border:1px solid #dce2ea;border-radius:.75rem;box-shadow:0 16px 36px -6px rgba(15,23,42,.15),0 4px 12px -2px rgba(15,23,42,.06);padding:.45rem;z-index:45;animation:ddIn .14s cubic-bezier(.16,1,.3,1)}
  .dd-menu.left-align{right:auto;left:0}
  @keyframes ddIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
  .dd-item{width:100%;display:flex;align-items:flex-start;gap:.65rem;padding:.55rem .65rem;border-radius:.5rem;text-align:left;font-size:.8125rem;color:#1e293b;transition:background .12s}
  .dd-item:hover{background:#f1f5f9}
  .dd-item.danger{color:#b91c1c}
  .dd-item.danger:hover{background:#fef2f2}
  .dd-item.warn{color:#b45309}
  .dd-item.warn:hover{background:#fffbeb}
  .dd-sep{height:1px;background:#e2e8f0;margin:.38rem .3rem}
  .dd-lbl{padding:.28rem .65rem;font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b}
  /* Modales con backdrop blur */
  #modal{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  #modal > div{border-radius:1rem;border:1px solid #e2e8f0;box-shadow:0 24px 48px -12px rgba(15,23,42,.25)}
</style>
</head>

<aside class="w-[268px] shrink-0 flex flex-col text-slate-200 border-r border-slate-800/80 select-none" style="background:linear-gradient(180deg, #0b1526 0%, #101f36 100%)">
  <div class="px-5 pt-5 pb-4 border-b border-white/[0.08]">

        <span class="w-2.5 h-6 rounded-sm bg-[#d92d20] inline-block shrink-0"></span>

      </div>
      <button type="button" id="cloudStatusBtn" onclick="promptCloudSync()" class="shrink-0 flex items-center gap-1.5 text-[11px] text-emerald-400 font-semibold bg-emerald-950/70 border border-emerald-500/30 px-2.5 py-0.5 rounded-full hover:bg-emerald-900/60 transition cursor-pointer" title="Base Local · Haz clic para vincular carpeta OneDrive / SharePoint">

    <div class="text-[11px] text-slate-400/90 leading-snug">Control de Compras, Facturación & Régimen DEPCO</div>
  </div>
  <nav id="side" class="flex-1 overflow-y-auto py-3 px-2 space-y-2"></nav>
  <div class="px-4 py-3 border-t border-white/[0.07] text-[11px] text-slate-400 flex items-center justify-between">

function resolverCanalUnificado(canalInicial) {
  const c = String(canalInicial || '').trim().toUpperCase();
  if (!c) return '';
  if (c.includes('PROVEEDOR')) return 'PROVEEDOR';
  if (['KAO', 'EDCA', 'MAYORISTA'].includes(c)) return 'MAYORISTA';
  if (['TIENDAS', 'WEB ADIDAS TIENDAS', 'WEB REEBOK TIENDAS', 'WEB REEBOK MEDEPORT'].includes(c)) return 'TIENDAS';
  if (['BIG HEAD', 'EXPLORER', 'TAF', 'MARATHON', 'SNEAKERS', 'TELESHOP', 'OUTLET', 'WEB'].includes(c)) return 'MARATHON';
  if (c === 'MARKETING') return 'MARKETING';
  if (c === 'POP UP') return 'POP UP';
  if (c === 'SPOMA') return 'SPOMA';
  return c;
}

function resolveCanalInicialFromPO(poStr) {
  const raw = String(poStr || '').trim();
  if (!raw) return '';
  const u = raw.toUpperCase();

  // Analizar únicamente lo que va después de la temporada (después del primer guion)
  const dashIdx = u.indexOf('-');
  const afterDash = dashIdx !== -1
    ? u.slice(dashIdx + 1).trim()
    : u.replace(/^(FW|SS|S)\d{2}(Q\d)?\s*/, '').trim();
  const firstSeg = afterDash.split('-')[0].trim();

  if (afterDash.includes('ECOM MD') || afterDash.includes('WEB ADIDAS TIENDAS')) return 'WEB ADIDAS TIENDAS';

  if (/PROV[\s._-]*TAF/.test(afterDash)) return 'PROVEEDOR TAF';
  if (/PROV[\s._-]*OUTLET/.test(afterDash) || (afterDash.includes('PROVEEDOREXTRA') && afterDash.includes('CLE'))) return 'PROVEEDOR OUTLET';
  if (/PROV[\s._-]*MS/.test(afterDash) || afterDash.includes('PROVEEDOREXTRA')) return 'PROVEEDOR MS';
  if (afterDash.includes('PROVEEDOR') || afterDash.includes('PROVMINI') || firstSeg.startsWith('CLE') || afterDash.includes('PEDIDO MARCA')) return 'PROVEEDOR';

  if (firstSeg === 'BH' || afterDash.includes('BIG HEAD')) return 'BIG HEAD';
  if (firstSeg === 'EDCA' || afterDash.includes('-EDCA-') || afterDash.startsWith('EDCA-')) return 'EDCA';
  if (firstSeg === 'EXP' || firstSeg === 'EXPLORER' || firstSeg.startsWith('EXTRA_EXPLO') || afterDash.includes('EXPLORER')) return 'EXPLORER';
  if (firstSeg === 'SNK' || firstSeg === 'EXCL_SNK' || firstSeg === 'EXCLU_SNKRS' || afterDash.includes('EXCL_SNK') || afterDash.includes('SNEAKER')) return 'SNEAKERS';
  if (firstSeg === 'TSHOP' || firstSeg === 'TELESHOP' || afterDash.includes('TELESHOP')) return 'TELESHOP';
  if (firstSeg === 'POPUP' || firstSeg === 'POP UP' || afterDash.includes('POPUP') || afterDash.includes('POP UP')) return 'POP UP';
  if (firstSeg === 'SPOMA' || firstSeg.startsWith('SPOMAEVENTPACK') || afterDash.includes('-SPOMA')) return 'SPOMA';
  if (firstSeg === 'TAF' || firstSeg.startsWith('TAF_') || afterDash.includes('CLIMACOOL TAF') || afterDash.includes('-TAF-')) return 'TAF';
  if (firstSeg === 'MKT' || firstSeg.includes('15KQUITO') || firstSeg.includes('21KQUITO') || firstSeg.includes('15KQTUITO') || firstSeg.includes('MARATON15K') || afterDash.includes('-MKT-') || afterDash.includes('MKT TRENDS')) return 'MARKETING';
  if (firstSeg === 'OUT' || firstSeg === 'OUTLET' || firstSeg.startsWith('EXTRA_OUTLETS') || afterDash.includes('OUTLET')) return 'OUTLET';
  if (firstSeg === 'WEB' || firstSeg === 'EXCL_WEB' || firstSeg === 'EC EC' || firstSeg === 'MSWEB' || afterDash.includes('-WEB-') || afterDash.includes('EXCL_WEB')) return 'WEB';
  if (firstSeg === 'MAYOR' || firstSeg === 'MYR' || firstSeg === 'MAYORISTA' || firstSeg.startsWith('MAYEVENTPACK') || firstSeg === 'MAY' || afterDash.includes('MAYOR')) return 'MAYORISTA';
  if (firstSeg === 'TND' || firstSeg === 'TIENDAS' || firstSeg === 'TIEN' || firstSeg === 'TIEND' || firstSeg === 'OC QUIT' || firstSeg === 'RE_ORDER' || firstSeg === 'REORDER2' || firstSeg === 'FRA' || afterDash.includes('TIENDA') || afterDash.includes('-TND') || afterDash.includes('ECOM MUNDO') || afterDash.includes('MOQ')) return 'TIENDAS';
  if (firstSeg === 'MS' || firstSeg.startsWith('MS') || afterDash.includes('MARATHON')) return 'MARATHON';

  return 'TIENDAS';
}

function extractSeasonFromPO(poStr, fallbackSeason) {
  const u = String(poStr || '').trim().toUpperCase();
  if (!u) return fallbackSeason || S.season;
  const m4 = u.match(/^(FW\d{2}|SS\d{2})/);
  if (m4) return m4[1];
  const m3 = u.match(/^S(\d{2})/);
  if (m3) return 'SS' + m3[1];
  return fallbackSeason || S.season;
}

function sanitizeSapSize(v) {
  let s = String(v ?? '').trim();
  if (!s) return '';
  // Una TALLA SAP nunca lleva '#' (ej. '#5' o '5#' debe quedar limpia como '5')
  s = s.replace(/^#+|#+$/g, '').trim();
  return s;
}

function buildTallaSapLookup() {
  const pairs = Array.isArray(S.sizePairs) ? S.sizePairs : [];
  const map = new Map();
  const add = (k, v) => {
    const key = String(k || '').trim().toUpperCase();
    const val = sanitizeSapSize(v);
    if (!key || !val) return;
    if (!map.has(key)) map.set(key, []);
    const arr = map.get(key);
    if (!arr.includes(val)) arr.push(val);
  };
  for (const [tm, ts] of pairs) {
    add(tm, ts);
    const tStr = String(tm || '').trim().toUpperCase();
    if (/^-\d+$/.test(tStr)) {
      add(tStr.slice(1) + '-', ts);
    } else if (/^\d+-$/.test(tStr)) {
      add('-' + tStr.slice(0, -1), ts);
    } else if (/^#\d+(\.\d+)?$/.test(tStr)) {
      add(tStr.slice(1) + '#', ts);
      add(tStr.slice(1), ts);
    } else if (/^\d+(\.\d+)?#$/.test(tStr)) {
      add('#' + tStr.slice(0, -1), ts);
      add(tStr.slice(0, -1), ts);
    }
  }
  return map;
}

function getTallaSapCandidates(gridVal, explicitSap, lookupMap) {
  const out = [];
  const pushUnique = v => {
    const s = sanitizeSapSize(v);
    if (s && !out.includes(s)) out.push(s);
  };
  if (explicitSap) pushUnique(explicitSap);
  const raw = String(gridVal ?? '').trim().toUpperCase();
  if (raw) {
    const hits = lookupMap.get(raw) || [];
    hits.forEach(pushUnique);
    if (/^\d+-$/.test(raw)) {
      const alt = '-' + raw.slice(0, -1);
      (lookupMap.get(alt) || []).forEach(pushUnique);
    } else if (/^-\d+$/.test(raw)) {
      const alt = raw.slice(1) + '-';
      (lookupMap.get(alt) || []).forEach(pushUnique);
    } else if (/^#\d+(\.\d+)?$/.test(raw)) {
      const numPart = raw.slice(1);
      (lookupMap.get(numPart + '#') || []).forEach(pushUnique);
      (lookupMap.get(numPart) || []).forEach(pushUnique);
      pushUnique(numPart);
    } else if (/^\d+(\.\d+)?#$/.test(raw)) {
      const numPart = raw.slice(0, -1);
      (lookupMap.get('#' + numPart) || []).forEach(pushUnique);
      (lookupMap.get(numPart) || []).forEach(pushUnique);
      pushUnique(numPart);
    }
    pushUnique(raw);
  }
  return out;
}

function hasPriceChange(r) {

function fdate(v) {
  if (!v && v !== 0) return '';
  if (v instanceof Date && !isNaN(v)) {
    return v.getFullYear() + '-' + String(v.getMonth() + 1).padStart(2, '0') + '-' + String(v.getDate()).padStart(2, '0');
  }
  if (typeof v === 'number' && v > 20000 && v < 80000) {
    const dt = new Date(Math.round((v - 25569) * 86400 * 1000));
    if (!isNaN(dt)) return dt.getUTCFullYear() + '-' + String(dt.getUTCMonth() + 1).padStart(2, '0') + '-' + String(dt.getUTCDate()).padStart(2, '0');
  }
  const s = String(v).trim();
  if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(s)) {
    const [d, m, yRaw] = s.split('/');
    const y = yRaw.length === 2 ? '20' + yRaw : yRaw;
    return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
  }
  return s;
}
function getQuincena(fechaStr) {
  const s = String(fechaStr || '').trim();
  if (!s) return '';
  let day = 0;
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) {
    day = parseInt(s.split('-')[2], 10);
  } else if (/^\d{1,2}\/\d{1,2}\/\d{2,4}/.test(s)) {
    day = parseInt(s.split('/')[0], 10);
  }
  if (!day || isNaN(day)) return '';
  return day <= 15 ? 'q1' : 'q2';
}

const rq = r => new Promise((ok, ko) => { r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
const txDone = t => new Promise((ok, ko) => { t.oncomplete = ok; t.onerror = t.onabort = () => ko(t.error); });
function openDB() {
  return new Promise((ok, ko) => {
    const r = indexedDB.open('eot-db-local-v4', 2);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('rows')) {
        const s = d.createObjectStore('rows', { keyPath: 'id', autoIncrement: true });
        s.createIndex('sb', 'sb');
      }
      if (!d.objectStoreNames.contains('meta')) {
        d.createObjectStore('meta');
      }
      if (!d.objectStoreNames.contains('handles')) {
        d.createObjectStore('handles');
      }
    };
    r.onsuccess = () => ok(r.result);
    r.onerror = () => ko(r.error);
  });
}
async function dbAdd(rows, label) {
  for (let i = 0; i < rows.length; i += 10000) {
    const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
    rows.slice(i, i + 10000).forEach(r => s.add(r));
    await txDone(t);
    if (label && rows.length > 10000) {
      busy(label + ' ' + fn(Math.min(i + 10000, rows.length)) + ' / ' + fn(rows.length));
      await tick();
    }
  }
}
async function dbPut(rows) {
  for (let i = 0; i < rows.length; i += 10000) {
    const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
    rows.slice(i, i + 10000).forEach(r => s.put(r));
    await txDone(t);
  }
}
async function dbDeleteIds(ids) {
  for (let i = 0; i < ids.length; i += 10000) {
    const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');
    ids.slice(i, i + 10000).forEach(id => s.delete(id));
    await txDone(t);
  }
}

  const t = db.transaction('rows', 'readwrite'), s = t.objectStore('rows');

  await txDone(t);
}

async function reload() {
  const rawRows = S.season ? await dbSeason(sbKey()) : [];
  const migrated = [];
  rawRows.forEach(r => {
    let dirty = false;
    if (r['FOB'] === undefined) {
      r['FOB'] = 0;
      dirty = true;
    }
    const calcVn = calcValorNeto(r);
    if (r['Valor Neto'] === undefined || (r['FOB'] > 0 && r['Cantidad'] > 0 && !r['Valor Neto'])) {
      r['Valor Neto'] = calcVn;
      dirty = true;
    }
    // Todo registro histórico que no tenga Detalle compra asignado se etiqueta automáticamente como COMPRA CANAL
    if (!r['Detalle compra'] || !String(r['Detalle compra']).trim()) {
      r['Detalle compra'] = 'COMPRA CANAL';
      dirty = true;
    }
    if (!r['Régimen'] || !String(r['Régimen']).trim()) {
      r['Régimen'] = 'CONSUMO';
      dirty = true;
    }
    const rRefUp = String(r['Referencia compra'] || '').trim().toUpperCase();
    const rCiUp = String(r['Canal Inicial'] || '').trim().toUpperCase();
    if ((rRefUp === 'PR02' || rRefUp === 'PRO2' || rRefUp.includes('PR02') || rRefUp.includes('PRO2') || rCiUp === 'PR02' || rCiUp === 'PRO2') && r['Canal Inicial'] !== 'TIENDAS') {
      r['Canal Inicial'] = 'TIENDAS';
      dirty = true;
    }
    if (dirty && r.id != null) migrated.push(r);
  });
  if (migrated.length) {
    await dbPut(migrated);
  }
  S.rows = rawRows;
  await refreshCounts();
  render();
}

    for (const s of (S.seasons[b] || [])) {
      if (!s) continue;
      const key = `${b}|${s}`;
      const rows = (b === S.brand && s === S.season) ? S.rows : await dbSeason(key);
      seasonsData[key] = {
        brand: b,
        season: s,
        rows: rows.map(r => {
          const o = { ...r };
          delete o.id;
          return o;
        }),
        template: getTplData(key)
      };
    }
  }
  return {

async function importOneDriveBundleFile(file) {
  try {
    busy('Restaurando información completa desde paquete de nube…');
    await tick();
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !data.seasonsData || typeof data.seasonsData !== 'object') {
      throw new Error('El archivo seleccionado no es un paquete válido de Sistema de Tracking - KSM.');
    }
    if (data.seasons) S.seasons = data.seasons;
    if (data.logos) S.logos = { ...S.logos, ...data.logos };
    if (Array.isArray(data.sizePairs)) S.sizePairs = data.sizePairs;
    if (data.sapCatalog && typeof data.sapCatalog === 'object') {
      S.sapCatalog = { ...S.sapCatalog, ...data.sapCatalog };
    }
    if (data.billingHistory && typeof data.billingHistory === 'object') {
      S.billingHistory = { Adidas: [], Reebok: [], ...data.billingHistory };
    }
    if (Array.isArray(data.reebokDropAlerts)) S.reebokDropAlerts = data.reebokDropAlerts;
    if (Array.isArray(data.depcoLpnHistory)) S.depcoLpnHistory = data.depcoLpnHistory;
    if (Array.isArray(data.tiendasConsolHistory)) S.tiendasConsolHistory = data.tiendasConsolHistory;

    for (const [key, entry] of Object.entries(data.seasonsData)) {
      const b = entry.brand || key.split('|')[0];
      const s = entry.season || key.split('|')[1];
      if (!b || !s) continue;
      if (!S.seasons[b]) S.seasons[b] = [];
      if (!S.seasons[b].includes(s)) S.seasons[b].push(s);
      await dbDelSeason(key);
      const cleanRows = (entry.rows || []).map(r => {
        const row = { ...r, brand: b, season: s, sb: key };
        if (row['FOB'] === undefined) row['FOB'] = 0;
        row['Valor Neto'] = calcValorNeto(row);
        if (!row['Detalle compra'] || !String(row['Detalle compra']).trim()) row['Detalle compra'] = 'COMPRA CANAL';
        return row;
      });
      if (cleanRows.length) await dbAdd(cleanRows, 'Restaurando');
      if (entry.template) {
        S.templates[key] = entry.template;
      }
    }

    if (data.active && data.active.brand && data.active.season) {
      S.brand = data.active.brand;
      S.season = data.active.season;
    }

    await saveMeta();
    await reload();
    S.cloud.lastSync = new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    S.cloud.lastError = '';
    updateCloudBadge();
    busy();
    modal(
      'Información Restaurada desde la Nube',
      `Se restauraron todas las marcas, temporadas, compras, plantillas, catálogos SAP y facturación desde <b>${esc(file.name)}</b>.`
    );
  } catch (e) {
    busy();
    modal('Error al restaurar paquete de nube', esc(e.message || e));
  }
}

    if (!ok) {

      updateCloudBadge();
      return;
    }
    await pushCloudConfig();
    const seen = new Set();
    for (const [b, s] of pairs) {
      const k = `${b || S.brand}|${s || S.season}`;
      if (seen.has(k)) continue;
      seen.add(k);
      await pushCloudBuySeason(b || S.brand, s || S.season, true);
      await pushCloudTemplateSeason(b || S.brand, s || S.season, true);
    }
    S.cloud.lastError = '';
    updateCloudBadge();
  } catch (e) {
    S.cloud.lastError = e.message || String(e);
    updateCloudBadge();
  }
}

async function ensureCloudPermission(requestIfNeeded = true) {
  if (!S.cloud.dirHandle) return false;
  let perm = await S.cloud.dirHandle.queryPermission({ mode: 'readwrite' });
  if (perm !== 'granted' && requestIfNeeded) {
    perm = await S.cloud.dirHandle.requestPermission({ mode: 'readwrite' });
  }
  S.cloud.connected = (perm === 'granted');
  updateCloudBadge();
  return S.cloud.connected;
}

async function compressJsonString(jsonStr) {
  if (typeof CompressionStream !== 'undefined') {
    const stream = new Blob([jsonStr]).stream().pipeThrough(new CompressionStream('gzip'));
    return await new Response(stream).arrayBuffer();
  }
  return new TextEncoder().encode(jsonStr).buffer;
}

async function decompressToJsonString(arrayBuffer) {
  const bytes = new Uint8Array(arrayBuffer);
  if (bytes.length >= 2 && bytes[0] === 0x1f && bytes[1] === 0x8b && typeof DecompressionStream !== 'undefined') {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return await new Response(stream).text();
  }
  return new TextDecoder().decode(bytes);
}

async function writeCloudFile(fileName, dataBufferOrStr) {
  const fileHandle = await S.cloud.dirHandle.getFileHandle(fileName, { create: true });
  const writable = await fileHandle.createWritable();
  await writable.write(dataBufferOrStr);
  await writable.close();
}

// Guarda SOLO el archivo de Compra de la temporada indicada (ej. Compra_Adidas_FW26.json.gz)
async function pushCloudBuySeason(brand = S.brand, season = S.season, silent = true) {
  if (!S.cloud.dirHandle) return false;
  const okPerm = await ensureCloudPermission(!silent);
  if (!okPerm) return false;

  try {
    if (!silent) busy(`Guardando ${buyFileName(brand, season)} en OneDrive…`);
    await tick();
    const key = `${brand}|${season}`;
    const seasonRows = (brand === S.brand && season === S.season) ? S.rows : await dbSeason(key);
    const cleanRows = seasonRows.map(r => {
      const o = { ...r };
      delete o.id;
      return o;
    });
    const payload = {
      app: 'EOT_MEDEPORT_BUY',
      version: '7.1',
      brand,
      season,
      updatedAt: new Date().toISOString(),
      rowCount: cleanRows.length,
      rows: cleanRows
    };
    const buf = await compressJsonString(JSON.stringify(payload));
    const fname = buyFileName(brand, season);
    await writeCloudFile(fname, buf);
    await pushCloudConfig();

    const nowStr = new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    S.cloud.lastSync = nowStr;
    S.cloud.filesStatus[fname] = { rows: cleanRows.length, kb: Math.round(buf.byteLength / 1024), time: nowStr };
    await saveCloudDirHandle(S.cloud.dirHandle, S.cloud.autoSync);
    if (!silent) busy();
    return true;
  } catch (e) {
    if (!silent) {
      busy();
      modal('Error al guardar Compra en OneDrive', esc(e.message || e));
    }
    return false;
  }
}

  if (!okPerm) return false;

  try {
    if (!silent) busy(`Guardando ${tplFileName(brand, season)} en OneDrive…`);
    await tick();
    const key = `${brand}|${season}`;
    const tplObj = getTplData(key);
    const skuCount = Object.keys(tplObj.items).length;
    const payload = {
      app: 'EOT_MEDEPORT_TEMPLATE',
      version: '7.1',
      brand,
      season,
      updatedAt: new Date().toISOString(),
      skuCount,
      template: tplObj
    };
    const buf = await compressJsonString(JSON.stringify(payload));
    const fname = tplFileName(brand, season);
    await writeCloudFile(fname, buf);
    await pushCloudConfig();

    const nowStr = new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    S.cloud.lastSync = nowStr;
    S.cloud.filesStatus[fname] = { skus: skuCount, kb: Math.round(buf.byteLength / 1024), time: nowStr };
    await saveCloudDirHandle(S.cloud.dirHandle, S.cloud.autoSync);
    if (!silent) busy();
    return true;
  } catch (e) {
    if (!silent) {
      busy();
      modal('Error al guardar Plantilla en OneDrive', esc(e.message || e));
    }
    return false;
  }
}

// Sincroniza TODAS las marcas/temporadas hacia archivos separados en la carpeta OneDrive
async function pushAllSeparatedToCloud(silent = false) {
  if (!S.cloud.dirHandle) return false;
  const okPerm = await ensureCloudPermission(!silent);
  if (!okPerm) return false;

  try {
    if (!silent) busy('Exportando archivos separados por temporada a OneDrive…');
    await tick();
    await pushCloudConfig();

    const savedFiles = [];
    for (const b of Object.keys(S.seasons)) {
      for (const s of S.seasons[b]) {
        const key = `${b}|${s}`;
        const seasonRows = await dbSeason(key);
        if (seasonRows.length > 0) {
          await pushCloudBuySeason(b, s, true);
          savedFiles.push(`${buyFileName(b, s)} (${fn(seasonRows.length)} filas)`);
        }
        const tplObj = getTplData(key);
        if (Object.keys(tplObj.items).length > 0) {
          await pushCloudTemplateSeason(b, s, true);
          savedFiles.push(`${tplFileName(b, s)} (${fn(Object.keys(tplObj.items).length)} SKUs)`);
        }
      }
    }

    if (!silent) {
      busy();
      modal(
        'Carpeta OneDrive Sincronizada',
        `<div class="space-y-2">
           <p>Se guardaron los archivos independientes en la carpeta <b>${esc(S.cloud.dirName)}</b>:</p>
           <div class="p-3 rounded-lg bg-sky-50 border border-sky-200 text-sky-950 text-xs space-y-1 max-h-52 overflow-y-auto">
             <div class="font-semibold">• ${cfgFileName()} (Marcas, temporadas y logos)</div>
             ${savedFiles.map(f => `<div>• ${esc(f)}</div>`).join('') || '<div class="text-slate-500">Sin datos cargados aún.</div>'}
           </div>
         </div>`
      );
    }
    return true;
  } catch (e) {
    if (!silent) {
      busy();
      modal('Error al sincronizar carpeta', esc(e.message || e));
    }
    return false;
  }
}

// Lee y restaura archivos desde la carpeta OneDrive (permite cargar solo la temporada actual o toda la carpeta)
async function pullFromCloudFolder(onlyActiveSeason = false, silent = false) {
  if (!S.cloud.dirHandle) return;
  const okPerm = await ensureCloudPermission(!silent);
  if (!okPerm) return;
  try {
    if (!silent) {
      busy('Leyendo archivos de la carpeta OneDrive / SharePoint…');
      await tick();
    }
    // 1. Leer configuración (marcas, temporadas y logos) si existe
    try {
      const cfgFile = await readCloudFile(cfgFileName());
      const cfgData = JSON.parse(await cfgFile.text());
      if (cfgData.seasons) S.seasons = cfgData.seasons;
      if (cfgData.logos) S.logos = { ...S.logos, ...cfgData.logos };
      if (Array.isArray(cfgData.sizePairs)) S.sizePairs = cfgData.sizePairs;
      if (cfgData.sapCatalog && typeof cfgData.sapCatalog === 'object') {
        S.sapCatalog = { ...S.sapCatalog, ...cfgData.sapCatalog };
      }
      if (cfgData.billingHistory && typeof cfgData.billingHistory === 'object') {
        S.billingHistory = { Adidas: [], Reebok: [], ...cfgData.billingHistory };
      }
      if (Array.isArray(cfgData.reebokDropAlerts)) S.reebokDropAlerts = cfgData.reebokDropAlerts;
      if (Array.isArray(cfgData.depcoLpnHistory)) S.depcoLpnHistory = cfgData.depcoLpnHistory;
      if (Array.isArray(cfgData.tiendasConsolHistory)) S.tiendasConsolHistory = cfgData.tiendasConsolHistory;
      await saveMeta();
    } catch (e) {}
    // Listar archivos reales en la carpeta
    const entries = [];
    for await (const [name, handle] of S.cloud.dirHandle.entries()) {
      if (handle.kind === 'file' && (name.startsWith('Compra_') || name.startsWith('Plantilla_')) && name.endsWith('.json.gz')) {
        entries.push({ name, handle });
      }
    }
    if (!entries.length) {
      if (!silent) {
        busy();
        return modal(
          'Carpeta sin archivos de tracking',
          `No se encontraron archivos <code>Compra_...json.gz</code> ni <code>Plantilla_...json.gz</code> dentro de <b>${esc(S.cloud.dirName)}</b>.<br><br>
          Si es la primera vez que vinculas esta carpeta, haz clic en <b>"Guardar toda la base en carpeta"</b>.`
        );
      }
      await reload();
      return;
    }
    const targetBuy = buyFileName(S.brand, S.season);
    const targetTpl = tplFileName(S.brand, S.season);
    const toLoad = onlyActiveSeason
      ? entries.filter(e => e.name === targetBuy || e.name === targetTpl)
      : entries;
    if (!toLoad.length) {
      if (!silent) {
        busy();
        return modal('Sin archivos para esta temporada', `No existen archivos guardados para <b>${S.brand} ${esc(S.season)}</b> en la carpeta.`);
      }
      await reload();
      return;
    }
    let loadedBuyCount = 0;
    let loadedTplCount = 0;
    for (const item of toLoad) {
      if (!silent) {
        busy(`Descargando ${item.name}…`);
        await tick();
      }
      const file = await item.handle.getFile();
      const buf = await file.arrayBuffer();
      const jsonStr = await decompressToJsonString(buf);
      const data = JSON.parse(jsonStr);
      if (item.name.startsWith('Compra_') && Array.isArray(data.rows)) {
        const b = data.brand || S.brand;
        const s = data.season || S.season;
        if (!S.seasons[b]) S.seasons[b] = [];
        if (!S.seasons[b].includes(s)) S.seasons[b].push(s);
        const key = `${b}|${s}`;
        await dbDelSeason(key);
        const cleanRows = data.rows.map(r => {
          const row = { ...r, brand: b, season: s, sb: key };
          if (row['FOB'] === undefined) row['FOB'] = 0;
          row['Valor Neto'] = calcValorNeto(row);
          if (!row['Detalle compra'] || !String(row['Detalle compra']).trim()) row['Detalle compra'] = 'COMPRA CANAL';
          return row;
        });
        await dbAdd(cleanRows);
        loadedBuyCount += cleanRows.length;
        S.cloud.filesStatus[item.name] = { rows: cleanRows.length, kb: Math.round(buf.byteLength / 1024), time: new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' }) };
      } else if (item.name.startsWith('Plantilla_') && data.template) {
        const b = data.brand || S.brand;
        const s = data.season || S.season;
        if (!S.seasons[b]) S.seasons[b] = [];
        if (!S.seasons[b].includes(s)) S.seasons[b].push(s);
        const key = `${b}|${s}`;
        S.templates[key] = data.template;
        loadedTplCount++;
        S.cloud.filesStatus[item.name] = { skus: Object.keys(data.template.items || data.template).length, kb: Math.round(buf.byteLength / 1024), time: new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit' }) };
      }
    }
    await saveMeta();
    S.cloud.lastSync = new Date().toLocaleTimeString('es-EC', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    await saveCloudDirHandle(S.cloud.dirHandle, S.cloud.autoSync);
    await reload();
    if (!silent) {
      busy();
      modal(
        'Sincronización desde OneDrive Completada',
        `<div class="space-y-2">
           <p>Se actualizaron los datos locales desde la carpeta <b>${esc(S.cloud.dirName)}</b>:</p>
           <div class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-950 text-xs space-y-1">
             <div>• <b>Registros de compra cargados:</b> ${fn(loadedBuyCount)} filas</div>
             <div>• <b>Plantillas de presentación cargadas:</b> ${fn(loadedTplCount)} archivo(s)</div>
           </div>
         </div>`
      );
    }
  } catch (e) {
    if (!silent) {
      busy();
      modal('Error al leer carpeta OneDrive', esc(e.message || e));
    }
  }
}

async function linkCloudFolder() {
  if (!window.showDirectoryPicker) {
    return modal('Navegador no compatible', 'Tu navegador no soporta selección de carpetas. Usa Google Chrome o Microsoft Edge actualizado.');
  }
  try {
    const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
    await saveCloudDirHandle(dirHandle, true);
    S.cloud.connected = true;
    updateCloudBadge();

    // Revisar si la carpeta ya tiene archivos guardados previamente
    let hasExistingFiles = false;
    for await (const [name, handle] of dirHandle.entries()) {
      if (handle.kind === 'file' && (name.startsWith('Compra_') || name.startsWith('Plantilla_'))) {
        hasExistingFiles = true;
        break;
      }
    }

    if (hasExistingFiles) {
      const choice = await modal(
        `Carpeta vinculada: ${esc(dirHandle.name)}`,
        `<p>Esta carpeta de OneDrive ya contiene archivos de <b>Compras</b> y/o <b>Plantillas</b> guardados previamente.</p>
         <p class="text-xs text-slate-600 mt-1">¿Qué deseas hacer ahora?</p>`,
        [['Guardar mis datos actuales en la carpeta', 'push'], ['Cargar datos desde la carpeta a mi navegador', 'pull', 1]]
      );
      if (choice === 'pull') {
        await pullFromCloudFolder(false);
      } else if (choice === 'push') {
        await pushAllSeparatedToCloud(false);
      }
    } else {
      await pushAllSeparatedToCloud(false);
    }
  } catch (e) {
    if (e && e.name !== 'AbortError') {
      modal('No se pudo vincular la carpeta', esc(e.message || e));
    }
  }
}

/* ============ GESTIÓN DE PLANTILLA DE PRESENTACIÓN (MAESTRO DE PRODUCTO) ============ */
function getTplData(key = sbKey()) {
  const raw = S.templates[key];
  if (!raw) return { headers: [], items: {} };
  if (raw.items && Array.isArray(raw.headers)) return raw;
  return {
    headers: ['Código', 'Descripción', 'Grupo', 'Categoría', 'Actividad', 'Línea', 'Género', 'Color', 'FOB', 'PVP', 'PVP retail', 'P4', 'PMY', 'Fecha de entrega', 'Fecha de venta'],
    items: raw
  };
}
function isRowLockedByEmbarque(r) {
  return Boolean(String(r['EMBARQUE'] || '').trim());
}

function applyTemplateToRow(r, tplCatalog) {
  const itemsMap = tplCatalog && tplCatalog.items ? tplCatalog.items : tplCatalog;
  if (!itemsMap || isRowLockedByEmbarque(r)) return false;
  const cod = norm(r['Código']);
  if (!cod) return false;
  const item = itemsMap[cod];
  if (!item) return false;

  let changed = false;
  if (item.descripcion && r['Descripción'] !== item.descripcion) { r['Descripción'] = item.descripcion; changed = true; }
  if (item.grupo && r['Grupo'] !== item.grupo) { r['Grupo'] = item.grupo; changed = true; }
  if (item.categoria && r['Categoría'] !== item.categoria) { r['Categoría'] = item.categoria; changed = true; }
  if (item.actividad && r['Actividad'] !== item.actividad) { r['Actividad'] = item.actividad; changed = true; }
  if (item.linea && r['Línea'] !== item.linea) { r['Línea'] = item.linea; changed = true; }
  if (item.genero && r['Género'] !== item.genero) { r['Género'] = item.genero; changed = true; }
  if (item.color && (!r['Color'] || norm(r['Color']) === 'faltacolor')) { r['Color'] = item.color; changed = true; }
  if (item.fEntrega && r['Fecha de entrega'] !== item.fEntrega) { r['Fecha de entrega'] = item.fEntrega; changed = true; }
  if (item.fVenta && r['Fecha de venta'] !== item.fVenta) { r['Fecha de venta'] = item.fVenta; changed = true; }

  if (item.fob > 0 && Math.abs((Number(r['FOB']) || 0) - item.fob) > 0.0001) {
    r['FOB'] = item.fob;
    changed = true;
  }
  if (item.pvp > 0 && Math.abs((Number(r['PVP']) || 0) - item.pvp) > 0.001) {
    r['PVP'] = item.pvp;
    changed = true;
  }
  if (item.pvpRetail > 0 && Math.abs((Number(r['PVP retail']) || 0) - item.pvpRetail) > 0.001) {
    r['PVP retail'] = item.pvpRetail;
    changed = true;
  }
  if (item.p4 > 0 && Math.abs((Number(r['P4']) || 0) - item.p4) > 0.001) {
    r['P4'] = item.p4;
    changed = true;
  }
  if (item.pmy > 0 && Math.abs((Number(r['PMY']) || 0) - item.pmy) > 0.001) {
    r['PMY'] = item.pmy;
    changed = true;
  }
  const newVn = calcValorNeto(r);
  if (Math.abs((Number(r['Valor Neto']) || 0) - newVn) > 0.0001) {
    r['Valor Neto'] = newVn;
    changed = true;
  }
  return changed;
}

async function promptPresentationTemplate() {

function getTplRowArray(it, headers) {
  if (Array.isArray(it.fullRow) && it.fullRow.length) return it.fullRow;
  return [
    it.codigo || '', it.descripcion || '', it.grupo || '', it.actividad || '', it.genero || '', it.color || '',
    it.fob || 0, it.pvp || 0, it.pvpRetail || 0, it.p4 || 0, it.pmy || 0, it.fEntrega || '', it.fVenta || ''
  ];
}

function exportPresentationTemplate() {
  const { headers, items } = getTplData(sbKey());
  const list = Object.values(items);
  if (!list.length) return modal('Sin plantilla', 'No hay datos en la plantilla de presentación actual.');
  const aoa = [
    headers,
    ...list.map(it => getTplRowArray(it, headers))
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), 'CONSOLIDADO');
  XLSX.writeFile(wb, `PLANTILLA_PRESENTACION_${S.brand}_${S.season}.xlsx`);
}

async function loadPresentationTemplate(file) {
  try {
    busy('Analizando Plantilla de Presentación…');
    await tick();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    // Buscar la hoja CONSOLIDADO o la primera hoja
    const targetSheetName = wb.SheetNames.find(n => norm(n).includes('consolidado')) || wb.SheetNames[0];
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[targetSheetName], { header: 1, defval: '', raw: true });
    if (!aoa.length) throw new Error('La hoja de la plantilla está vacía.');

    // Detectar dinámicamente la fila de encabezados real (donde aparece CODIGO y FOB/PVP/DETALLE)
    let headerRowIdx = -1;
    for (let i = 0; i < Math.min(15, aoa.length); i++) {
      const rowNorm = aoa[i].map(c => norm(c));
      if (rowNorm.includes('codigo') && (rowNorm.includes('fob') || rowNorm.includes('pvp') || rowNorm.includes('detalle'))) {
        headerRowIdx = i;
        break;
      }
    }
    if (headerRowIdx === -1) {
      throw new Error('No se encontró la fila de encabezados con "CODIGO" y "FOB/PVP/DETALLE" en la plantilla.');
    }

    const rawHeaders = aoa[headerRowIdx].map((h, idx) => String(h ?? '').trim() || `COL_${idx + 1}`);
    const colIdx = {};
    rawHeaders.forEach((h, idx) => {
      const nh = norm(h);
      if (!nh) return;
      if (colIdx[nh] === undefined) colIdx[nh] = idx;
    });

    const getCell = (rowArr, aliases) => {
      for (const a of aliases) {
        const idx = colIdx[norm(a)];
        if (idx !== undefined && rowArr[idx] !== undefined && rowArr[idx] !== '') {
          return rowArr[idx];
        }
      }
      return '';
    };

    const prevEntry = S.templates[sbKey()];
    const prevItems = prevEntry && prevEntry.items ? prevEntry.items : (prevEntry && !prevEntry.items ? prevEntry : {});
    const existingCatalog = tplUploadMode === 'merge' ? { ...prevItems } : {};
    const finalHeaders = (tplUploadMode === 'merge' && prevEntry && Array.isArray(prevEntry.headers) && prevEntry.headers.length >= rawHeaders.length)
      ? prevEntry.headers
      : rawHeaders;
    let parsedSkus = 0;

    for (let i = headerRowIdx + 1; i < aoa.length; i++) {
      const rowArr = aoa[i];
      const codRaw = String(getCell(rowArr, ['CODIGO', 'Código', 'SAP'])).trim();
      const cod = norm(codRaw);
      if (!cod || cod === 'origen') continue;

      const colorRaw = String(getCell(rowArr, ['COLOR PRINCIPAL', 'Color'])).trim();
      const colorClean = (colorRaw && colorRaw !== '-' && !norm(colorRaw).includes('faltacolor')) ? colorRaw : '';

      const fullRow = finalHeaders.map((hName, hIdx) => {
        const origIdx = rawHeaders.indexOf(hName);
        const val = origIdx !== -1 ? rowArr[origIdx] : rowArr[hIdx];
        if (val instanceof Date && !isNaN(val)) return fdate(val);
        return val == null ? '' : val;
      });

      existingCatalog[cod] = {
        codigo: codRaw,
        descripcion: String(getCell(rowArr, ['DETALLE', 'Descripción', 'DESCRIPCION'])).trim(),
        grupo: String(getCell(rowArr, ['GRUPO', 'Grupo'])).trim(),
        categoria: String(getCell(rowArr, ['TIPO_VENTA', 'TIPO VENTA', 'Tipo Venta', 'CATEGORIA', 'Categoría', 'PRODUCT DIVISION', 'DIVISION'])).trim(),
        actividad: String(getCell(rowArr, ['ACTIVIDAD', 'Actividad'])).trim(),
        linea: String(getCell(rowArr, ['LINEA', 'Línea', 'PRODUCT LINE', 'SUBCATEGORIA'])).trim(),
        genero: String(getCell(rowArr, ['GENERO', 'Género'])).trim(),
        color: colorClean,
        fob: Number(String(getCell(rowArr, ['FOB']) || 0).replace(',', '.')) || 0,
        pvp: Number(String(getCell(rowArr, ['PVP']) || 0).replace(',', '.')) || 0,
        pvpRetail: Number(String(getCell(rowArr, ['PVP RETAIL', 'PVP retail']) || 0).replace(',', '.')) || 0,
        p4: Number(String(getCell(rowArr, ['P4']) || 0).replace(',', '.')) || 0,
        pmy: Number(String(getCell(rowArr, ['PMY']) || 0).replace(',', '.')) || 0,
        fEntrega: fdate(getCell(rowArr, ['FECHA DE ENTREGA', 'Fecha de entrega'])),
        fVenta: fdate(getCell(rowArr, ['FECHA DE VENTA', 'Fecha de venta'])),
        fullRow
      };
      parsedSkus++;
    }

    if (!parsedSkus) {
      throw new Error('No se encontraron filas con códigos válidos debajo de los encabezados.');
    }

    S.templates[sbKey()] = { headers: finalHeaders, items: existingCatalog };
    refreshBillingHistoryEnrichment(S.brand);
    await saveMeta();

    // Aplicar inmediatamente solo a las filas existentes que NO tienen EMBARQUE asignado
    const modifiedRows = [];
    let skippedLocked = 0;
    for (const r of S.rows) {
      if (isRowLockedByEmbarque(r)) {
        skippedLocked++;
        continue;
      }
      if (applyTemplateToRow(r, existingCatalog)) {
        modifiedRows.push(r);
      }
    }

    if (modifiedRows.length) {
      busy('Sincronizando registros sin embarque…');
      await tick();
      await dbPut(modifiedRows);
    }

    await reload();
    busy();

    if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      pushCloudTemplateSeason(S.brand, S.season, true);
      if (modifiedRows.length) pushCloudBuySeason(S.brand, S.season, true);
    }
    modal(
      'Plantilla de Presentación Sincronizada',
      `<div class="space-y-2">
         <p>Se procesaron <b>${fn(parsedSkus)} SKUs</b> en el catálogo maestro de <b>${S.brand} ${esc(S.season)}</b> (Total catálogo: <b>${fn(Object.keys(existingCatalog).length)} SKUs</b>).</p>
         <div class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-900 text-xs space-y-1">
           <div>✓ <b>${fn(modifiedRows.length)} líneas</b> sin embarque fueron actualizadas (descripción, FOB, precios iniciales y fechas).</div>
           <div>🔒 <b>${fn(skippedLocked)} líneas</b> que ya tienen <b>EMBARQUE</b> asignado se mantuvieron intactas sin alterar sus precios.</div>
         </div>
         <p class="text-xs text-slate-500">Cualquier compra inicial o compra extra que cargues a partir de ahora tomará automáticamente la información de esta plantilla.</p>
       </div>`
    );
  } catch(e) {
    busy();
    modal('Error al procesar Plantilla de Presentación', esc(e.message || e));
  }
}
/* ============ PARSER DE EXCEL (COMPRA INICIAL / EXTRA) ============ */
async function parseExcelFile(file, tipoCompra) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  const sheet = wb.SheetNames[0];
  const raw = XLSX.utils.sheet_to_json(wb.Sheets[sheet], { defval: '', raw: true });
  if (!raw.length) throw new Error('El archivo no contiene filas legibles.');
  const fileHeaders = Object.keys(raw[0]);
  const headerMap = {};
  
  MASTER_COLS.forEach(mCol => {
    const nCol = norm(mCol);
    const found = fileHeaders.find(h => norm(h) === nCol);
    if (found) headerMap[mCol] = found;
  });

  if (!headerMap['FOB']) {
    const fobFallback = fileHeaders.find(h => ['fob', 'costofob', 'preciofob', 'fobunitario', 'valorfob'].includes(norm(h)));
    if (fobFallback) headerMap['FOB'] = fobFallback;
  }
  
  if (!headerMap['Código'] || !headerMap['Cantidad']) {
    throw new Error('El archivo debe incluir obligatoriamente las columnas "Código" y "Cantidad".');
  }
  
  const rows = [];
  for (const o of raw) {
    const r = {};
    MASTER_COLS.forEach(col => {
      const val = headerMap[col] ? o[headerMap[col]] : '';
      if (NUM_COLS.includes(col)) {
        r[col] = Number(String(val || 0).replace(',', '.')) || 0;
      } else if (col.includes('Fecha')) {
        r[col] = fdate(val);
      } else {
        r[col] = val == null ? '' : String(val).trim();
      }
    });
    if (tipoCompra) {
      r['Detalle compra'] = tipoCompra;
    } else if (!r['Detalle compra']) {
      r['Detalle compra'] = 'COMPRA CANAL';
    }
    const refUp = String(r['Referencia compra'] || '').trim().toUpperCase();
    const ciUp = String(r['Canal Inicial'] || '').trim().toUpperCase();
    if (refUp === 'PR02' || refUp === 'PRO2' || refUp.includes('PR02') || refUp.includes('PRO2') || ciUp === 'PR02' || ciUp === 'PRO2') {
      r['Canal Inicial'] = 'TIENDAS';
    } else if (!r['Canal Inicial']) {
      r['Canal Inicial'] = resolverCanalInicial(r['Referencia compra'], S.brand);
    }
    if (!r['Canal Final']) r['Canal Final'] = '';
    if (!r['PVP Final']) r['PVP Final'] = 0;
    if (!r['P4 Final']) r['P4 Final'] = 0;
    if (!r['PMY Final']) r['PMY Final'] = 0;
    if (!r['Etapa']) r['Etapa'] = E10;
    if (!r['Temporada']) r['Temporada'] = S.season;
    const tplCatalog = S.templates[sbKey()];
    if (tplCatalog) {
      applyTemplateToRow(r, tplCatalog);
    }
    r['Valor Neto'] = calcValorNeto(r);
    r.sb = sbKey();
    r.brand = S.brand;
    r.season = S.season;
    if (r['Código'] && r['Cantidad'] > 0) rows.push(r);
  }
  return rows;
}

async function revertOcsByKeys(selectedKeys) {
  busy('Revirtiendo OCs y consolidando saldos 10A…');
  await tick();
  const pool10A = new Map();
  S.rows.forEach(r => {
    if (st(r) === 'o') {
      const k = `${norm(r['Código'])}|${norm(r['Color'])}|${normTalla(r['Talla'])}|${norm(r['Referencia compra'])}|${norm(r['Seguimiento'])}|${norm(r['Detalle compra'])}`;
      if (!pool10A.has(k)) pool10A.set(k, r);
    }
  });
  const toUpdate = new Set();
  const toDeleteIds = [];
  let revertedUnits = 0;
  for (const r of S.rows) {
    if (st(r) !== 'p') continue;
    const fact = String(r['Factura'] || '').trim() || 'SIN FACTURA';
    const emb = String(r['EMBARQUE'] || '').trim() || 'SIN EMBARQUE';
    const key = `${fact}|||${emb}`;
    if (!selectedKeys.has(key)) continue;
    const qty = Number(r['Cantidad'] || 0);
    revertedUnits += qty;
    const mergeKey = `${norm(r['Código'])}|${norm(r['Color'])}|${normTalla(r['Talla'])}|${norm(r['Referencia compra'])}|${norm(r['Seguimiento'])}|${norm(r['Detalle compra'])}`;
    const existing10A = pool10A.get(mergeKey);
    if (existing10A && existing10A.id !== r.id) {
      existing10A['Cantidad'] = (Number(existing10A['Cantidad']) || 0) + qty;
      existing10A['Valor Neto'] = calcValorNeto(existing10A);
      toUpdate.add(existing10A);
      if (r.id != null) toDeleteIds.push(r.id);
    } else {
      r['Etapa'] = E10;
      r['Factura'] = '';
      r['Fecha de factura'] = '';
      r['EMBARQUE'] = '';
      r['Fecha de ingreso embarque'] = '';
      r['Canal Final'] = '';
      r['PVP Final'] = 0;
      r['P4 Final'] = 0;
      r['PMY Final'] = 0;
      r['Valor Neto'] = calcValorNeto(r);
      toUpdate.add(r);
      pool10A.set(mergeKey, r);
    }
  }
  const revertedInvoices = new Set(
    [...selectedKeys].map(k => k.split('|||')[0]).filter(inv => inv && inv !== 'SIN FACTURA')
  );
  if (revertedInvoices.size) {
    await removeRevertedInvoicesFromBillingHistory(S.brand, revertedInvoices);
  }
  if (toUpdate.size) await dbPut([...toUpdate]);
  if (toDeleteIds.length) await dbDeleteIds(toDeleteIds);
  await reload();
  busy();
      if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      pushCloudBuySeason(S.brand, S.season, true);
    }
    modal('OCs Revertidas', `Se devolvieron <b>${fn(revertedUnits)} unidades</b> a estado disponible <b>10A</b> y se recalcularon los valores netos.`);
}

const getRowVal = (o, keys) => {
  for (const k of keys) {
    if (o[k] !== undefined && o[k] !== '') return o[k];
  }
  const normKeys = keys.map(k => norm(k));
  for (const origKey of Object.keys(o)) {
    if (normKeys.includes(norm(origKey)) && o[origKey] !== undefined && o[origKey] !== '') {
      return o[origKey];
    }
  }
  return '';
};
function mergePools(...lists) {
  const seen = new Set();
  const res = [];
  for (const lst of lists) {
    if (!lst) continue;
    for (const item of lst) {
      if (!seen.has(item)) {
        seen.add(item);
        res.push(item);
      }
    }
  }
  return res;
}

async function loadSizeMapExcel(file) {
  try {
    busy('Procesando maestro de Tallas SAP…');
    await tick();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', raw: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(sheet, { defval: '', raw: true });
    if (!raw.length) throw new Error('El archivo de tallas está vacío.');

    const incoming = [];
    for (const o of raw) {
      const tm = String(getRowVal(o, ['TALLA MARCA', 'Talla Marca', 'Grid Value']) ?? '').trim();
      const ts = String(getRowVal(o, ['TALLA SAP', 'Talla SAP']) ?? '').trim();
      if (tm && ts) incoming.push([tm, ts]);
    }
    if (!incoming.length) throw new Error('No se encontraron columnas "TALLA MARCA" y "TALLA SAP" válidas.');

    const base = (sizeUploadMode === 'merge' && Array.isArray(S.sizePairs)) ? [...S.sizePairs] : [];
    const seen = new Set(base.map(p => `${String(p[0]).trim().toUpperCase()}|||${String(p[1]).trim().toUpperCase()}`));
    let addedCount = 0;
    for (const [tm, ts] of incoming) {
      const k = `${tm.toUpperCase()}|||${ts.toUpperCase()}`;
      if (!seen.has(k)) {
        seen.add(k);
        base.push([tm, ts]);
        addedCount++;
      }
    }

    S.sizePairs = base;
    refreshBillingHistoryEnrichment('Adidas');
    refreshBillingHistoryEnrichment('Reebok');
    await saveMeta();
    renderMain();
    busy();
    if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      pushCloudConfig();
    }
    modal(
      'Maestro de Tallas SAP Actualizado',
      `Se procesaron <b>${fn(incoming.length)} filas</b> del archivo (${sizeUploadMode === 'merge' ? `<b>${fn(addedCount)} nuevas</b> anexadas` : 'reemplazo total'}).<br>
       Total activo compartido para Adidas y Reebok: <b>${fn(S.sizePairs.length)} equivalencias</b>.`
    );
  } catch (e) {
    busy();
    modal('Error al procesar Tallas SAP', esc(e.message || e));
  }
}

function resolveTallaSapFromGrid(gridVal, explicitSap, lookupMap, poolForSku = [], ctx = {}) {
  const cleanExplicit = sanitizeSapSize(explicitSap);
  const candidates = getTallaSapCandidates(gridVal, cleanExplicit, lookupMap);
  const rawGridStr = String(gridVal ?? '').trim();
  const cleanGridFallback = sanitizeSapSize(rawGridStr);
  if (!candidates.length) return cleanGridFallback;

  const brand = ctx.brand || S.brand;
  const mat = String(ctx.material || '').trim();
  const grupoU = String(ctx.grupo || '').trim().toUpperCase();

  // Prioridad 1: Si existe cruce exacto en el Catálogo MAR SAP / EAN para este Material + candidato de talla
  if (mat && S.sapCatalog) {
    const sapHitCand = candidates.find(cand => Boolean(lookupSapEanFromCatalog(brand, mat, cand)));
    if (sapHitCand) return sanitizeSapSize(sapHitCand);
  }

  // Prioridad 2: Si el SKU existe en la base de Compra (10A o P24), empatar contra la Talla SAP real del SKU
  if (poolForSku && poolForSku.length) {
    const matchBySapCol = candidates.find(cand =>
      poolForSku.some(r => normTalla(r['Talla']) === normTalla(cand))
    );
    if (matchBySapCol) return sanitizeSapSize(matchBySapCol);

    const matchByAnyCol = candidates.find(cand =>
      poolForSku.some(r => normTalla(r['Talla marca']) === normTalla(cand))
    );
    if (matchByAnyCol) return sanitizeSapSize(matchByAnyCol);
  }

  // Prioridad 3: Desempatar por Grupo de producto (CALZADO -> tallas numéricas; ROPA/TEXTIL -> letras)
  if (candidates.length > 1 && grupoU) {
    if (grupoU.includes('CALZADO') || grupoU.includes('FOOTWEAR') || grupoU.includes('ZAPAT')) {
      const numericCand = candidates.find(c => /^\d+(\.\d+)?$/.test(c));
      if (numericCand) return sanitizeSapSize(numericCand);
    } else if (grupoU.includes('ROPA') || grupoU.includes('TEXTIL') || grupoU.includes('APPAREL') || grupoU.includes('PRENDA')) {
      const letterCand = candidates.find(c => /^(2XS|XS|S|M|L|XL|2XL|XXL|3XL|XXXL)$/i.test(c));
      if (letterCand) return sanitizeSapSize(letterCand);
    }
  }

  // Prioridad 4: Si el valor limpio (ej. '6' de '6' o '5' de '#5') está entre los candidatos válidos, preferirlo sobre letras si es numérico
  if (/^\d+(\.\d+)?$/.test(cleanGridFallback)) {
    const exactNumCand = candidates.find(c => normTalla(c) === normTalla(cleanGridFallback));
    if (exactNumCand) return sanitizeSapSize(exactNumCand);
  }

  return sanitizeSapSize(candidates[0] || cleanGridFallback);
}

function getBrandTplCatalogMap(brand = S.brand) {
  const tplBySeason = {};
  const globalTplItems = {};
  const headerIdxByName = {};
  for (const [k, entry] of Object.entries(S.templates || {})) {
    const [bName, sName] = k.split('|');
    if (bName !== brand) continue;
    const items = entry && entry.items ? entry.items : (entry || {});
    tplBySeason[norm(sName)] = items;
    Object.assign(globalTplItems, items);
    if (entry && Array.isArray(entry.headers)) {
      entry.headers.forEach((h, idx) => {
        const nh = norm(h);
        if (nh && headerIdxByName[nh] === undefined) headerIdxByName[nh] = idx;
      });
    }
  }
  return { tplBySeason, globalTplItems, headerIdxByName };
}

function getTplFieldFromEntry(item, fieldKey, headerAliases = [], headerIdxByName = null) {
  if (!item) return '';
  if (item[fieldKey]) return String(item[fieldKey]).trim();
  if (Array.isArray(item.fullRow) && headerAliases.length) {
    if (headerIdxByName) {
      for (const alias of headerAliases) {
        const idx = headerIdxByName[alias];
        if (idx !== undefined && item.fullRow[idx] !== undefined && String(item.fullRow[idx]).trim() !== '') {
          return String(item.fullRow[idx]).trim();
        }
      }
      return '';
    }
    for (const entry of Object.values(S.templates || {})) {
      if (entry && Array.isArray(entry.headers)) {
        const idx = entry.headers.findIndex(h => headerAliases.includes(norm(h)));
        if (idx !== -1 && item.fullRow[idx] !== undefined && String(item.fullRow[idx]).trim() !== '') {
          return String(item.fullRow[idx]).trim();
        }
      }
    }
  }
  return '';
}

function refreshBillingHistoryEnrichment(brand = S.brand) {
  const hist = getBrandBillingHistory(brand);
  if (!hist.length) return 0;
  const isRbk = String(brand).toUpperCase().includes('REEBOK');
  const sizeLookup = buildTallaSapLookup();
  const { tplBySeason, globalTplItems, headerIdxByName } = getBrandTplCatalogMap(brand);

  // Pre-indexar S.rows por código en O(N) para evitar búsquedas O(N^2)
  const skuRowsMap = new Map();
  if (S.brand === brand && Array.isArray(S.rows)) {
    for (const x of S.rows) {
      const c = norm(x['Código']);
      if (!c) continue;
      let arr = skuRowsMap.get(c);
      if (!arr) { arr = []; skuRowsMap.set(c, arr); }
      arr.push(x);
    }
  }

  let updatedCount = 0;

  for (const batch of hist) {
    if (!Array.isArray(batch.rows) || !Array.isArray(batch.headers)) continue;
    const oldIdHdr = isRbk ? 'ID (NEW MATERIAL + "ESPACIO EN BLANCO" + TALLA SAP' : 'ID (material + "espacio en blanco" + talla sap")';
    const idColIdx = batch.headers.findIndex(h => h === oldIdHdr || norm(h).startsWith('idnewmaterial') || norm(h).startsWith('idmaterial'));
    if (idColIdx !== -1) batch.headers[idColIdx] = 'ID SAP';

    const codIdx = isRbk ? 9 : 8;
    const gridIdx = 10;
    const talSapIdx = isRbk ? 20 : 16;
    const idSapIdx = isRbk ? 21 : 17;
    const marSapIdx = isRbk ? 22 : 18;
    const eanSapIdx = isRbk ? 23 : 19;
    const actIdx = isRbk ? 24 : 20;
    const grpIdx = isRbk ? 25 : 21;
    const catIdx = isRbk ? 27 : 23;
    const genIdx = isRbk ? 28 : 24;
    const tempIdx = isRbk ? 29 : 25;
    const linIdx = isRbk ? 30 : 26;

    for (const r of batch.rows) {
      if (!Array.isArray(r.cells)) continue;
      let dirty = false;
      const mat = String(r.cells[codIdx] || '').trim();
      const codNorm = norm(mat);
      const gridVal = String(r.cells[gridIdx] || '').trim();

      const seasonDet = String(r.cells[tempIdx] || '').trim();
      const seasonTpl = tplBySeason[norm(seasonDet)] || globalTplItems;
      const tplItem = seasonTpl ? seasonTpl[codNorm] : null;
      const rowGrupo = (tplItem && tplItem.grupo) ? tplItem.grupo : String(r.cells[grpIdx] || '').trim();
      const skuRowsInMem = skuRowsMap.get(codNorm) || [];

      // 1. Recalcular TALLA SAP desde maestro de tallas, Catálogo SAP, base de compra y Grupo
      const newTalSap = resolveTallaSapFromGrid(gridVal, '', sizeLookup, skuRowsInMem, {
        brand,
        material: mat,
        grupo: rowGrupo
      });
      if (newTalSap && r.cells[talSapIdx] !== newTalSap) {
        r.cells[talSapIdx] = newTalSap;
        dirty = true;
      }
      const effectiveTalSap = String(r.cells[talSapIdx] || gridVal).trim();

      // 2. Actualizar ID SAP = Material + " " + TALLA SAP
      const newIdSap = `${mat} ${effectiveTalSap}`.trim();
      if (idSapIdx !== -1 && r.cells[idSapIdx] !== newIdSap) {
        r.cells[idSapIdx] = newIdSap;
        dirty = true;
      }

      // 3. Actualizar CATEGORÍA (desde TIPO_VENTA de la Plantilla) y demás atributos
      if (tplItem) {
        const tipoVenta = getTplFieldFromEntry(tplItem, 'categoria', ['tipoventa', 'categoria'], headerIdxByName);
        if (tipoVenta && r.cells[catIdx] !== tipoVenta) { r.cells[catIdx] = tipoVenta; dirty = true; }
        if (tplItem.actividad && r.cells[actIdx] !== tplItem.actividad) { r.cells[actIdx] = tplItem.actividad; dirty = true; }
        if (tplItem.grupo && r.cells[grpIdx] !== tplItem.grupo) { r.cells[grpIdx] = tplItem.grupo; dirty = true; }
        if (tplItem.genero && r.cells[genIdx] !== tplItem.genero) { r.cells[genIdx] = tplItem.genero; dirty = true; }
        if (tplItem.linea && r.cells[linIdx] !== tplItem.linea) { r.cells[linIdx] = tplItem.linea; dirty = true; }
      }

      // 4. Actualizar MAR SAP NUEVO y EAN SAP con la Talla SAP ya corregida
      const sapHit = lookupSapEanFromCatalog(brand, mat, effectiveTalSap);
      if (sapHit) {
        if (sapHit.marSap && r.cells[marSapIdx] !== sapHit.marSap) { r.cells[marSapIdx] = sapHit.marSap; dirty = true; }
        if (sapHit.eanSap && r.cells[eanSapIdx] !== sapHit.eanSap) { r.cells[eanSapIdx] = sapHit.eanSap; dirty = true; }
      }

      if (dirty) updatedCount++;
    }
  }
  return updatedCount;
}

/* ============ GESTIÓN DE CATÁLOGO MAR SAP NUEVO Y EAN SAP (POR MATERIAL + TALLA SAP) ============ */
function buildSapCatalogKey(brand, codIntl, tallaSap) {
  const b = String(brand || S.brand).trim();
  const c = String(codIntl || '').trim().toUpperCase();
  const t = normTalla(sanitizeSapSize(tallaSap)).toUpperCase();
  return `${b}|${c}|${t}`;
}

function lookupSapEanFromCatalog(brand, codIntl, tallaSap) {
  if (!S.sapCatalog) return null;
  const k1 = buildSapCatalogKey(brand, codIntl, tallaSap);
  if (S.sapCatalog[k1]) return S.sapCatalog[k1];
  const cleanRaw = sanitizeSapSize(tallaSap).toUpperCase();
  const k2 = `${String(brand || S.brand).trim()}|${String(codIntl || '').trim().toUpperCase()}|${cleanRaw}`;
  return S.sapCatalog[k2] || null;
}

function applySapCatalogToBillingHist(brand) {
  const hist = getBrandBillingHistory(brand);
  const isRbk = String(brand).toUpperCase().includes('REEBOK');
  const codIdx = isRbk ? 9 : 8;
  const talSapIdx = isRbk ? 20 : 16;
  const marSapIdx = isRbk ? 22 : 18;
  const eanSapIdx = isRbk ? 23 : 19;
  let updatedLines = 0;

  for (const batch of hist) {
    if (!Array.isArray(batch.rows)) continue;
    for (const r of batch.rows) {
      if (!Array.isArray(r.cells)) continue;
      const mat = r.cells[codIdx];
      const tal = r.cells[talSapIdx];
      const hit = lookupSapEanFromCatalog(brand, mat, tal);
      if (hit) {
        let changed = false;
        if (hit.marSap && r.cells[marSapIdx] !== hit.marSap) {
          r.cells[marSapIdx] = hit.marSap;
          changed = true;
        }
        if (hit.eanSap && r.cells[eanSapIdx] !== hit.eanSap) {
          r.cells[eanSapIdx] = hit.eanSap;
          changed = true;
        }
        if (changed) updatedLines++;
      }
    }
  }
  return updatedLines;
}

function exportMissingSapCodesExcel() {
  const allBillRows = getAllBrandBillingRows(S.brand);
  const isRbk = String(S.brand).toUpperCase().includes('REEBOK');
  const codIdx = isRbk ? 9 : 8;
  const talSapIdx = isRbk ? 20 : 16;
  const marSapIdx = isRbk ? 22 : 18;
  const descIdx = isRbk ? 25 : 21;

  const missingRows = allBillRows.filter(r => !String((r.cells && r.cells[marSapIdx]) || '').trim());
  const source = missingRows.length ? missingRows : allBillRows;
  if (!source.length) return modal('Sin datos', 'No hay registros en el Detalle de Facturación.');

  const uniqueIntls = [...new Set(source.map(r => String(r.cells[codIdx] || '').trim()).filter(Boolean))].sort();
  const detailMap = new Map();
  source.forEach(r => {
    const cod = String(r.cells[codIdx] || '').trim();
    const tal = String(r.cells[talSapIdx] || '').trim();
    const key = `${cod}|${tal}`;
    if (cod && !detailMap.has(key)) {
      detailMap.set(key, [cod, tal, `${cod} ${tal}`.trim(), r.cells[descIdx] || '', '', '']);
    }
  });

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['CODIGO_INTERNACIONAL (Copiar a SAP)'],
    ...uniqueIntls.map(c => [c])
  ]), 'Codigos_Unicos_SAP');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([
    ['CODIGO_INTERNACIONAL', 'TALLA_SAP', 'ID_CONCATENADO', 'GRUPO', 'MAR_SAP_NUEVO', 'EAN_SAP'],
    ...[...detailMap.values()]
  ]), 'Plantilla_Carga_SAP');
  XLSX.writeFile(wb, `CODIGOS_PENDIENTES_SAP_${S.brand}_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

async function loadSapCatalogExcel(file) {
  try {
    busy(`Leyendo catálogo SAP / EAN para ${S.brand}…`);
    await tick();
    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', raw: true });
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true });
    if (!aoa.length) throw new Error('El archivo de SAP está vacío.');

    // Detectar dinámicamente la fila de encabezados real (por si el reporte SAP trae filas de título arriba)
    let headerRowIdx = 0;
    for (let i = 0; i < Math.min(15, aoa.length); i++) {
      const rNorm = aoa[i].map(c => norm(c));
      if (rNorm.includes('model') || rNorm.includes('articulo') || rNorm.includes('codigointernacional') || rNorm.includes('tam1')) {
        headerRowIdx = i;
        break;
      }
    }
    const raw = XLSX.utils.sheet_to_json(sheet, { range: headerRowIdx, defval: '', raw: true });
    if (!raw.length) throw new Error('El archivo de SAP no contiene filas de datos.');

    if (!S.sapCatalog) S.sapCatalog = {};
    let parsedCount = 0;

    for (const o of raw) {
      let codIntl = String(getRowVal(o, [
        'Model', 'MODEL', 'CODIGO_INTERNACIONAL', 'Codigo Internacional', 'Código Internacional',
        'Antiguo número de material', 'NEW Material', 'Material Marca', 'Referencia', 'COD_INT', 'MATERIAL_MARCA'
      ]) ?? '').trim();
      let tallaSap = String(getRowVal(o, [
        'Tam.1', 'Tam. 1', 'Tam 1', 'TAM.1', 'TAM1', 'TALLA_SAP', 'Talla SAP', 'Talla',
        'Valor matriz', 'Grid Value', 'Tamaño', 'Dimension'
      ]) ?? '').trim();
      const idCombo = String(getRowVal(o, [
        'ID', 'ID_CONCATENADO', 'ID SAP', 'ID (material + "espacio en blanco" + talla sap")'
      ]) ?? '').trim();

      if ((!codIntl || !tallaSap) && idCombo && idCombo.includes(' ')) {
        const parts = idCombo.split(/\s+/);
        if (parts.length >= 2) {
          if (!codIntl) codIntl = parts[0].trim();
          if (!tallaSap) tallaSap = parts.slice(1).join(' ').trim();
        }
      }

      const marSap = String(getRowVal(o, [
        'Articulo', 'Artículo', 'ARTICULO', 'ARTÍCULO', 'MAR_SAP_NUEVO', 'MAR SAP NUEVO', 'MAR SAP',
        'Material SAP', 'Material', 'Codigo SAP', 'Código SAP', 'SAP'
      ]) ?? '').trim();
      const eanSap = String(getRowVal(o, [
        'Código EAN/UPC', 'Codigo EAN/UPC', 'CODIGO EAN/UPC', 'CÓDIGO EAN/UPC',
        'EAN_SAP', 'EAN SAP', 'EAN', 'EAN/UPC', 'Código de barras', 'GTIN', 'UPC'
      ]) ?? '').trim();

      if (!codIntl || !tallaSap || (!marSap && !eanSap)) continue;

      const key = buildSapCatalogKey(S.brand, codIntl, tallaSap);
      const prev = S.sapCatalog[key] || {};
      S.sapCatalog[key] = {
        codIntl: codIntl.toUpperCase(),
        tallaSap: normTalla(tallaSap),
        marSap: marSap || prev.marSap || '',
        eanSap: eanSap || prev.eanSap || ''
      };
      parsedCount++;
    }

    if (!parsedCount) {
      throw new Error('No se encontraron filas válidas con las columnas Model, Articulo, Código EAN/UPC y Tam.1.');
    }

    const updatedBillLines = applySapCatalogToBillingHist(S.brand);
    await saveMeta();
    if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      pushCloudConfig().catch(() => {});
    }
    render();
    busy();

    modal(
      'Catálogo MAR SAP y EAN Actualizado',
      `<div class="space-y-2 text-slate-700">
         <p>Se procesaron <b>${fn(parsedCount)} combinaciones SKU + Talla</b> en el catálogo de <b>${esc(S.brand)}</b>.</p>
         <div class="p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-emerald-950 text-xs">
           ✓ Se actualizaron automáticamente <b>${fn(updatedBillLines)} líneas</b> en tu pestaña <b>Detalle Facturación</b> con su <b>MAR SAP NUEVO</b> y <b>EAN SAP</b>.
         </div>
       </div>`
    );
  } catch (e) {
    busy();
    modal('Error al procesar Catálogo SAP', esc(e.message || e));
  }
}

/* ============ PARSER DE PTS COMEX Y CRUCE DE FACTURACIÓN (ADIDAS Y REEBOK) ============ */
function normalizePtId(val) {
  if (val === null || val === undefined) return '';
  let s = String(val).trim();
  if (!s) return '';
  if (/^\d+\.0+$/.test(s)) s = s.replace(/\.0+$/, '');
  return s.toUpperCase();
}

function extractEmbNameFromFileName(fileName) {
  const base = String(fileName || '').replace(/\.[^.]+$/, '').toUpperCase();
  const mPanama = base.match(/PANAMA\s*\d+/i);
  if (mPanama) return mPanama[0].toUpperCase().replace(/\s+/, ' ');
  const mEmb = base.match(/(?:EMB|EMBARQUE)[\s._-]*([A-Z0-9\s-]+)/i);
  if (mEmb && mEmb[1]) return mEmb[1].trim();
  return '';
}

async function parsePtsExcelMap(file) {
  const fallbackEmbFromName = extractEmbNameFromFileName(file && file.name);
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', raw: true });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const aoa = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '', raw: true });
  const ptsMap = new Map();
  if (!aoa.length) return ptsMap;

  let startRow = 0;
  let ptCol = 0;
  let embCol = -1;
  const r0 = aoa[0].map(c => norm(c));
  const foundPtCol = r0.findIndex(h => h.startsWith('pts') || h.includes('delivery') || h.includes('salesorder') || h === 'pt' || h === 'entrega');
  const foundEmbCol = r0.findIndex(h => h.includes('embarque') || h.includes('shipment'));
  if (foundPtCol !== -1 || foundEmbCol !== -1 || isNaN(Number(String(aoa[0][0] || '').trim()))) {
    startRow = 1;
    if (foundPtCol !== -1) ptCol = foundPtCol;
    if (foundEmbCol !== -1) embCol = foundEmbCol;
  }

  for (let i = startRow; i < aoa.length; i++) {
    const row = aoa[i];
    if (!row || !row.length) continue;
    const pt = normalizePtId(row[ptCol]);
    const rawEmb = embCol !== -1 ? String(row[embCol] ?? '').trim() : '';
    const emb = rawEmb || fallbackEmbFromName || 'FORWARDER';
    if (pt && /^\d{5,}$/.test(pt)) {
      ptsMap.set(pt, emb);
    }
  }
  return ptsMap;
}

async function assignPtsToForwarder(ptsFile) {
  try {
    busy(`Leyendo listado de PTs de COMEX y buscando líneas FORWARDER en ${S.brand}…`);
    await tick();
    const ptsMap = await parsePtsExcelMap(ptsFile);
    if (!ptsMap.size) {
      throw new Error('No se encontraron números de PT válidos en el archivo de COMEX.');
    }
    const detectedEmbs = [...new Set(ptsMap.values())];
    const defaultEmbName = detectedEmbs[0] || '';

    const allBrandRows = await getAllBrandRows(S.brand);
    const matchingRows = allBrandRows.filter(r => {
      if (st(r) !== 'p') return false;
      const ptVal = normalizePtId(r['Delivery']);
      if (!ptVal || !ptsMap.has(ptVal)) return false;
      const curEmb = String(r['EMBARQUE'] || '').trim().toUpperCase();
      return !curEmb || curEmb === 'FORWARDER';
    });

    busy();
    if (!matchingRows.length) {
      return modal(
        'Sin líneas FORWARDER coincidentes',
        `Se leyeron <b>${fn(ptsMap.size)} PTs</b> (Embarque: <b>${esc(detectedEmbs.join(', '))}</b>), pero no se encontraron registros en estado <b>FORWARDER</b> en ${S.brand} con esos números de PT / Sales Order.`
      );
    }

    const totalUnits = matchingRows.reduce((a, r) => a + Number(r['Cantidad'] || 0), 0);
    const matchedPtsCount = new Set(matchingRows.map(r => normalizePtId(r['Delivery']))).size;

    const ch = await modal(
      `Asignar Embarque a FORWARDER · ${S.brand}`,
      `<div class="space-y-3 text-slate-700">
         <p>Se encontraron <b>${fn(matchingRows.length)} líneas</b> (<b>${fn(totalUnits)} unidades</b>) en <b>FORWARDER</b> correspondientes a <b>${fn(matchedPtsCount)} PTs</b> del archivo de COMEX.</p>
         <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
           <div>
             <label class="block text-xs font-semibold text-slate-700 mb-1">Nombre del Embarque</label>
             <input type="text" id="inpPtsOnlyEmb" class="border rounded px-2.5 py-1.5 text-sm w-full bg-white font-semibold" value="${esc(defaultEmbName)}">
           </div>
           <div>
             <label class="block text-xs font-semibold text-slate-700 mb-1">Fecha de ingreso embarque</label>
             <input type="date" id="inpPtsOnlyFecha" class="border rounded px-2.5 py-1.5 text-sm w-full bg-white">
           </div>
         </div>
       </div>`,
      [['Cancelar', 'c'], ['Asignar Embarque', 'ok', 1]]
    );
    if (ch !== 'ok') return;

    const finalEmbOverride = $('inpPtsOnlyEmb') ? $('inpPtsOnlyEmb').value.trim() : '';
    const finalFecha = $('inpPtsOnlyFecha') ? $('inpPtsOnlyFecha').value.trim() : '';
    const affectedSeasons = new Set();

    matchingRows.forEach(r => {
      const ptVal = normalizePtId(r['Delivery']);
      r['EMBARQUE'] = finalEmbOverride || ptsMap.get(ptVal) || r['EMBARQUE'];
      if (finalFecha) r['Fecha de ingreso embarque'] = finalFecha;
      affectedSeasons.add(r.season || S.season);
    });

    if (S.lastBillingPreview && S.lastBillingPreview.brand === S.brand) {
      S.lastBillingPreview.rows.forEach(pr => {
        const ptVal = normalizePtId(pr.ptKey);
        if (ptVal && ptsMap.has(ptVal)) {
          pr.embarque = finalEmbOverride || ptsMap.get(ptVal);
          pr.isForwarder = false;
          if (typeof S.lastBillingPreview.embIdx === 'number' && Array.isArray(pr.cells)) {
            pr.cells[S.lastBillingPreview.embIdx] = pr.embarque;
          }
        }
      });
    }
    await syncBillingHistoryPts(S.brand, ptsMap, finalEmbOverride, finalFecha);

    busy('Actualizando embarque en base local…');
    await tick();
    await dbPut(matchingRows);
    await reload();
    busy();

    if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      for (const sName of affectedSeasons) {
        await pushCloudBuySeason(S.brand, sName, true);
      }
    }

    modal('Embarque Asignado', `Se actualizaron <b>${fn(totalUnits)} unidades</b> de <b>FORWARDER</b> al embarque <b>${esc(finalEmbOverride || defaultEmbName)}</b>.`);
  } catch (e) {
    busy();
    modal('Error al asignar PTs', esc(e.message || e));
  }
}

/* ============ VISTA PREVIA COMPLETA (ESTILO PLANTILLA PRESENTACIÓN) PARA FACTURACIÓN ============ */

function getBrandBillingHistory(brand = S.brand) {
  if (!S.billingHistory) S.billingHistory = { Adidas: [], Reebok: [] };
  if (!Array.isArray(S.billingHistory[brand])) S.billingHistory[brand] = [];
  return S.billingHistory[brand];
}

function getAllBrandBillingRows(brand = S.brand) {
  const hist = getBrandBillingHistory(brand);
  const out = [];
  for (const batch of hist) {
    if (!batch || !Array.isArray(batch.rows)) continue;
    for (const r of batch.rows) {
      out.push({
        ...r,
        batchId: batch.id,
        batchDate: batch.uploadedAt,
        batchFile: batch.fileName || '',
        headers: batch.headers
      });
    }
  }
  return out;
}

async function saveBillingSnapshotToHistory(previewObj, fileName = '') {
  if (!previewObj || !Array.isArray(previewObj.rows) || !previewObj.rows.length) return;
  const brand = previewObj.brand || S.brand;
  const hist = getBrandBillingHistory(brand);
  const batchInvoices = new Set(
    previewObj.rows.map(r => String(r.cells[previewObj.factIdx] || '').trim()).filter(Boolean)
  );
  // Evitar duplicar exactamente las mismas facturas si se vuelve a procesar el mismo archivo
  if (batchInvoices.size > 0) {
    for (let i = hist.length - 1; i >= 0; i--) {
      const b = hist[i];
      const bInvs = (b.invoices || []);
      if (bInvs.length && bInvs.length === batchInvoices.size && bInvs.every(inv => batchInvoices.has(inv))) {
        hist.splice(i, 1);
      }
    }
  }
  const batch = {
    id: 'BILL_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
    brand,
    uploadedAt: new Date().toLocaleString('es-EC', { dateStyle: 'short', timeStyle: 'short' }),
    fileName,
    invoices: [...batchInvoices],
    headers: previewObj.headers,
    codIdx: previewObj.codIdx,
    embIdx: previewObj.embIdx,
    factIdx: previewObj.factIdx,
    ptIdx: previewObj.ptIdx,
    rows: previewObj.rows.map(r => ({
      isForwarder: Boolean(r.isForwarder),
      embarque: r.embarque,
      ptKey: r.ptKey,
      cells: [...r.cells]
    }))
  };
  hist.unshift(batch);
  S.lastBillingPreview = previewObj;
  await saveMeta();
  if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
    pushCloudConfig().catch(() => {});
  }
}

async function syncBillingHistoryPts(brand, ptsMap, finalEmbOverride, finalFecha = '') {
  const hist = getBrandBillingHistory(brand);
  let updated = false;
  for (const batch of hist) {
    if (!Array.isArray(batch.rows)) continue;
    for (const r of batch.rows) {
      const ptVal = normalizePtId(r.ptKey);
      if (ptVal && ptsMap.has(ptVal)) {
        const newEmb = finalEmbOverride || ptsMap.get(ptVal);
        r.embarque = newEmb;
        r.isForwarder = false;
        if (typeof batch.embIdx === 'number' && Array.isArray(r.cells)) {
          r.cells[batch.embIdx] = newEmb;
        }
        updated = true;
      }
    }
  }
  if (updated) {
    await saveMeta();
    if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      pushCloudConfig().catch(() => {});
    }
  }
}

function purgeReebokDropAlertsByInvoices(revertedInvoicesSet) {
  if (!revertedInvoicesSet || !revertedInvoicesSet.size || !Array.isArray(S.reebokDropAlerts)) return false;
  const normInvs = new Set([...revertedInvoicesSet].map(x => norm(x)).filter(Boolean));
  if (!normInvs.size) return false;
  const beforeLen = S.reebokDropAlerts.length;
  S.reebokDropAlerts = S.reebokDropAlerts.filter(a => {
    const invs = String(a.invoices || '').split(/[,;/|]+/).map(x => norm(x)).filter(Boolean);
    if (!invs.length) return true;
    return !invs.some(inv => normInvs.has(inv));
  });
  return S.reebokDropAlerts.length !== beforeLen;
}

async function removeRevertedInvoicesFromBillingHistory(brand, revertedInvoicesSet) {
  if (!revertedInvoicesSet || !revertedInvoicesSet.size) return;
  const hist = getBrandBillingHistory(brand);
  let changed = false;
  for (let i = hist.length - 1; i >= 0; i--) {
    const batch = hist[i];
    if (!Array.isArray(batch.rows)) continue;
    const beforeLen = batch.rows.length;
    batch.rows = batch.rows.filter(r => {
      const inv = String((r.cells && r.cells[batch.factIdx]) || '').trim();
      return !inv || !revertedInvoicesSet.has(inv);
    });
    if (batch.rows.length !== beforeLen) {
      changed = true;
      batch.invoices = [...new Set(batch.rows.map(r => String((r.cells && r.cells[batch.factIdx]) || '').trim()).filter(Boolean))];
      if (!batch.rows.length) hist.splice(i, 1);
    }
  }
  const dropsPurged = String(brand).toUpperCase().includes('REEBOK')
    ? purgeReebokDropAlertsByInvoices(revertedInvoicesSet)
    : false;
  if (changed || dropsPurged) {
    await saveMeta();
    if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
      pushCloudConfig().catch(() => {});
    }
  }
}

function normalizeStoreChannelForLpn(rawRef, brand = 'Adidas') {
  const s = String(rawRef || '').trim().toUpperCase();
  if (!s) return '';

  if (resolved === 'TIENDAS') return 'TIENDAS';
