/* ============ 5. EXPORTAR / IMPORTAR RESPALDO JSON COMPARTIBLE ============ */
function exportJsonBackup() {
  if (!S.rows.length) return modal('Sin datos', 'No hay datos en esta temporada para exportar.');
  busy('Generando archivo JSON…');
  setTimeout(() => {
    const payload = {
      app: 'EOT_MEDEPORT',
      version: '5.2',
      brand: S.brand,
      season: S.season,
      exportedAt: new Date().toISOString(),
      rowCount: S.rows.length,
      rows: S.rows.map(r => {
        const o = { ...r };
        delete o.id;
        return o;
      })
    };
    const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Tracking_Compra_Medeport_${S.brand}_${S.season}_${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    busy();
  }, 50);
}
async function importJsonBackup(file) {
  try {
    busy('Leyendo archivo JSON…');
    await tick();
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.rows || !Array.isArray(data.rows)) {
      throw new Error('El archivo JSON no tiene el formato de respaldo válido del sistema.');
    }
    const b = data.brand || S.brand;
    const s = data.season || S.season;
    const count = data.rows.length;
    busy();
    const c = await modal(
      'Importar respaldo JSON',
      `El archivo contiene <b>${fn(count)} filas</b> correspondientes a <b>${b} ${s}</b>.<br><br>
      ¿Deseas cargar estos datos en tu navegador? Se reemplazarán los registros actuales de esa temporada.`,
      [['Cancelar', 'c'], ['Sí, importar datos', 'ok', 1]]
    );
    if (c !== 'ok') return;
    if (!S.seasons[b]) S.seasons[b] = [];
    if (!S.seasons[b].includes(s)) S.seasons[b].push(s);
    S.brand = b;
    S.season = s;
    const targetKey = b + '|' + s;
    await saveMeta();
    busy('Guardando datos en la base local…');
    await tick();
    await dbDelSeason(targetKey);
    
    const cleanRows = data.rows.map(r => {
      const row = { ...r, sb: targetKey, brand: b, season: s };
      if (row['FOB'] === undefined) row['FOB'] = 0;
      row['Valor Neto'] = calcValorNeto(row);
      if (!row['Detalle compra'] || !String(row['Detalle compra']).trim()) row['Detalle compra'] = 'COMPRA CANAL';
      return row;
    });
    await dbAdd(cleanRows, 'Importando');
    await reload();
    busy();
    modal('Respaldo Importado', `Se cargaron con éxito ${fn(count)} filas en <b>${b} ${s}</b>.`);
  } catch(e) {
    busy();
    modal('Error al importar JSON', esc(e.message || e));
  }
}
/* ============ 6. EXPORTACIONES EXCEL (COMPLETO 37 COLS + DISPONIBLES 10A LIMPIO) ============ */
function exportExcelWithCols(rowsToExport, cols, sheetName, fileName) {
  busy('Generando archivo Excel…');
  setTimeout(() => {
    const aoa = [cols];
    rowsToExport.forEach(r => {
      aoa.push(cols.map(c => r[c] ?? ''));
    });
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), sheetName);
    XLSX.writeFile(wb, fileName);
    busy();
  }, 50);
}

function exportPriceChanges() {
  const changed = S.rows.filter(hasPriceChange);
  if (!changed.length) return modal('Sin cambios de precio', 'No existen líneas con diferencia entre PVP Inicial y PVP Final.');
  const aoa = [
    ['Detalle compra', 'Código', 'Descripción', 'Color', 'Talla', 'Canal Inicial', 'Canal Final', 'EMBARQUE', 'Factura', 'Cantidad', 'PVP Inicial', 'PVP Final', 'Variación ($)', 'Acción'],
    ...changed.map(r => {
      const ini = Number(r['PVP'] || 0);
      const fin = Number(r['PVP Final'] || 0);
      const diff = Math.round((fin - ini) * 100) / 100;
      return [

function exportSkuTraceExcel(skuCode, allSkuRows, sizeMatrix, eventsList) {

  const summaryAoa = [
    [`TRAZABILIDAD COMPLETA DEL SKU: ${skuCode} · ${S.brand.toUpperCase()}`],
    [],
    ['Talla SAP', 'Talla Marca', 'Comprado Total', 'Pendiente 10A', 'En Forwarder', 'En DEPCO', 'Nacionalizado P24', 'DROP', 'Canales Iniciales', 'Canales Finales'],
    ...sizeMatrix.map(sz => [
      sz.tallaSap, sz.tallaMarca, sz.bought, sz.s10a, sz.fw, sz.depco, sz.p24, sz.drop,
      [...sz.canalesIni].join(', '), [...sz.canalesFin].join(', ')

    ['Temporada', 'Detalle Compra', 'Régimen', 'Etapa', 'Factura', 'Fecha Factura', 'PT / Delivery', 'Embarque', 'F. Ingreso Emb.', 'LPN ID', 'Talla SAP', 'Cantidad', 'FOB', 'Valor Neto', 'Canal Inicial', 'Canal Final', 'PVP Inicial', 'PVP Final', 'OBS'],
    ...eventsList.map(ev => [

async function vSkuTrace() {
  const view = $('view');
  view.innerHTML = `<div class="p-8 text-center text-sm text-slate-500">Construyendo mapa de trazabilidad por SKU…</div>`;
  await tick();

  const sourceRows = S.skuTrace.scope === 'brand'
    ? await getAllBrandRows(S.brand)
    : S.rows;

  // Catálogo rápido de SKUs únicos disponibles en el alcance actual
  const skuCatalogMap = new Map();
  for (const r of sourceRows) {
    const cod = String(r['Código'] || '').trim().toUpperCase();
    if (!cod) continue;
    if (!skuCatalogMap.has(cod)) {
      skuCatalogMap.set(cod, {
        cod,
        desc: r['Descripción'] || '',
        grupo: r['Grupo'] || '',
        cat: r['Categoría'] || '',
        linea: r['Línea'] || '',
        act: r['Actividad'] || '',
        gen: r['Género'] || '',
        color: r['Color'] || '',
        totalUnits: 0
      });
    }
    const info = skuCatalogMap.get(cod);
    if (!info.desc && r['Descripción']) info.desc = r['Descripción'];
    if (!info.color && r['Color']) info.color = r['Color'];
    info.totalUnits += Number(r['Cantidad'] || 0);
  }

  const allSkusSorted = [...skuCatalogMap.values()].sort((a, b) => a.cod.localeCompare(b.cod));
  if (!allSkusSorted.length) {
    view.innerHTML = `<div class="bg-white border rounded-xl p-10 text-center max-w-lg mx-auto mt-6">
      <h3 class="text-base font-bold text-slate-900">Sin SKUs cargados en ${esc(S.brand)} ${esc(S.season)}</h3>
      <p class="text-xs text-slate-500 mt-1">Carga una compra inicial para visualizar el ciclo de vida de cada código.</p>
    </div>`;
    return;
  }

  // Resolver SKU activo
  let activeSku = String(S.skuTrace.selectedSku || '').trim().toUpperCase();
  if (!activeSku || !skuCatalogMap.has(activeSku)) {
    const qNorm = String(S.skuTrace.q || '').trim().toUpperCase();
    const hit = qNorm ? allSkusSorted.find(x => x.cod.includes(qNorm) || x.desc.toUpperCase().includes(qNorm)) : null;
    activeSku = hit ? hit.cod : allSkusSorted[0].cod;
    S.skuTrace.selectedSku = activeSku;
  }

  const skuInfo = skuCatalogMap.get(activeSku);
  const skuRows = sourceRows.filter(r => String(r['Código'] || '').trim().toUpperCase() === activeSku);

  // Enriquecer con plantilla si falta algún dato descriptivo
  const { tplBySeason, globalTplItems } = getBrandTplCatalogMap(S.brand);
  const tplEntry = (tplBySeason[norm(S.season)] || globalTplItems)[norm(activeSku)];

  // Acumuladores del embudo del SKU
  let uTotalBought = 0, fobTotalBought = 0;
  let uCompraCanal = 0, uCompraExtra = 0;
  let u10A = 0, fob10A = 0;
  let uForwarder = 0, fobForwarder = 0;
  let uDepco = 0, fobDepco = 0;
  let uP24Nacionalizado = 0, fobP24Nacionalizado = 0;
  let uDrop = 0, fobDrop = 0;

  const canalIniMap = new Map();
  const canalFinMap = new Map();
  const embarquesMap = new Map();
  const sizeMap = new Map();
  const eventsList = [];

  for (const r of skuRows) {
    const qty = Number(r['Cantidad'] || 0);
    const fob = Number(r['FOB'] || 0);
    const vn = Number(r['Valor Neto'] || calcValorNeto(r));
    const stage = st(r);
    const emb = String(r['EMBARQUE'] || '').trim();
    const isFw = stage === 'p' && emb.toUpperCase() === 'FORWARDER';
    const det = String(r['Detalle compra'] || 'COMPRA CANAL').toUpperCase();
    const cIni = String(r['Canal Inicial'] || resolverCanalInicial(r['Referencia compra'], S.brand) || 'SIN CANAL').trim();
    const cFin = String(r['Canal Final'] || '').trim();
    const talSap = String(r['Talla'] || '').trim() || '-';
    const talMarca = String(r['Talla marca'] || '').trim() || '-';

    uTotalBought += qty;
    fobTotalBought += vn;
    if (det === 'COMPRA EXTRA') uCompraExtra += qty;
    else uCompraCanal += qty;

    canalIniMap.set(cIni, (canalIniMap.get(cIni) || 0) + qty);

    if (stage === 'o') {
      u10A += qty;
      fob10A += vn;
    } else if (stage === 'dep') {
      uDepco += qty;
      fobDepco += vn;
      canalFinMap.set('DEPCO (En Depósito)', (canalFinMap.get('DEPCO (En Depósito)') || 0) + qty);
    } else if (stage === 'd') {
      uDrop += qty;
      fobDrop += vn;
    } else if (isFw) {
      uForwarder += qty;
      fobForwarder += vn;
    } else if (stage === 'p') {
      uP24Nacionalizado += qty;
      fobP24Nacionalizado += vn;
      const destLabel = cFin || `${cIni} (Pend. Canal Final)`;
      canalFinMap.set(destLabel, (canalFinMap.get(destLabel) || 0) + qty);
    }

    if (emb) {
      if (!embarquesMap.has(emb)) {
        embarquesMap.set(emb, {
          emb,
          stage,
          isFw,
          regimen: r['Régimen'] || 'CONSUMO',
          units: 0,
          fob: 0,
          facturas: new Set(),
          fechaIng: r['Fecha de ingreso embarque'] || ''
        });
      }
      const eObj = embarquesMap.get(emb);
      eObj.units += qty;
      eObj.fob += vn;
      if (r['Factura']) eObj.facturas.add(String(r['Factura']).trim());
      if (!eObj.fechaIng && r['Fecha de ingreso embarque']) eObj.fechaIng = r['Fecha de ingreso embarque'];
    }

    // Matriz por talla
    if (!sizeMap.has(talSap)) {
      sizeMap.set(talSap, {
        tallaSap: talSap,
        tallaMarca: talMarca,
        bought: 0,
        s10a: 0,
        fw: 0,
        depco: 0,
        p24: 0,
        drop: 0,
        canalesIni: new Set(),
        canalesFin: new Set()
      });
    }
    const sz = sizeMap.get(talSap);
    sz.bought += qty;
    sz.canalesIni.add(cIni);
    if (cFin) sz.canalesFin.add(cFin);
    if (stage === 'o') sz.s10a += qty;
    else if (stage === 'dep') sz.depco += qty;
    else if (stage === 'd') sz.drop += qty;
    else if (isFw) sz.fw += qty;
    else sz.p24 += qty;

    // Línea de tiempo / eventos del SKU
    let etapaLabel = '10A · Saldo Disponible';
    let etapaOrder = 1;
    if (isFw) { etapaLabel = 'FORWARDER · Facturado en Tránsito'; etapaOrder = 2; }
    else if (stage === 'dep') { etapaLabel = 'DEPCO · En Depósito Aduanero'; etapaOrder = 3; }
    else if (stage === 'p') { etapaLabel = 'P24 · Nacionalizado / Embarque'; etapaOrder = 4; }
    else if (stage === 'd') { etapaLabel = 'DROP · Cancelado por Marca'; etapaOrder = 5; }

    eventsList.push({
      temporada: r.season || r['Temporada'] || S.season,
      detalleCompra: det,
      regimen: r['Régimen'] || 'CONSUMO',
      stage,
      isFw,
      etapaLabel,
      etapaOrder,
      factura: r['Factura'] || '',
      fechaFactura: r['Fecha de factura'] || '',
      delivery: r['Delivery'] || '',
      embarque: emb,
      fechaIngreso: r['Fecha de ingreso embarque'] || '',
      lpnId: r['LPN ID'] || '',
      tallaSap: talSap,
      tallaMarca: talMarca,
      cantidad: qty,
      fob,
      valorNeto: vn,
      refCompra: String(r['Referencia compra'] || '').trim(),
      canalInicial: cIni,
      canalFinal: cFin,
      pvpIni: Number(r['PVP'] || 0),
      pvpFin: Number(r['PVP Final'] || 0),
      obs: r['OBS'] || ''
    });
  }

  // Buscar LPNs específicos en el historial DEPCO para este SKU
  const skuLpnBatches = [];
  for (const batch of (S.depcoLpnHistory || [])) {
    const hits = (batch.items || []).filter(it => String(it.codigo || '').trim().toUpperCase() === activeSku);
    if (hits.length) {
      skuLpnBatches.push({ embarque: batch.embarque, items: hits });
    }
  }

  eventsList.sort((a, b) => b.etapaOrder - a.etapaOrder || String(b.fechaFactura).localeCompare(String(a.fechaFactura)));
  const sizeMatrix = [...sizeMap.values()].sort((a, b) => {
    const na = parseFloat(a.tallaSap), nb = parseFloat(b.tallaSap);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return String(a.tallaSap).localeCompare(String(b.tallaSap));
  });

  const pctBar = v => (uTotalBought > 0 ? ((v / uTotalBought) * 100).toFixed(1) : '0.0');

  view.innerHTML = `
    <!-- Buscador Superior de SKU -->
    <div class="bg-white border rounded-lg p-4 mb-4 flex flex-wrap items-center justify-between gap-3">
      <div class="flex flex-wrap items-center gap-2.5 flex-1 min-w-[280px]">
        <div class="relative flex-1 max-w-md">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
          <input type="text" id="skuTraceInput" list="skuTraceDatalist" class="border-2 border-indigo-200 focus:border-indigo-600 rounded-md pl-9 pr-3 py-1.5 text-sm w-full bg-white font-semibold uppercase" placeholder="Escribe o elige un Código SKU (ej. ID3464, HP7011)..." value="${esc(activeSku)}">
          <datalist id="skuTraceDatalist">
            ${allSkusSorted.map(x => `<option value="${esc(x.cod)}">${esc(x.cod)} · ${esc(x.desc)} (${fn(x.totalUnits)} u.)</option>`).join('')}
          </datalist>
        </div>
        <button type="button" id="btnSkuTraceGo" class="btn btn-p !text-xs">
          <i data-lucide="route" class="w-4 h-4"></i> Rastrear SKU
        </button>
        <div class="inline-flex rounded-md border bg-slate-100 p-0.5 text-xs font-medium">
          <button type="button" id="btnSkuScopeSeason" class="px-2.5 py-1 rounded ${S.skuTrace.scope === 'season' ? 'bg-white text-slate-900 shadow-sm font-semibold' : 'text-slate-600'}">Solo ${esc(S.season)}</button>
          <button type="button" id="btnSkuScopeBrand" class="px-2.5 py-1 rounded ${S.skuTrace.scope === 'brand' ? 'bg-white text-slate-900 shadow-sm font-semibold' : 'text-slate-600'}">Todas las temp. ${esc(S.brand)}</button>
        </div>
      </div>
      <button type="button" id="btnExportSkuTrace" class="btn !bg-emerald-700 !text-white !border-emerald-700 hover:!bg-emerald-800 !text-xs">
        <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Exportar Ficha SKU
      </button>
    </div>

    <!-- Tarjeta de Identidad del Producto -->
    <div class="bg-white border rounded-lg p-4 mb-4 flex flex-wrap items-center justify-between gap-4">
      <div>
        <div class="flex items-center gap-2.5">
          <span class="px-2.5 py-1 rounded-md bg-slate-900 text-white font-mono font-bold text-base tracking-wide">${esc(activeSku)}</span>
          <h2 class="text-lg font-bold text-slate-900">${esc(skuInfo.desc || (tplEntry && tplEntry.descripcion) || 'Sin descripción')}</h2>
        </div>
        <div class="flex flex-wrap gap-3 text-xs text-slate-600 mt-1.5">

/* ============ VISTA CORPORATIVA: INGRESOS DE EMBARQUES POR MES Y SALDO FALTANTE ============ */
const MESES_ES = [
  'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
  'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
];

function parseYearMonth(dateStr) {
  const s = fdate(dateStr);
  if (!s) return null;
  if (/^\d{4}-\d{1,2}-\d{1,2}/.test(s)) {
    const parts = s.split('-');
    const y = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10);
    if (y > 2000 && m >= 1 && m <= 12) return { year: String(y), month: m };
  }
  return null;
}

function getRowIngresoDate(r) {
  // Prioridad absoluta: Fecha de ingreso embarque (colocada en la OC), luego Fecha de factura, luego Fecha de entrega
  return r['Fecha de ingreso embarque'] || r['Fecha de factura'] || r['Fecha de entrega'] || '';
}

function getRowPendienteDate(r) {
  // Para el saldo pendiente 10A, proyectar según Fecha de ingreso embarque (si tuviera) o Fecha de entrega / venta
  return r['Fecha de ingreso embarque'] || r['Fecha de entrega'] || r['Fecha de venta'] || '';
}

let lastCorpExportData = null;

function exportCorpExcel() {
  if (!lastCorpExportData) return modal('Sin datos', 'No hay información mensual para exportar.');
  const { brand, scopeLabel, year, rowsSummary, shipmentsDetail } = lastCorpExportData;
  const aoaSummary = [
    [`RESUMEN CORPORATIVO DE INGRESOS POR MES · ${brand.toUpperCase()} (${scopeLabel}) · AÑO ${year}`],
    [],
    ['Mes', 'Embarques del Mes', 'Unidades Ingresadas (P24)', 'FOB Ingresado ($)', 'Unidades Faltantes (10A)', 'FOB Faltante ($)', 'Total Proyectado Mes (Unid.)', '% Cumplimiento Mes'],
    ...rowsSummary.map(m => [
      m.label,
      m.shipmentsList.join(', ') || 'Sin embarques',
      m.p24Units,
      Math.round(m.p24Fob * 100) / 100,
      m.o10aUnits,
      Math.round(m.o10aFob * 100) / 100,
      m.p24Units + m.o10aUnits,
      m.pctStr
    ])
  ];
  const aoaEmbs = [
    ['Mes', 'Embarque', 'Temporada', 'Fecha Ingreso Embarque', 'Facturas', 'Líneas', 'Unidades', 'Valor FOB Neto ($)'],
    ...shipmentsDetail.map(e => [
      e.monthLabel, e.emb, e.season, e.fechaIngreso || '', e.facturas.join(', '), e.lines, e.units, Math.round(e.fob * 100) / 100
    ])
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaSummary), 'Resumen_Mensual');
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoaEmbs), 'Detalle_Embarques');
  XLSX.writeFile(wb, `RESUMEN_INGRESOS_MENSUAL_${brand}_${year}.xlsx`);
}

async function vCorp() {
  const view = $('view');
  view.innerHTML = `<div class="p-8 text-center text-sm text-slate-500">Calculando consolidado mensual corporativo…</div>`;
  await tick();

  const sourceRows = S.corp.scope === 'brand'
    ? await getAllBrandRows(S.brand)
    : S.rows;

  // Detectar años disponibles en los registros
  const yearsSet = new Set();
  for (const r of sourceRows) {
    const k = st(r);
    const ym = k === 'p' ? parseYearMonth(getRowIngresoDate(r)) : parseYearMonth(getRowPendienteDate(r));
    if (ym) yearsSet.add(ym.year);
  }
  const currentYearStr = String(new Date().getFullYear());
  if (!yearsSet.size) yearsSet.add(currentYearStr);
  const availableYears = [...yearsSet].sort();
  if (!S.corp.year || !availableYears.includes(S.corp.year)) {
    S.corp.year = availableYears.includes(currentYearStr) ? currentYearStr : availableYears[availableYears.length - 1];
  }
  const selYear = S.corp.year;

  // Estructura de 12 meses + índice 0 para "Sin fecha de ingreso / entrega asignada"
  const monthsData = Array.from({ length: 13 }, (_, idx) => ({
    idx,
    label: idx === 0 ? 'Sin fecha asignada' : MESES_ES[idx - 1],
    p24Units: 0,
    p24Fob: 0,
    o10aUnits: 0,
    o10aFob: 0,
    dropUnits: 0,
    shipments: new Map() // key: embName -> { emb, season, fechaIngreso, facturas: Set, lines, units, fob }
  }));

  let totalYearBoughtUnits = 0, totalYearBoughtFob = 0;
  let totalYearP24Units = 0, totalYearP24Fob = 0;
  let totalYear10AUnits = 0, totalYear10AFob = 0;
  let totalYearDropUnits = 0, totalYearDropFob = 0;
  let p24WithoutIngresoDate = 0;

  for (const r of sourceRows) {
    const k = st(r);
    const qty = Number(r['Cantidad'] || 0);
    const fob = Number(r['Valor Neto'] || calcValorNeto(r));

    if (k === 'p') {
      const ym = parseYearMonth(getRowIngresoDate(r));
      if (ym && ym.year !== selYear) continue;
      if (!r['Fecha de ingreso embarque']) p24WithoutIngresoDate += qty;

      const mIdx = ym ? ym.month : 0;
      const bucket = monthsData[mIdx];
      bucket.p24Units += qty;
      bucket.p24Fob += fob;
      totalYearP24Units += qty;
      totalYearP24Fob += fob;
      totalYearBoughtUnits += qty;
      totalYearBoughtFob += fob;

      const embName = String(r['EMBARQUE'] || '').trim() || 'SIN NOMBRE EMBARQUE';
      if (!bucket.shipments.has(embName)) {
        bucket.shipments.set(embName, {
          emb: embName,
          season: r.season || r['Temporada'] || S.season,
          fechaIngreso: r['Fecha de ingreso embarque'] || '',
          facturas: new Set(),
          lines: 0,
          units: 0,
          fob: 0
        });
      }
      const sh = bucket.shipments.get(embName);
      sh.lines++;
      sh.units += qty;
      sh.fob += fob;
      if (r['Factura']) sh.facturas.add(String(r['Factura']).trim());
      if (!sh.fechaIngreso && r['Fecha de ingreso embarque']) sh.fechaIngreso = r['Fecha de ingreso embarque'];
    } else if (k === 'o') {
      const ym = parseYearMonth(getRowPendienteDate(r));
      if (ym && ym.year !== selYear) continue;

      const mIdx = ym ? ym.month : 0;
      const bucket = monthsData[mIdx];
      bucket.o10aUnits += qty;
      bucket.o10aFob += fob;
      totalYear10AUnits += qty;
      totalYear10AFob += fob;
      totalYearBoughtUnits += qty;
      totalYearBoughtFob += fob;
    } else if (k === 'd') {
      const ym = parseYearMonth(getRowPendienteDate(r));
      if (ym && ym.year !== selYear) continue;
      const mIdx = ym ? ym.month : 0;
      monthsData[mIdx].dropUnits += qty;
      totalYearDropUnits += qty;
      totalYearDropFob += fob;
      totalYearBoughtUnits += qty;
      totalYearBoughtFob += fob;
    }
  }

  const orderedBuckets = [
    ...monthsData.slice(1),
    ...(monthsData[0].p24Units > 0 || monthsData[0].o10aUnits > 0 ? [monthsData[0]] : [])
  ];

  const rowsSummary = orderedBuckets.map(b => {
    const embArr = [...b.shipments.values()].sort((a, z) => z.units - a.units);
    const denom = b.p24Units + b.o10aUnits;
    const pct = denom > 0 ? (b.p24Units / denom) * 100 : 0;
    return {
      ...b,
      embArr,
      shipmentsList: embArr.map(x => `${x.emb} (${fn(x.units)})`),
      pct,
      pctStr: denom > 0 ? pct.toFixed(1) + '%' : '-'
    };
  });

  const shipmentsDetail = [];
  rowsSummary.forEach(m => {
    m.embArr.forEach(e => {
      shipmentsDetail.push({
        monthLabel: m.label,
        emb: e.emb,
        season: e.season,
        fechaIngreso: e.fechaIngreso,
        facturas: [...e.facturas],
        lines: e.lines,
        units: e.units,
        fob: e.fob
      });
    });
  });

  const scopeLabel = S.corp.scope === 'brand'
    ? `Todas las temporadas de ${S.brand}`
    : `${S.brand} ${S.season}`;

  lastCorpExportData = {
    brand: S.brand,
    scopeLabel,
    year: selYear,
    rowsSummary,
    shipmentsDetail
  };

  const execPct = (totalYearP24Units + totalYear10AUnits) > 0
    ? ((totalYearP24Units / (totalYearP24Units + totalYear10AUnits)) * 100).toFixed(1)
    : '0.0';

  const fallbackWarning = p24WithoutIngresoDate > 0
    ? `<div class="mb-4 p-3 rounded-lg bg-sky-50 border border-sky-200 text-sky-950 text-xs flex items-center gap-2">
         <i data-lucide="info" class="w-4 h-4 text-sky-700 shrink-0"></i>
         <span>Hay <b>${fn(p24WithoutIngresoDate)} unidades</b> en P24 de OCs anteriores que aún no tienen la columna <b>"Fecha de ingreso embarque"</b>; el sistema las ubicó usando su <b>Fecha de factura / entrega</b> como respaldo.</span>
       </div>`
    : '';

  view.innerHTML = `
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4 bg-white p-4 rounded-lg border">
      <div>
        <h2 class="text-base font-bold text-slate-900">Resumen Corporativo de Ingresos por Mes · ${esc(scopeLabel)}</h2>
        <p class="text-xs text-slate-500">Agrupado por <b>Fecha de ingreso embarque</b> (ingresos P24) y proyección de saldo pendiente por ingresar (10A).</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <div class="inline-flex rounded-md border bg-slate-100 p-0.5 text-xs font-medium">
          <button type="button" id="btnCorpScopeSeason" class="px-3 py-1.5 rounded ${S.corp.scope === 'season' ? 'bg-white text-slate-900 shadow-sm font-semibold' : 'text-slate-600 hover:text-slate-900'}">Solo ${esc(S.season)}</button>
          <button type="button" id="btnCorpScopeBrand" class="px-3 py-1.5 rounded ${S.corp.scope === 'brand' ? 'bg-white text-slate-900 shadow-sm font-semibold' : 'text-slate-600 hover:text-slate-900'}">Consolidado ${esc(S.brand)}</button>
        </div>
        <select id="selCorpYear" class="border rounded-md px-3 py-1.5 text-sm font-semibold bg-white text-slate-800">
          ${availableYears.map(y => `<option value="${y}" ${y === selYear ? 'selected' : ''}>Año ${y}</option>`).join('')}
        </select>
        <button type="button" onclick="exportCorpExcel()" class="btn !bg-emerald-700 !text-white !border-emerald-700">
          <i data-lucide="file-spreadsheet" class="w-4 h-4"></i>Exportar Resumen Anual
        </button>
      </div>
    </div>

    ${fallbackWarning}

    <div class="grid gap-3 grid-cols-2 xl:grid-cols-4 mb-5">
      ${kpi('Total Comprado (' + selYear + ')', fn(totalYearBoughtUnits), 'Incluye P24 + 10A + DROP', '', totalYearBoughtFob)}
      ${kpi('Ingresado / Embarcado (P24)', fn(totalYearP24Units), execPct + '% de avance sobre activo', 'border-l-4 border-l-emerald-600', totalYearP24Fob)}
      ${kpi('Faltante por Ingresar (10A)', fn(totalYear10AUnits), 'Saldo pendiente por embarcar', 'border-l-4 border-l-amber-500', totalYear10AFob)}
      ${kpi('Cancelado (DROP)', fn(totalYearDropUnits), 'Unidades caídas en el año', 'border-l-4 border-l-red-600', totalYearDropFob)}

function drawMx() {
  const f = S.f, q = f.q.toLowerCase();
  const rows = S.rows.filter(r => {
    if (f.etapa && st(r) !== f.etapa) return false;
    if (f.detalle && r['Detalle compra'] !== f.detalle) return false;
    if (f.canal && r['Canal Inicial'] !== f.canal && r['Referencia compra'] !== f.canal) return false;
    if (f.refCompra && r['Referencia compra'] !== f.refCompra) return false;
    if (f.canalFinal) {
      if (f.canalFinal === '__EMPTY__') {
        if (r['Canal Final']) return false;
      } else if (r['Canal Final'] !== f.canalFinal) {
        return false;
      }
    }
    if (f.embarque) {
      if (f.embarque === '__EMPTY__') {
        if (r['EMBARQUE']) return false;
      } else if (r['EMBARQUE'] !== f.embarque) {
        return false;
      }
    }
    if (f.quincena) {
      const qVal = getQuincena(r['Fecha de factura']);
      if (f.quincena === '__EMPTY__') {
        if (qVal) return false;
      } else if (qVal !== f.quincena) {
        return false;
      }
    }
    if (f.precioCambio === 'changed' && !hasPriceChange(r)) return false;
    if (q) {
      const hay = (String(r['Código']) + ' ' + String(r['Descripción']) + ' ' + String(r['Factura']) + ' ' + String(r['EMBARQUE']) + ' ' + String(r['Detalle compra'])).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const totalCantidad = rows.reduce((acc, r) => acc + (Number(r['Cantidad']) || 0), 0);
  const totalValorNeto = rows.reduce((acc, r) => acc + (Number(r['Valor Neto']) || calcValorNeto(r)), 0);
  const pg = rows.slice((S.page - 1) * S.size, S.page * S.size);
  const headers = ['Seg.', 'Detalle compra', 'Régimen', 'Código', 'Descripción', 'Color', 'Talla', 'Etapa', 'Ref. Compra', 'Canal Inicial', 'Canal Final', 'Cant.', 'FOB', 'Valor Neto', 'PVP', 'PVP Final', 'Factura', 'F. Factura', 'Embarque', 'F. Ingreso Emb.'];

  $('tbl').innerHTML = `
    <div class="bg-white border rounded-lg overflow-auto" style="max-height:calc(100vh - 300px)">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-slate-600">
            ${headers.map((h, i) => `<th class="px-3 py-2 whitespace-nowrap ${i >= 11 && i <= 15 ? 'text-right' : ''}">${h}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
          ${pg.map(r => {
            const pChanged = hasPriceChange(r);
            const pvpIni = Number(r['PVP'] || 0);
            const pvpFin = Number(r['PVP Final'] || 0);
            const badgePrecio = pChanged
              ? `<span class="ml-1 inline-flex items-center px-1.5 py-0.2 rounded text-[10px] font-bold ${pvpFin > pvpIni ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-sky-100 text-sky-800 border border-sky-300'}" title="PVP cambió de ${pvpIni.toFixed(2)} a ${pvpFin.toFixed(2)}">${pvpFin > pvpIni ? '▲' : '▼'}</span>`
              : '';
            const detBadge = r['Detalle compra'] === 'COMPRA EXTRA'
              ? 'bg-teal-50 text-teal-800 border-teal-200'
              : 'bg-slate-100 text-slate-700 border-slate-200';
            return `
            <tr class="r-${st(r)} border-t border-white/60">
              <td class="px-3 py-1.5">${esc(r['Seguimiento'])}</td>
              <td class="px-3 py-1.5 whitespace-nowrap"><span class="text-[11px] font-semibold px-2 py-0.5 rounded border ${detBadge}">${esc(r['Detalle compra'] || 'COMPRA CANAL')}</span></td>
              <td class="px-3 py-1.5 whitespace-nowrap"><span class="text-[10px] font-bold px-1.5 py-0.5 rounded ${String(r['Régimen'] || '').includes('DEPCO') ? 'bg-indigo-100 text-indigo-900 border border-indigo-200' : 'bg-slate-100 text-slate-600'}">${esc(r['Régimen'] || 'CONSUMO')}</span></td>
              <td class="px-3 py-1.5 font-medium"><button type="button" onclick="openSkuTrace('${esc(r['Código'])}')" class="text-indigo-900 font-bold hover:underline cursor-pointer text-left" title="Ver ciclo de vida completo de ${esc(r['Código'])}">${esc(r['Código'])}</button></td>
              <td class="px-3 py-1.5 max-w-[14rem] truncate" title="${esc(r['Descripción'])}">${esc(r['Descripción'])}</td>
              <td class="px-3 py-1.5">${esc(r['Color'])}</td>
              <td class="px-3 py-1.5">${esc(r['Talla'])}</td>
              <td class="px-3 py-1.5 whitespace-nowrap">${esc(String(r['Etapa']).split('-')[0])}</td>
              <td class="px-3 py-1.5 text-xs text-slate-500">${esc(r['Referencia compra'])}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Canal Inicial'] || '')}</td>
              <td class="px-3 py-1.5 font-semibold text-indigo-900">${esc(r['Canal Final'] || '')}</td>
              <td class="px-3 py-1.5 num font-semibold">${fn(r['Cantidad'])}</td>
              <td class="px-3 py-1.5 num text-slate-600">${Number(r['FOB'] || 0).toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-semibold text-slate-800">${fmoney(r['Valor Neto'] || calcValorNeto(r))}</td>
              <td class="px-3 py-1.5 num">${pvpIni.toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-semibold whitespace-nowrap ${pChanged ? 'text-amber-800 bg-amber-100/70' : 'text-emerald-800'}">${pvpFin ? pvpFin.toFixed(2) : '-'}${badgePrecio}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['Factura'])}</td>
              <td class="px-3 py-1.5 whitespace-nowrap text-xs text-slate-600">${esc(r['Fecha de factura'] || '')}</td>
              <td class="px-3 py-1.5 font-semibold text-slate-700 whitespace-nowrap">${esc(r['EMBARQUE'] || '')}</td>
              <td class="px-3 py-1.5 whitespace-nowrap text-xs font-medium text-sky-900">${esc(r['Fecha de ingreso embarque'] || '')}</td>
            </tr>
          `}).join('') || '<tr><td colspan="20" class="p-6 text-center text-slate-500">Sin resultados para estos filtros.</td></tr>'}
        </tbody>
        ${rows.length ? `
        <tfoot>
          <tr class="font-semibold text-slate-800 text-sm">
            <td colspan="11" class="px-3 py-2.5 text-right text-xs uppercase tracking-wider text-slate-500">Totales filtrados:</td>
            <td class="px-3 py-2.5 num font-bold text-slate-900 text-base">${fn(totalCantidad)}</td>
            <td class="px-3 py-2.5"></td>
            <td class="px-3 py-2.5 num font-bold text-indigo-950 text-base">${fmoney(totalValorNeto)}</td>
            <td colspan="6" class="px-3 py-2.5"></td>
          </tr>
        </tfoot>` : ''}
      </table>
    </div>
    ${pager(rows.length)}
  `;
}
function pager(n) {
  const pages = Math.max(1, Math.ceil(n / S.size));
  S.page = Math.min(S.page, pages);
  return `
    <div class="flex items-center gap-2 text-sm mt-3">
      <span class="text-slate-600">${fn(n)} filas</span>
      <span class="ml-auto"></span>
      <select class="border rounded px-2 py-1 bg-white" onchange="S.size=+this.value;S.page=1;drawMx()">
        ${[50, 100, 200].map(x => `<option ${x === S.size ? 'selected' : ''}>${x}</option>`).join('')}
      </select>
      <button class="btn" ${S.page < 2 ? 'disabled' : ''} onclick="S.page--;drawMx()">Anterior</button>
      <span>${S.page} / ${pages}</span>
      <button class="btn" ${S.page >= pages ? 'disabled' : ''} onclick="S.page++;drawMx()">Siguiente</button>
    </div>
  `;
}

/* ============ VISTA DEDICADA: DETALLE DE FACTURACIÓN CONSOLIDADO (CON TOTALES, FILTROS Y CRUCE SAP/EAN) ============ */
function exportFilteredBillingExcel(filteredRows, headers) {
  if (!filteredRows || !filteredRows.length) {
    return modal('Sin datos', 'No hay registros de facturación para exportar con los filtros actuales.');
  }
  const aoa = [
    headers,
    ...filteredRows.map(r => r.cells)
  ];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(aoa), `FACTURACION_${S.brand.toUpperCase()}`);
  XLSX.writeFile(wb, `DETALLE_FACTURACION_FILTRADO_${S.brand}_${new Date().toISOString().slice(0, 10)}.xlsx`);
}


/* ============ BORRAR UN DETALLE DE FACTURACIÓN CARGADO (Y OPCIONALMENTE REVERTIR SU IMPACTO EN P24 → 10A) ============ */
async function promptDeleteBillingBatch() {
  const hist = getBrandBillingHistory(S.brand);
  if (!hist.length) {
    return modal('Sin detalles de facturación', `No hay cargas de Detalle de Facturación guardadas en el historial de <b>${esc(S.brand)}</b>.`);
  }

  const isRbk = String(S.brand).toUpperCase().includes('REEBOK');
  const qtyIdx = isRbk ? 12 : 11;
  const netValIdx = isRbk ? 17 : 13;

  const listHtml = hist.map((b, idx) => {
    const uSum = (b.rows || []).reduce((a, r) => a + (Number(r.cells && r.cells[qtyIdx]) || 0), 0);
    const vSum = (b.rows || []).reduce((a, r) => a + (Number(r.cells && r.cells[netValIdx]) || 0), 0);
    const invText = (b.invoices && b.invoices.length) ? b.invoices.slice(0, 8).join(', ') + (b.invoices.length > 8 ? ` (+${b.invoices.length - 8})` : '') : 'Sin factura';
    return `
      <label class="flex items-start justify-between gap-3 p-3 border rounded-lg hover:bg-rose-50/40 cursor-pointer">
        <div class="flex items-start gap-2.5 min-w-0">
          <input type="radio" name="rbBillBatch" value="${esc(b.id)}" class="mt-1 accent-rose-700" ${idx === 0 ? 'checked' : ''}>
          <div class="min-w-0">
            <div class="font-bold text-slate-900 text-xs truncate">${esc(b.fileName || 'Detalle de Facturación')}</div>
            <div class="text-[11px] text-slate-500 mt-0.5">Cargado: <b>${esc(b.uploadedAt || '—')}</b> · ${fn((b.rows || []).length)} líneas</div>
            <div class="text-[11px] text-indigo-900 font-mono truncate mt-0.5" title="${esc((b.invoices || []).join(', '))}">Facturas: ${esc(invText)}</div>
          </div>
        </div>
        <div class="text-right shrink-0 text-xs">
          <div class="font-bold text-slate-900">${fn(uSum)} unid.</div>
          <div class="font-mono text-[11px] text-slate-600">${fmoney(vSum)}</div>
        </div>
      </label>
    `;
  }).join('');

  const ch = await modal(
    `Borrar Detalle de Facturación · ${esc(S.brand)}`,
    `<div class="space-y-3 text-slate-700">
       <p class="text-xs text-slate-600">Selecciona el detalle de facturación que deseas eliminar de <b>${esc(S.brand)}</b>:</p>
       <div class="space-y-2 max-h-64 overflow-y-auto pr-1">${listHtml}</div>
       <label class="flex items-start gap-2 p-2.5 rounded-lg bg-amber-50 border border-amber-200 text-xs text-amber-950 cursor-pointer">
         <input type="checkbox" id="chkRevertP24OnBillDelete" class="mt-0.5 accent-amber-700" checked>
         <span><b>También revertir las facturas de este detalle en la base de seguimiento (P24 → 10A)</b> para devolver sus unidades a saldo 10A disponible.</span>
       </label>
     </div>`,
    [['Cancelar', 'c'], ['Eliminar Detalle', 'del', 'danger']]
  );
  if (ch !== 'del') return;

  const selRadio = document.querySelector('input[name="rbBillBatch"]:checked');
  const batchId = selRadio ? selRadio.value : hist[0].id;
  const alsoRevert = $('chkRevertP24OnBillDelete') ? $('chkRevertP24OnBillDelete').checked : false;

  const targetBatch = hist.find(b => b.id === batchId);
  if (!targetBatch) return;

  busy('Eliminando detalle de facturación…');
  await tick();

  const invoicesToRevert = new Set(
    (targetBatch.invoices || []).map(x => String(x || '').trim()).filter(Boolean)
  );
  // También recolectar facturas directamente de las filas del lote
  (targetBatch.rows || []).forEach(r => {
    const inv = String((r.cells && r.cells[targetBatch.factIdx]) || '').trim();
    if (inv) invoicesToRevert.add(inv);
  });

  S.billingHistory[S.brand] = hist.filter(b => b.id !== batchId);
  if (S.lastBillingPreview && S.lastBillingPreview.brand === S.brand) {
    S.lastBillingPreview = S.billingHistory[S.brand][0] || null;
  }
  if (String(S.brand).toUpperCase().includes('REEBOK')) {
    purgeReebokDropAlertsByInvoices(invoicesToRevert);
    if (S.billingHistory[S.brand].length === 0) {
      S.reebokDropAlerts = [];
    }
  }

  let revertedUnits = 0;
  if (alsoRevert && invoicesToRevert.size > 0) {
    const normInvs = new Set([...invoicesToRevert].map(norm));
    const allBrandRows = await getAllBrandRows(S.brand);
    const bySeason = new Map();
    for (const r of allBrandRows) {
      if (st(r) === 'p' && normInvs.has(norm(r['Factura']))) {
        const sKey = r.sb || `${r.brand || S.brand}|${r.season || S.season}`;
        if (!bySeason.has(sKey)) bySeason.set(sKey, []);
        bySeason.get(sKey).push(r);
      }
    }

    for (const [sKey, sP24Rows] of bySeason.entries()) {
      const sRows = (sKey === sbKey()) ? S.rows : await dbSeason(sKey);
      const pool10A = new Map();
      sRows.forEach(r => {
        if (st(r) === 'o') {
          const k = `${norm(r['Código'])}|${norm(r['Color'])}|${normTalla(r['Talla'])}|${norm(r['Referencia compra'])}|${norm(r['Seguimiento'])}|${norm(r['Detalle compra'])}`;
          if (!pool10A.has(k)) pool10A.set(k, r);
        }
      });
      const toUpdate = new Set();
      const toDeleteIds = [];
      for (const r of sP24Rows) {
        const qty = Number(r['Cantidad'] || 0);
        revertedUnits += qty;
        const mergeKey = `${norm(r['Código'])}|${norm(r['Color'])}|${normTalla(r['Talla'])}|${norm(r['Referencia compra'])}|${norm(r['Seguimiento'])}|${norm(r['Detalle compra'])}`;
        const existing10A = pool10A.get(mergeKey);
        if (existing10A && existing10A.id !== r.id) {
          existing10A['Cantidad'] = (Number(existing10A['Cantidad']) || 0) + qty;
          existing10A['Valor Neto'] = calcValorNeto(existing10A);
          toUpdate.add(existing10A);
          if (r.id != null) toDeleteIds.push(r.id);
        } else {
          r['Etapa'] = E10;
          r['Factura'] = '';
          r['Fecha de factura'] = '';
          r['EMBARQUE'] = '';
          r['Fecha de ingreso embarque'] = '';
          r['Canal Final'] = '';
          r['PVP Final'] = 0;
          r['P4 Final'] = 0;
          r['PMY Final'] = 0;
          r['Valor Neto'] = calcValorNeto(r);
          toUpdate.add(r);
          pool10A.set(mergeKey, r);
        }
      }
      if (toUpdate.size) await dbPut([...toUpdate]);
      if (toDeleteIds.length) await dbDeleteIds(toDeleteIds);
    }
  }

  await saveMeta();
  if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
    pushCloudConfig().catch(() => {});
  }
  await reload();
  busy();

  modal(
    'Detalle de Facturación Eliminado',
    `Se eliminó <b>${esc(targetBatch.fileName || 'el detalle de facturación')}</b> de ${esc(S.brand)}.` +
    (alsoRevert ? `<br>Se devolvieron <b>${fn(revertedUnits)} unidades</b> de esas facturas a <b>10A</b>.` : '')
  );
}

      'Temporada', 'Factura', 'Fecha de factura', 'Delivery / PT', 'EMBARQUE',
      'Código', 'Talla marca', 'TALLA SAP', 'ID SAP', 'MAR SAP NUEVO', 'EAN SAP',
      'Descripción', 'Color', 'Grupo', 'CATEGORÍA', 'Actividad', 'Línea', 'Género',
      'Detalle compra', 'Referencia compra', 'Canal Inicial', 'Canal Final',
      'Cantidad', 'FOB', 'Valor Neto', 'PVP', 'PVP Final', 'Fecha de ingreso embarque'
    ];
    codIdx = 5;
    embIdx = 4;
    factIdx = 1;
    ptIdx = 3;
    qtyIdx = 22;
    netValIdx = 24;
    tempIdx = 0;
    canalIdx = 20;
    marSapIdx = 9;
    eanSapIdx = 10;

    unifiedRows = p24SeasonRows.map(r => {
      const embStr = String(r['EMBARQUE'] || '').trim() || 'FORWARDER';
      const isFw = embStr.toUpperCase() === 'FORWARDER';
      const cod = String(r['Código'] || '').trim();
      const codNorm = norm(cod);
      const rawTalMarca = String(r['Talla marca'] || r['Talla'] || '').trim();
      const existingSapTal = String(r['Talla'] || '').trim();
      const tempRow = String(r['Temporada'] || S.season).trim();
      const seasonTpl = tplBySeason[norm(tempRow)] || globalTplItems;
      const tplItem = seasonTpl ? seasonTpl[codNorm] : null;
      const rowGrupo = (tplItem && tplItem.grupo) ? tplItem.grupo : String(r['Grupo'] || '').trim();
      const talSap = resolveTallaSapFromGrid(
        rawTalMarca,
        (existingSapTal && existingSapTal !== rawTalMarca) ? existingSapTal : '',
        sizeLookup,
        [r],
        { brand: S.brand, material: cod, grupo: rowGrupo }
      );
      const idSap = `${cod} ${talSap}`.trim();
      const sapHit = lookupSapEanFromCatalog(S.brand, cod, talSap);
      const categoriaTipoVenta = getTplFieldFromEntry(tplItem, 'categoria', ['tipoventa', 'categoria']) || String(r['Categoría'] || '').trim();
      const vn = Number(r['Valor Neto'] || calcValorNeto(r));
      return {
        isForwarder: isFw,
        embarque: embStr,
        ptKey: normalizePtId(r['Delivery']),
        cells: [
          tempRow,
          r['Factura'] || '',
          r['Fecha de factura'] || '',
          r['Delivery'] || '',
          embStr,
          cod,
          rawTalMarca,
          talSap,
          idSap,
          sapHit ? sapHit.marSap : '',
          sapHit ? sapHit.eanSap : '',
          (tplItem && tplItem.descripcion) ? tplItem.descripcion : (r['Descripción'] || ''),
          r['Color'] || '',
          (tplItem && tplItem.grupo) ? tplItem.grupo : (r['Grupo'] || ''),
          categoriaTipoVenta,
          (tplItem && tplItem.actividad) ? tplItem.actividad : (r['Actividad'] || ''),
          (tplItem && tplItem.linea) ? tplItem.linea : (r['Línea'] || ''),
          (tplItem && tplItem.genero) ? tplItem.genero : (r['Género'] || ''),
          r['Detalle compra'] || 'COMPRA CANAL',
          r['Referencia compra'] || '',
          r['Canal Inicial'] || '',
          r['Canal Final'] || '',
          Number(r['Cantidad'] || 0),
          Number(r['FOB'] || 0),
          vn,
          Number(r['PVP'] || 0),
          Number(r['PVP Final'] || 0),
          r['Fecha de ingreso embarque'] || ''
        ]
      };
    });
  }

  const totalUnits = unifiedRows.reduce((a, r) => a + (Number(r.cells[qtyIdx]) || 0), 0);
  const totalFob = unifiedRows.reduce((a, r) => a + (Number(r.cells[netValIdx]) || 0), 0);
  const fwRows = unifiedRows.filter(r => r.isForwarder || String(r.embarque || '').toUpperCase() === 'FORWARDER');
  const fwUnits = fwRows.reduce((a, r) => a + (Number(r.cells[qtyIdx]) || 0), 0);
  const embUnits = totalUnits - fwUnits;
  const uniqueInvoices = new Set(unifiedRows.map(r => String(r.cells[factIdx] || '').trim()).filter(Boolean)).size;
  const missingSapLines = unifiedRows.filter(r => !String(r.cells[marSapIdx] || '').trim()).length;

  const embarquesList = [...new Set(unifiedRows.map(r => String(r.embarque || '').trim()).filter(Boolean))].sort();
  const codigosList = [...new Set(unifiedRows.map(r => String(r.cells[codIdx] || '').trim()).filter(Boolean))].sort();
  const facturasList = [...new Set(unifiedRows.map(r => String(r.cells[factIdx] || '').trim()).filter(Boolean))].sort();
  const tempsList = [...new Set(unifiedRows.map(r => String(r.cells[tempIdx] || '').trim()).filter(Boolean))].sort();
  const canalesList = [...new Set(unifiedRows.map(r => String(r.cells[canalIdx] || '').trim()).filter(Boolean))].sort();

  const bt = S.billTab;
  view.innerHTML = `
    ${isFallbackMode ? `
    <div class="p-3 rounded-lg bg-sky-50 border border-sky-200 text-sky-950 text-xs mb-3 flex flex-wrap items-center justify-between gap-2">
      <span>Mostrando las <b>${fn(unifiedRows.length)} líneas facturadas (P24)</b> de <b>${S.brand} ${esc(S.season)}</b> con todas sus columnas (${headers.length} cols). Al subir un nuevo archivo en <i>Cargar Detalle de Facturación</i> se mostrará el formato completo SAP de ${esc(S.brand)}.</span>
    </div>` : ''}

    <div class="grid gap-3 grid-cols-2 xl:grid-cols-4 mb-4">
      ${kpi('Total Facturado (' + S.brand + ')', fn(totalUnits), `${fn(uniqueInvoices)} factura(s) · ${fn(unifiedRows.length)} líneas`, 'border-l-4 border-l-sky-600', totalFob)}
      ${kpi('Con Embarque Asignado', fn(embUnits), 'PTs cruzados con COMEX', 'border-l-4 border-l-emerald-600')}
      ${kpi('Pendiente en FORWARDER', fn(fwUnits), `${fn(fwRows.length)} líneas esperando embarque`, 'border-l-4 border-l-amber-500')}
      <div class="bg-white rounded-lg border p-3.5 flex flex-col justify-between">
        <div class="text-xs font-semibold text-slate-600 flex items-center justify-between">
          <span>Cruce SAP / Embarques</span>
          ${missingSapLines > 0 ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 font-bold">${fn(missingSapLines)} sin SAP</span>` : `<span class="text-[10px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold">SAP OK</span>`}
        </div>
        <div class="flex flex-col gap-1.5 mt-2">
          <button type="button" onclick="promptSapCatalogManager()" class="btn !bg-sky-50 !text-sky-950 !border-sky-300 hover:!bg-sky-100 justify-center !text-xs !py-1.5">
            <i data-lucide="barcode" class="w-3.5 h-3.5 text-sky-700"></i> Actualizar MAR SAP y EAN
          </button>
          <div class="grid grid-cols-2 gap-1.5">
            <button type="button" onclick="openBillingWithPtsModal()" class="btn btn-p justify-center !text-[11px] !py-1.5 !px-2">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Facturación
            </button>
            <button type="button" onclick="$('fPtsAssign').dataset.mode=''; $('fPtsAssign').click()" class="btn !bg-teal-50 !text-teal-900 !border-teal-300 hover:!bg-teal-100 justify-center !text-[11px] !py-1.5 !px-2">
              <i data-lucide="ship" class="w-3.5 h-3.5"></i> PTs COMEX
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-white border rounded-lg p-3 mb-3 flex flex-wrap items-center gap-2">
      <div class="relative">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-2.5 top-2.5"></i>
        <input type="text" id="btSearch" class="border rounded pl-8 pr-3 py-1.5 text-sm w-56 bg-white" placeholder="Buscar Código, Factura, PT, SAP..." value="${esc(bt.q)}">
      </div>
      <select id="btEmb" class="border rounded px-2.5 py-1.5 text-sm bg-white font-medium">
        <option value="">Todos los embarques (${embarquesList.length})</option>
        <option value="__FORWARDER__">⚠️ Solo FORWARDER (${fn(fwRows.length)})</option>
        <option value="__ASSIGNED__">✓ Solo con Embarque asignado</option>
        ${embarquesList.map(e => `<option value="${esc(e)}" ${bt.embarque === e ? 'selected' : ''}>${esc(e)}</option>`).join('')}
      </select>
      <div class="relative flex items-center">
        <i data-lucide="hash" class="w-3.5 h-3.5 text-slate-400 absolute left-2.5 pointer-events-none"></i>
        <input type="text" id="btCod" list="btCodList" class="border rounded pl-7 pr-7 py-1.5 text-sm w-48 bg-white font-mono uppercase placeholder:normal-case placeholder:font-sans" placeholder="Filtrar código..." value="${esc(bt.codigo)}">
        <button type="button" id="btCodClear" class="${bt.codigo ? '' : 'hidden'} absolute right-2 text-slate-400 hover:text-slate-700 text-xs font-bold" title="Limpiar filtro de código">✕</button>
        <datalist id="btCodList">
          ${codigosList.map(c => `<option value="${esc(c)}">`).join('')}
        </datalist>
      </div>
      <select id="btFact" class="border rounded px-2.5 py-1.5 text-sm bg-white">
        <option value="">Todas las facturas (${facturasList.length})</option>
        ${facturasList.map(f => `<option value="${esc(f)}" ${bt.factura === f ? 'selected' : ''}>${esc(f)}</option>`).join('')}
      </select>
      <select id="btTemp" class="border rounded px-2.5 py-1.5 text-sm bg-white">
        <option value="">Todas las temporadas</option>
        ${tempsList.map(t => `<option value="${esc(t)}" ${bt.temporada === t ? 'selected' : ''}>${esc(t)}</option>`).join('')}
      </select>
      <select id="btCanal" class="border rounded px-2.5 py-1.5 text-sm bg-white">
        <option value="">Todos los canales</option>
        ${canalesList.map(c => `<option value="${esc(c)}" ${bt.canal === c ? 'selected' : ''}>${esc(c)}</option>`).join('')}
      </select>
      <div class="flex items-center gap-2 ml-auto">
        ${hist.length ? `<button type="button" onclick="promptDeleteBillingBatch()" class="btn btn-danger !text-xs" title="Eliminar un detalle de facturación cargado">
          <svg class="w-4 h-4 text-red-600 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg> Borrar Detalle
        </button>` : ''}
        <button type="button" id="btExportBtn" class="btn !bg-emerald-700 !text-white !border-emerald-700 hover:!bg-emerald-800 !text-xs">
          <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Descargar Excel Filtrado
        </button>
      </div>
    </div>

    <div id="btTableWrap"></div>
  `;

  $('btEmb').value = bt.embarque;
  $('btCod').value = bt.codigo;

  // Pre-indexar texto de búsqueda por fila para filtrado instantáneo (<5ms)
  for (let i = 0; i < unifiedRows.length; i++) {
    const uRow = unifiedRows[i];
    if (!uRow._qStr) {
      uRow._qStr = (uRow.cells.join(' ') + ' ' + String(uRow.embarque || '')).toLowerCase();
    }
  }

  let currentFiltered = [];
  const drawBillingTable = () => {
    const q = bt.q.trim().toLowerCase();
    const codFilter = bt.codigo.trim().toUpperCase();
    currentFiltered = unifiedRows.filter(r => {
      const isFw = r.isForwarder || String(r.embarque || '').toUpperCase() === 'FORWARDER';
      if (bt.embarque === '__FORWARDER__' && !isFw) return false;
      if (bt.embarque === '__ASSIGNED__' && isFw) return false;
      if (bt.embarque && !bt.embarque.startsWith('__') && r.embarque !== bt.embarque) return false;
      if (codFilter && !String(r.cells[codIdx] || '').trim().toUpperCase().includes(codFilter)) return false;
      if (bt.factura && String(r.cells[factIdx] || '').trim() !== bt.factura) return false;
      if (bt.temporada && String(r.cells[tempIdx] || '').trim() !== bt.temporada) return false;
      if (bt.canal && String(r.cells[canalIdx] || '').trim() !== bt.canal) return false;
      if (q && !r._qStr.includes(q)) return false;
      return true;
    });

    const filtUnits = currentFiltered.reduce((a, r) => a + (Number(r.cells[qtyIdx]) || 0), 0);
    const filtFob = currentFiltered.reduce((a, r) => a + (Number(r.cells[netValIdx]) || 0), 0);
    const totalPages = Math.max(1, Math.ceil(currentFiltered.length / bt.size));
    if (bt.page > totalPages) bt.page = totalPages;
    const slice = currentFiltered.slice((bt.page - 1) * bt.size, bt.page * bt.size);

    $('btTableWrap').innerHTML = `
      <div class="bg-white border rounded-lg overflow-auto" style="max-height:calc(100vh - 395px)">
        <table class="w-full text-xs border-collapse">
          <thead>
            <tr class="text-left text-slate-700 bg-slate-100 border-b">
              ${headers.map((h, idx) => `<th class="px-2.5 py-2 whitespace-nowrap border-r border-slate-200/70 font-semibold ${idx === qtyIdx || idx === netValIdx ? 'text-right' : ''} ${idx === codIdx ? 'sticky left-0 z-10 bg-slate-100 shadow-[1px_0_0_#cbd5e1]' : ''}">${esc(h)}</th>`).join('')}
            </tr>
          </thead>
          <tbody>
            ${slice.map(r => {
              const isFw = r.isForwarder || String(r.embarque || '').toUpperCase() === 'FORWARDER';
              const rowBg = isFw ? 'bg-amber-50/50 hover:bg-amber-100/60' : 'hover:bg-sky-50/40';
              return `<tr class="border-t ${rowBg}">
                ${headers.map((_, idx) => {
                  const val = idx === embIdx ? r.embarque : r.cells[idx];
                  const isNum = typeof val === 'number';
                  const disp = isNum
                    ? (idx === netValIdx ? fmoney(val) : (Number.isInteger(val) ? fn(val) : val.toFixed(2)))
                    : esc(val ?? '');
                  let cellHtml = disp;
                  if (idx === embIdx) {
                    cellHtml = isFw
                      ? `<span class="px-1.5 py-0.5 rounded bg-amber-100 text-amber-900 border border-amber-300 font-bold text-[11px]">FORWARDER</span>`
                      : `<span class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-900 border border-emerald-300 font-bold text-[11px]">${disp}</span>`;
                  } else if (idx === marSapIdx && val) {
                    cellHtml = `<span class="font-mono font-bold text-sky-900">${disp}</span>`;
                  } else if (idx === eanSapIdx && val) {
                    cellHtml = `<span class="font-mono text-emerald-800">${disp}</span>`;
                  }
                  return `<td class="px-2.5 py-1.5 whitespace-nowrap border-r border-slate-100 ${isNum ? 'num' : ''} ${idx === qtyIdx || idx === netValIdx ? 'font-semibold' : ''} ${idx === codIdx ? 'sticky left-0 bg-white font-bold text-slate-900 shadow-[1px_0_0_#e2e8f0]' : ''}">${cellHtml}</td>`;
                }).join('')}
              </tr>`;
            }).join('') || `<tr><td colspan="${headers.length}" class="p-8 text-center text-slate-400">No se encontraron líneas con los filtros seleccionados.</td></tr>`}
          </tbody>
          ${currentFiltered.length ? `
          <tfoot>
            <tr class="font-bold text-slate-900 bg-slate-100 border-t-2 border-slate-300">
              ${headers.map((_, idx) => {
                if (idx === 0) return `<td class="px-2.5 py-2.5 whitespace-nowrap text-xs uppercase tracking-wider text-slate-600 sticky left-0 bg-slate-100">TOTAL FILTRADO (${fn(currentFiltered.length)} filas)</td>`;
                if (idx === qtyIdx) return `<td class="px-2.5 py-2.5 num text-slate-950 text-sm bg-emerald-50/80 border-x border-slate-200">${fn(filtUnits)}</td>`;
                if (idx === netValIdx) return `<td class="px-2.5 py-2.5 num text-indigo-950 text-sm bg-indigo-50/80 border-x border-slate-200">${fmoney(filtFob)}</td>`;
                return `<td class="px-2.5 py-2.5"></td>`;
              }).join('')}
            </tr>
          </tfoot>` : ''}
        </table>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-2 text-xs mt-3 bg-white border rounded-lg px-4 py-2.5">
        <div class="flex flex-wrap items-center gap-4 text-slate-700">
          <span>Mostrando <b>${fn(currentFiltered.length)}</b> de <b>${fn(unifiedRows.length)}</b> líneas</span>
          <span class="px-2.5 py-1 rounded bg-emerald-50 border border-emerald-200 text-emerald-950">Total Cantidad: <b class="text-sm">${fn(filtUnits)} unid.</b></span>
          <span class="px-2.5 py-1 rounded bg-indigo-50 border border-indigo-200 text-indigo-950">Total Valor Neto: <b class="text-sm">${fmoney(filtFob)}</b></span>
        </div>
        <div class="flex items-center gap-2">
          <select id="btPageSize" class="border rounded px-2 py-1 bg-white">
            ${[50, 100, 200].map(sz => `<option value="${sz}" ${bt.size === sz ? 'selected' : ''}>${sz}</option>`).join('')}
          </select>
          <button type="button" id="btPrev" class="btn !py-1 !px-2.5 !text-xs" ${bt.page <= 1 ? 'disabled' : ''}>Anterior</button>
          <span class="font-medium text-slate-700">${bt.page} / ${totalPages}</span>
          <button type="button" id="btNext" class="btn !py-1 !px-2.5 !text-xs" ${bt.page >= totalPages ? 'disabled' : ''}>Siguiente</button>
        </div>
      </div>
    `;

    $('btPageSize').onchange = e => { bt.size = Number(e.target.value); bt.page = 1; drawBillingTable(); };
    $('btPrev').onclick = () => { if (bt.page > 1) { bt.page--; drawBillingTable(); } };
    $('btNext').onclick = () => { if (bt.page < totalPages) { bt.page++; drawBillingTable(); } };
  };

  let timer;
  const onFilterChange = () => {
    bt.q = $('btSearch').value;
    bt.embarque = $('btEmb').value;
    bt.codigo = $('btCod').value;
    bt.factura = $('btFact').value;
    bt.temporada = $('btTemp').value;
    bt.canal = $('btCanal').value;
    bt.page = 1;
    clearTimeout(timer);
    timer = setTimeout(drawBillingTable, 150);
  };

  ['btSearch', 'btEmb', 'btCod', 'btFact', 'btTemp', 'btCanal'].forEach(id => {
    $(id).oninput = () => {
      if ($('btCodClear')) $('btCodClear').classList.toggle('hidden', !$('btCod').value.trim());
      onFilterChange();
    };
  });
  if ($('btCodClear')) {
    $('btCodClear').onclick = () => {
      $('btCod').value = '';
      $('btCodClear').classList.add('hidden');
      onFilterChange();
    };
  }
  $('btExportBtn').onclick = () => exportFilteredBillingExcel(currentFiltered, headers);

  icons();
  drawBillingTable();
}

              <td class="px-3 py-1.5 max-w-[14rem] truncate" title="${esc(r['Descripción'])}">${esc(r['Descripción'])}</td>
              <td class="px-3 py-1.5">${esc(r['Color'])}</td>
              <td class="px-3 py-1.5">${esc(r['Talla'])}</td>
              <td class="px-3 py-1.5">${esc(r['Canal Inicial'] || '')}</td>
              <td class="px-3 py-1.5 font-semibold text-indigo-900">${esc(r['Canal Final'] || '')}</td>
              <td class="px-3 py-1.5 font-medium">${esc(r['EMBARQUE'] || '')}</td>
              <td class="px-3 py-1.5">${esc(r['Factura'] || '')}</td>
              <td class="px-3 py-1.5 num font-bold">${fn(r['Cantidad'])}</td>
              <td class="px-3 py-1.5 num text-slate-600">${ini.toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-bold text-slate-900">${fin.toFixed(2)}</td>
              <td class="px-3 py-1.5 num font-bold whitespace-nowrap ${up ? 'text-amber-700' : 'text-sky-700'}">
                ${up ? '+' : ''}${diff.toFixed(2)} (${up ? '▲ Sube' : '▼ Baja'})
              </td>
            </tr>
          `}).join('') || '<tr><td colspan="13" class="p-8 text-center text-slate-500">No se detectan cambios entre PVP Inicial y PVP Final en esta temporada.</td></tr>'}
        </tbody>
      </table>
    </div>
  `;
}


function getReebokDropPriorityScore(canalName) {
  const raw = String(canalName || '').trim().toUpperCase();
  if (!raw) return 50;
  const resolved = resolverCanalInicial(raw, 'Reebok');
  const unif = resolverCanalUnificado(raw);

  // Mayor puntaje = MAYOR prioridad para DROPEAR (sacrificar primero)
  // Menor puntaje = MÁS PROTEGIDO (entregar completo; nunca quitarle unidades si hay WEB/MARATHON/OUTLET)
  // Regla operativa:
  // 1° Protegido: MAYORISTA (10)
  // 2° Protegido: TIENDAS (20) - incluye Web Reebok Medeport / Tiendas; SIEMPRE protegido antes que MARATHON y WEB
  // 3° Protegido: TAF (55)
  // 4° Pool Unificado Producto (MARATHON + WEB): MARATHON (75) y WEB puro (92) -> WEB se sacrifica primero y se complementa con MARATHON
  // 5° Máxima prioridad de drop: OUTLET (100)
  if (raw === 'OUTLET' || resolved === 'OUTLET') return 100;
  if (raw === 'WEB' || raw === 'EXCLUSIVO WEB') return 92; // WEB puro (se sacrifica primero; Producto lo complementa con MARATHON)
  if (['MARATHON', 'BIG HEAD', 'EXPLORER', 'SNEAKERS', 'TELESHOP', 'POP UP', 'SPOMA', 'MARKETING'].includes(resolved)) return 75;
  if (raw === 'TAF' || resolved === 'TAF') return 55;
  if (resolved === 'TIENDAS' || unif === 'TIENDAS') return 20; // Protegido antes que MARATHON y WEB
  if (unif === 'MAYORISTA' || ['MAYORISTA', 'KAO', 'EDCA'].includes(raw)) return 10; // Máxima protección
  return 50;
}

function pickPreferredReebokDropChannel(channels10A, dropQty = 0) {
  if (!Array.isArray(channels10A) || !channels10A.length) return '';
  const sorted = [...channels10A].sort((a, b) => {
    const scoreA = getReebokDropPriorityScore(a.canal);
    const scoreB = getReebokDropPriorityScore(b.canal);
    if (scoreB !== scoreA) return scoreB - scoreA;
    // En empate de prioridad, preferir el canal que alcance a cubrir las unidades dropeadas
    const coverA = Number(a.avail || 0) >= dropQty ? 1 : 0;
    const coverB = Number(b.avail || 0) >= dropQty ? 1 : 0;
    if (coverB !== coverA) return coverB - coverA;
    return Number(b.avail || 0) - Number(a.avail || 0);
  });
  return sorted[0].canal;
}

/* ============ GESTIÓN DE DROPS PARCIALES REEBOK (ELECCIÓN DE CANAL POR SKU Y TALLA) ============ */
async function dismissPendingReebokDrops() {
  const activeSeasonNorm = norm(S.season);
  const pendingCount = (S.reebokDropAlerts || []).filter(a => a.status !== 'APPLIED' && (!a.temporada || norm(a.temporada) === activeSeasonNorm)).length;
  if (!pendingCount) return;
  const ok = await modal(
    'Descartar Alertas de DROP Reebok',
    `¿Deseas eliminar las <b>${fn(pendingCount)} alertas de DROP pendientes</b> de <b>Reebok ${esc(S.season)}</b>? Esta acción limpia la notificación sin modificar tu inventario.`,
    [['Cancelar', 'c'], ['Sí, descartar alertas', 'yes', 'danger']]
  );
  if (ok !== 'yes') return;
  S.reebokDropAlerts = (S.reebokDropAlerts || []).filter(a => !(a.status !== 'APPLIED' && (!a.temporada || norm(a.temporada) === activeSeasonNorm)));
  await saveMeta();
  if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
    pushCloudConfig().catch(() => {});
  }
  render();
}

async function applyReebokDropsToDatabase(selectionsMap) {
  busy('Aplicando DROPs a los canales seleccionados en Reebok…');
  await tick();

  const allReebokRows = await getAllBrandRows('Reebok');
  const changed = new Set();
  const added = [];
  const affectedSeasons = new Set();
  let totalDroppedUnits = 0;

  for (const alertItem of (S.reebokDropAlerts || [])) {
    if (alertItem.status === 'APPLIED') continue;
    const chosenCanal = selectionsMap.get(alertItem.id);
    if (!chosenCanal) continue;

    const codNorm = norm(alertItem.material);
    const talNorm = normTalla(alertItem.tallaSap);
    const gridNorm = normTalla(alertItem.gridValue);
    const targetCanalNorm = norm(chosenCanal);

    const allSkuSize10A = allReebokRows.filter(r =>
      st(r) === 'o' &&
      Number(r['Cantidad'] || 0) > 0 &&
      norm(r['Código']) === codNorm &&
      (normTalla(r['Talla']) === talNorm || (gridNorm && normTalla(r['Talla marca']) === gridNorm) || normTalla(r['Talla']) === gridNorm)
    );

    // Priorizar el canal elegido por el usuario, luego otros canales si hiciera falta completar
    allSkuSize10A.sort((a, b) => {
      const ca = norm(a['Canal Inicial'] || resolverCanalInicial(a['Referencia compra'], 'Reebok'));
      const cb = norm(b['Canal Inicial'] || resolverCanalInicial(b['Referencia compra'], 'Reebok'));
      return (cb === targetCanalNorm ? 1 : 0) - (ca === targetCanalNorm ? 1 : 0);
    });

    let rem = Number(alertItem.dropQty || 0);
    for (let i = 0; i < allSkuSize10A.length && rem > 0; i++) {
      const baseRow = allSkuSize10A[i];
      const avail = Number(baseRow['Cantidad'] || 0);
      if (avail <= 0 || st(baseRow) !== 'o') continue;
      affectedSeasons.add(baseRow.season || S.season);

      if (avail <= rem) {
        rem -= avail;
        totalDroppedUnits += avail;
        baseRow['Etapa'] = ED;
        baseRow['Canal Final'] = chosenCanal;
        if (alertItem.invoices) baseRow['Factura'] = alertItem.invoices;
        baseRow['OBS'] = `DROP REEBOK (${chosenCanal})`.trim();
        baseRow['Valor Neto'] = calcValorNeto(baseRow);
        changed.add(baseRow);
      } else {
        const dropSplit = { ...baseRow };
        delete dropSplit.id;
        dropSplit['Cantidad'] = rem;
        dropSplit['Etapa'] = ED;
        dropSplit['Canal Final'] = chosenCanal;
        if (alertItem.invoices) dropSplit['Factura'] = alertItem.invoices;
        dropSplit['OBS'] = `DROP REEBOK (${chosenCanal})`.trim();
        dropSplit['Valor Neto'] = calcValorNeto(dropSplit);

        baseRow['Cantidad'] = avail - rem;
        baseRow['Valor Neto'] = calcValorNeto(baseRow);
        totalDroppedUnits += rem;
        rem = 0;
        changed.add(baseRow);
        added.push(dropSplit);
      }
    }

    // Si no había suficiente saldo 10A en base, registrar el remanente directamente en DROP para que quede trazabilidad
    if (rem > 0) {
      const newDropRow = {
        'Seguimiento': '',
        'Detalle compra': 'COMPRA CANAL',
        'Temporada': alertItem.temporada || S.season,
        'Marca': 'Reebok',
        'Grupo': '',
        'Categoría': '',
        'Actividad': '',
        'Línea': '',
        'Referencia compra': chosenCanal,
        'Canal Inicial': chosenCanal,
        'Canal Final': chosenCanal,
        'Código': alertItem.material,
        'Color': alertItem.color || '',
        'Talla': alertItem.tallaSap,
        'Talla marca': alertItem.gridValue || alertItem.tallaSap,
        'Descripción': alertItem.descripcion || '',
        'Género': '',
        'Fecha de entrega': '',
        'Fecha de venta': '',
        'Cantidad': rem,
        'FOB': alertItem.fob || 0,
        'Valor Neto': Math.round((alertItem.fob || 0) * rem * 10000) / 10000,
        'PVP': 0,
        'PVP Final': 0,
        'PVP retail': 0,
        'P4': 0,
        'P4 Final': 0,
        'PMY': 0,
        'PMY Final': 0,
        'Etapa': ED,
        'Régimen': 'CONSUMO',
        'LPN ID': '',
        'Documento': '',
        'EMBARQUE': '',
        'Fecha estimada inicio': '',
        'Fecha real inicio': '',
        'Fecha estimada fin': '',
        'Fecha real fin': '',
        'Factura': alertItem.invoices || '',
        'Delivery': alertItem.pts || '',
        'Fecha de factura': '',
        'Fecha de ingreso embarque': '',
        'OBS': `DROP REEBOK (${chosenCanal})`,
        sb: `Reebok|${alertItem.temporada || S.season}`,
        brand: 'Reebok',
        season: alertItem.temporada || S.season
      };
      added.push(newDropRow);
      totalDroppedUnits += rem;
      affectedSeasons.add(alertItem.temporada || S.season);
    }

    alertItem.selectedCanal = chosenCanal;
    alertItem.status = 'APPLIED';
    alertItem.appliedAt = new Date().toLocaleString('es-EC', { dateStyle: 'short', timeStyle: 'short' });
  }

  if (changed.size) await dbPut([...changed]);
  if (added.length) await dbAdd(added);
  await saveMeta();
  await reload();
  busy();

  if (S.cloud.dirHandle && S.cloud.autoSync && S.cloud.connected) {
    await pushCloudConfig();
    for (const sName of affectedSeasons) {
      await pushCloudBuySeason('Reebok', sName, true);
    }
  }

  modal('DROPs Aplicados con Éxito', `Se pasaron <b>${fn(totalDroppedUnits)} unidades</b> a estado <b>DROP-CANCELADO MARCA</b> en los canales seleccionados.`);
}

  const wb = XLSX.utils.book_new();

  const pivotAoa = [

      g.fobUnit,
      Math.round(g.totalFob * 100) / 100,
      g.sizeList.map(sz => `${sz.talla}: ${sz.qty}u (${Object.entries(sz.byCanal).map(([cn, q]) => `${cn}:${q}`).join(', ')})`).join(' | ')
    ])
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(pivotAoa), 'Tabla_Dinamica_SKU');

  // Hoja 2: Matriz SKU x Talla
  const matrixHeaders = ['Código', 'Descripción', 'Color', ...allTallas, 'Total DROP'];
  const matrixAoa = [
    [`MATRIZ DE DROPS POR TALLA · ${S.brand.toUpperCase()} ${S.season}`],
    [],
    matrixHeaders,
    ...skuGroups.map(g => [
      g.codigo,
      g.descripcion,
      g.color,
      ...allTallas.map(t => g.byTalla[t] || 0),
      g.totalQty
    ])
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(matrixAoa), 'Matriz_Por_Talla');

  // Hoja 3: Base Detallada
  const detailAoa = [
    ['Detalle compra', 'Código', 'Descripción', 'Color', 'Talla', 'Ref. Compra', 'Canal Inicial', 'Canal Final', 'Factura', 'EMBARQUE', 'Cantidad', 'FOB', 'Valor Neto', 'OBS'],
    ...rawDropRows.map(r => [
      r['Detalle compra'] || '', r['Código'], r['Descripción'], r['Color'], r['Talla'],
      r['Referencia compra'], r['Canal Inicial'], r['Canal Final'], r['Factura'] || '',
      r['EMBARQUE'], r['Cantidad'], r['FOB'] || 0, r['Valor Neto'] || 0, r['OBS'] || ''
    ])
  ];
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detailAoa), 'Detalle_Filas');
  XLSX.writeFile(wb, `REPORTE_DINAMICO_DROPS_${S.brand}_${S.season}.xlsx`);
}

function vDrop() {
  const view = $('view');
  const allDropRows = S.rows.filter(r => st(r) === 'd');
  const pendingRbkDrops = S.brand === 'Reebok'
    ? (S.reebokDropAlerts || []).filter(a => a.status !== 'APPLIED' && (!a.temporada || norm(a.temporada) === norm(S.season)))
    : [];
  const pendingRbkUnits = pendingRbkDrops.reduce((a, x) => a + Number(x.dropQty || 0), 0);

  const rbkDropBanner = pendingRbkDrops.length > 0

         <div class="flex items-start gap-3">
           <div class="p-2 rounded-lg bg-rose-100 text-rose-700 shrink-0"><i data-lucide="alert-octagon" class="w-5 h-5"></i></div>
           <div>
             <div class="font-bold text-rose-950 text-sm">Alertas de DROP Reebok Pendientes por Asignar Canal (${fn(pendingRbkDrops.length)} talla(s) · ${fn(pendingRbkUnits)} unid.)</div>
             <div class="text-xs text-rose-800 mt-0.5">Hay códigos con entrega parcial en facturación esperando que definas con Producto a qué canal inicial se le dropean esas unidades.</div>

             <i data-lucide="sliders-horizontal" class="w-4 h-4"></i> Asignar Canales DROP Ahora
           </button>
         </div>
       </div>`
    : '';

  const dt = S.dropTab || { viewMode: 'pivot', q: '', canal: '', factura: '', expandedSku: null };
  S.dropTab = dt;

  // Catálogos para filtros
  const canalesSet = new Set();
  const facturasSet = new Set();
  allDropRows.forEach(r => {
    const c = String(r['Canal Final'] || r['Canal Inicial'] || r['Referencia compra'] || 'SIN CANAL').trim().toUpperCase();
    if (c) canalesSet.add(c);
    const f = String(r['Factura'] || '').trim();
    if (f) facturasSet.add(f);
  });
  const canalesList = [...canalesSet].sort();
  const facturasList = [...facturasSet].sort();

  // Filtrar filas
  const qNorm = dt.q.trim().toLowerCase();
  const filteredRows = allDropRows.filter(r => {
    const c = String(r['Canal Final'] || r['Canal Inicial'] || r['Referencia compra'] || 'SIN CANAL').trim().toUpperCase();
    if (dt.canal && c !== dt.canal) return false;
    if (dt.factura && String(r['Factura'] || '').trim() !== dt.factura) return false;
    if (qNorm) {
      const hay = `${r['Código']} ${r['Descripción']} ${r['Color']} ${r['Talla']} ${c} ${r['Factura']} ${r['EMBARQUE']}`.toLowerCase();
      if (!hay.includes(qNorm)) return false;
    }
    return true;
  });

  // KPIs globales sobre filtrado
  const totalUnits = filteredRows.reduce((a, r) => a + Number(r['Cantidad'] || 0), 0);
  const totalFob = filteredRows.reduce((a, r) => a + (Number(r['Valor Neto']) || calcValorNeto(r)), 0);
  const uniqueSkusCount = new Set(filteredRows.map(r => String(r['Código'] || '').trim().toUpperCase())).size;

  // Resumen por Canal (Tarjetas / Barras de distribución)
  const canalTotalsMap = new Map();
  filteredRows.forEach(r => {
    const c = String(r['Canal Final'] || r['Canal Inicial'] || r['Referencia compra'] || 'SIN CANAL').trim().toUpperCase();
    if (!canalTotalsMap.has(c)) canalTotalsMap.set(c, { canal: c, units: 0, fob: 0, skus: new Set() });
    const entry = canalTotalsMap.get(c);
    entry.units += Number(r['Cantidad'] || 0);
    entry.fob += Number(r['Valor Neto']) || calcValorNeto(r);
    entry.skus.add(String(r['Código'] || '').trim().toUpperCase());
  });
  const canalBreakdown = [...canalTotalsMap.values()].sort((a, b) => b.units - a.units);
  const allCanalesCols = canalBreakdown.map(x => x.canal);

  // Tallas ordenadas
  const tallasSet = new Set(filteredRows.map(r => String(r['Talla'] || '').trim()).filter(Boolean));
  const allTallasCols = [...tallasSet].sort((a, b) => {
    const na = parseFloat(a), nb = parseFloat(b);
    if (!isNaN(na) && !isNaN(nb)) return na - nb;
    return a.localeCompare(b);
  });

  // Agrupación Dinámica por SKU -> Talla -> Canal
